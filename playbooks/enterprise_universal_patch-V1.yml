---
# =============================================================================
# enterprise_universal_patch.yml
# =============================================================================
#
# UNIVERSAL ENTERPRISE SOFTWARE PATCHING
#
# Purpose:
#   Automatically discover and update software installed on Debian-family
#   Linux systems using the appropriate package/update mechanism.
#
# Supported update mechanisms:
#
#   APT / DPKG
#   Snap
#   Python / pip
#   npm global packages
#   Node.js installed through APT / NodeSource
#   Node.js installed through NVM
#   Docker Engine / Docker CLI / containerd / Compose
#   Docker images
#
# Also:
#
#   - Detects operating system and version
#   - Detects architecture
#   - Detects kernel
#   - Handles Ubuntu phased updates
#   - Repairs interrupted dpkg
#   - Repairs broken dependencies
#   - Removes obsolete dependencies
#   - Removes obsolete kernels through APT autoremove
#   - Removes explicitly unwanted packages
#   - Cleans APT cache
#   - Detects held packages
#   - Detects unmanaged/manual software
#   - Detects reboot requirement
#   - Performs post-patch health checks
#   - Produces AWX-friendly report
#
# IMPORTANT:
#
# This playbook does NOT perform:
#
#   Ubuntu 22.04 -> Ubuntu 24.04
#   Ubuntu 24.04 -> Ubuntu 26.04
#
# Major OS release upgrades must be a separate controlled workflow.
#
# It also does not blindly replace manually compiled binaries.
#
# =============================================================================


- name: Enterprise Universal Software Patching
  hosts: all
  become: true
  gather_facts: true

  vars:

    # =========================================================================
    # MASTER CONTROLS
    # =========================================================================

    patch_apt: true
    patch_snap: true
    patch_python: true
    patch_npm: true
    patch_nodejs: true
    patch_docker_engine: true
    patch_docker_images: true

    # Ubuntu phased updates
    include_phased_updates: true

    # =========================================================================
    # CLEANUP
    # =========================================================================

    cleanup_unused_packages: true
    cleanup_old_kernels: true
    clean_apt_cache: true

    # =========================================================================
    # REBOOT
    # =========================================================================

    reboot_if_required: true

    reboot_timeout: 900

    reboot_post_delay: 20

    # =========================================================================
    # PIP
    # =========================================================================

    pip_executable: pip3

    #
    # Ubuntu 24.04 uses PEP 668.
    #
    # false:
    #   Do not modify externally managed system Python.
    #
    # true:
    #   Permit pip to modify externally managed Python installation.
    #
    pip_break_system_packages: false

    # =========================================================================
    # NODE.JS
    # =========================================================================

    #
    # For APT/NodeSource installations:
    #   APT handles the upgrade.
    #
    # For NVM:
    #   Detect installed NVM environments and report/update according to policy.
    #
    nodejs_update_nvm: false

    #
    # NVM major-version policy.
    #
    # false:
    #   Stay within the installed major version where possible.
    #
    # true:
    #   Allow NVM to install the latest LTS major version.
    #
    nodejs_allow_major_upgrade: false

    # =========================================================================
    # NPM
    # =========================================================================

    npm_update_global_packages: true

    # =========================================================================
    # DOCKER
    # =========================================================================

    #
    # Docker Engine packages are updated through APT if they are installed
    # through an APT repository.
    #
    docker_update_engine: true

    #
    # Pull newer versions of currently referenced images.
    #
    # This does NOT automatically recreate containers.
    #
    docker_update_images: true

    #
    # Never automatically stop/remove/recreate production containers.
    #
    docker_recreate_containers: false

    #
    # Docker image cleanup.
    #
    docker_prune_unused_images: false

    # =========================================================================
    # UNWANTED SOFTWARE
    # =========================================================================
    #
    # Explicitly list software that must not be installed.
    #
    # Example:
    #
    # unwanted_packages:
    #   - telnet
    #   - rsh-client
    #   - rsh-redone
    #   - talk
    #   - nis
    #
    unwanted_packages: []

    # =========================================================================
    # UNWANTED SERVICES
    # =========================================================================

    unwanted_services: []

    # =========================================================================
    # OPTIONAL SECURITY SOFTWARE
    # =========================================================================

    install_security_utilities: false

    security_utilities:
      - unattended-upgrades
      - apt-listchanges

    # =========================================================================
    # MANUAL SOFTWARE LOCATIONS
    # =========================================================================

    manual_software_paths:
      - /usr/local/bin
      - /usr/local/sbin
      - /opt

  pre_tasks:

    # =========================================================================
    # SYSTEM IDENTIFICATION
    # =========================================================================

    - name: Display system information
      ansible.builtin.debug:
        msg:
          - "=============================================================="
          - " UNIVERSAL ENTERPRISE PATCHING"
          - "=============================================================="
          - "Hostname       : {{ ansible_hostname }}"
          - "OS             : {{ ansible_distribution }}"
          - "Version        : {{ ansible_distribution_version }}"
          - "Release        : {{ ansible_distribution_release }}"
          - "Architecture   : {{ ansible_architecture }}"
          - "Kernel         : {{ ansible_kernel }}"
          - "Python         : {{ ansible_python_version }}"
          - "=============================================================="

    # =========================================================================
    # OS VALIDATION
    # =========================================================================

    - name: Validate Debian family
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >
          This playbook requires Debian-family systems using APT.
          Detected {{ ansible_distribution }} {{ ansible_distribution_version }}.

    # =========================================================================
    # RUNNING KERNEL
    # =========================================================================

    - name: Detect running kernel
      ansible.builtin.command:
        cmd: uname -r
      register: running_kernel
      changed_when: false

    - name: Detect kernel architecture
      ansible.builtin.command:
        cmd: uname -m
      register: kernel_arch
      changed_when: false

    # =========================================================================
    # PACKAGE MANAGER HEALTH
    # =========================================================================

    - name: Check dpkg database
      ansible.builtin.command:
        cmd: dpkg --audit
      register: dpkg_initial_audit
      changed_when: false
      failed_when: false

    - name: Repair interrupted dpkg
      ansible.builtin.command:
        cmd: dpkg --configure -a
      register: dpkg_repair
      changed_when: false
      failed_when: dpkg_repair.rc != 0

    - name: Repair broken dependencies
      ansible.builtin.apt:
        state: fixed
        update_cache: false

    # =========================================================================
    # HELD PACKAGES
    # =========================================================================

    - name: Detect held packages
      ansible.builtin.command:
        cmd: apt-mark showhold
      register: held_packages
      changed_when: false
      failed_when: false

    - name: Display held packages
      ansible.builtin.debug:
        msg:
          - "Held packages:"
          - "{{ held_packages.stdout_lines | default([]) }}"

    # =========================================================================
    # PRE-PATCH REBOOT STATUS
    # =========================================================================

    - name: Check pre-existing reboot requirement
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_before


  tasks:

    # =========================================================================
    # APT PHASED UPDATE CONFIGURATION
    # =========================================================================

    - name: Enable phased Ubuntu updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-enterprise-phased-updates
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible
          # Include Ubuntu phased updates.
          APT::Get::Always-Include-Phased-Updates "true";
      when:
        - patch_apt | bool
        - include_phased_updates | bool

    # =========================================================================
    # APT REPOSITORY DISCOVERY
    # =========================================================================

    - name: Collect configured APT repositories
      ansible.builtin.shell: |
        grep -RhE \
          '^[[:space:]]*deb([[:space:]]|\[)' \
          /etc/apt/sources.list \
          /etc/apt/sources.list.d/ \
          2>/dev/null || true
      register: apt_repositories
      changed_when: false

    - name: Display configured APT repositories
      ansible.builtin.debug:
        var: apt_repositories.stdout_lines

    # =========================================================================
    # APT UPDATE
    # =========================================================================

    - name: Refresh APT repositories
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when:
        - patch_apt | bool

    # =========================================================================
    # APT SOFTWARE INVENTORY
    # =========================================================================

    - name: Inventory installed APT software
      ansible.builtin.shell: |
        dpkg-query \
          -W \
          -f='${Package}\t${Version}\t${Architecture}\n' \
          2>/dev/null || true
      register: apt_inventory
      changed_when: false

    - name: Detect available APT updates
      ansible.builtin.shell: |
        apt list --upgradable 2>/dev/null |
        grep -v '^Listing' || true
      register: apt_updates_before
      changed_when: false

    - name: Display APT update inventory
      ansible.builtin.debug:
        msg:
          - "Installed package records : {{ apt_inventory.stdout_lines | length }}"
          - "Available updates         : {{ apt_updates_before.stdout_lines | length }}"

    # =========================================================================
    # APT FULL UPGRADE
    # =========================================================================

    - name: Upgrade all APT managed software
      ansible.builtin.apt:
        upgrade: dist
        update_cache: false
        autoremove: false
        autoclean: false
        force_apt_get: true
      register: apt_upgrade
      when:
        - patch_apt | bool

    # =========================================================================
    # OPTIONAL SECURITY UTILITIES
    # =========================================================================

    - name: Install optional security utilities
      ansible.builtin.apt:
        name: "{{ security_utilities }}"
        state: present
        update_cache: false
      when:
        - install_security_utilities | bool

    # =========================================================================
    # SNAP DISCOVERY
    # =========================================================================

    - name: Check Snap availability
      ansible.builtin.command:
        cmd: snap version
      register: snap_check
      changed_when: false
      failed_when: false

    - name: Inventory Snap software
      ansible.builtin.command:
        cmd: snap list
      register: snap_inventory
      changed_when: false
      failed_when: false
      when:
        - snap_check.rc == 0

    - name: Display Snap inventory
      ansible.builtin.debug:
        var: snap_inventory.stdout_lines
      when:
        - snap_check.rc == 0

    # =========================================================================
    # SNAP UPDATE
    # =========================================================================

    - name: Upgrade all Snap software
      ansible.builtin.command:
        cmd: snap refresh
      register: snap_upgrade
      changed_when: >
        snap_upgrade.stdout is search("refreshed") or
        snap_upgrade.stdout is search("updated")
      failed_when: false
      when:
        - patch_snap | bool
        - snap_check.rc == 0

    # =========================================================================
    # SNAP REMAINING UPDATES
    # =========================================================================

    - name: Check remaining Snap updates
      ansible.builtin.command:
        cmd: snap refresh --list
      register: snap_remaining
      changed_when: false
      failed_when: false
      when:
        - snap_check.rc == 0

    # =========================================================================
    # PYTHON / PIP DISCOVERY
    # =========================================================================

    - name: Check pip
      ansible.builtin.command:
        cmd: "{{ pip_executable }} --version"
      register: pip_check
      changed_when: false
      failed_when: false

    - name: Inventory Python packages
      ansible.builtin.command:
        cmd: "{{ pip_executable }} list --format=json
      register: pip_inventory
      changed_when: false
      failed_when: false
      when:
        - pip_check.rc == 0

    - name: Detect outdated Python packages
      ansible.builtin.command:
        cmd: "{{ pip_executable }} list --outdated --format=json"
      register: pip_outdated
      changed_when: false
      failed_when: false
      when:
        - pip_check.rc == 0

    - name: Display outdated Python packages
      ansible.builtin.debug:
        var: pip_outdated.stdout
      when:
        - pip_check.rc == 0

    # =========================================================================
    # PYTHON / PIP UPDATE
    # =========================================================================

    - name: Upgrade outdated pip packages
      ansible.builtin.shell: |
        set -o pipefail

        {% if pip_break_system_packages | bool %}
        EXTRA_ARGS="--break-system-packages"
        {% else %}
        EXTRA_ARGS=""
        {% endif %}

        {{ pip_executable }} list \
          --outdated \
          --format=freeze 2>/dev/null |
        cut -d '=' -f 1 |
        while read -r PACKAGE
        do
          if [ -n "$PACKAGE" ]; then
            {{ pip_executable }} install \
              --upgrade \
              $EXTRA_ARGS \
              "$PACKAGE"
          fi
        done
      args:
        executable: /bin/bash
      register: pip_upgrade
      changed_when: >
        pip_upgrade.stdout is search("Successfully installed")
      failed_when: false
      when:
        - patch_python | bool
        - pip_check.rc == 0

    # =========================================================================
    # NODE.JS DISCOVERY
    # =========================================================================

    - name: Check Node.js
      ansible.builtin.command:
        cmd: node --version
      register: node_system_version
      changed_when: false
      failed_when: false

    - name: Check npm
      ansible.builtin.command:
        cmd: npm --version
      register: npm_system_version
      changed_when: false
      failed_when: false

    - name: Display system Node.js
      ansible.builtin.debug:
        msg:
          - "Node.js installed: {{ node_system_version.rc == 0 }}"
          - "Node.js version  : {{ node_system_version.stdout | default('N/A') }}"
          - "npm installed    : {{ npm_system_version.rc == 0 }}"
          - "npm version      : {{ npm_system_version.stdout | default('N/A') }}"

    # =========================================================================
    # NODE.JS APT PACKAGE DISCOVERY
    # =========================================================================

    - name: Detect APT managed Node.js
      ansible.builtin.shell: |
        dpkg-query -W \
          -f='${Package}\t${Version}\n' \
          2>/dev/null |
        grep -E '^nodejs[[:space:]]' || true
      register: apt_nodejs
      changed_when: false

    - name: Display APT Node.js package
      ansible.builtin.debug:
        var: apt_nodejs.stdout_lines

    # =========================================================================
    # NODE.JS NVM DISCOVERY
    # =========================================================================

    - name: Detect NVM installations
      ansible.builtin.find:
        paths:
          - /root/.nvm
          - /home
        patterns:
          - "nvm.sh"
        recurse: true
        file_type: file
      register: nvm_files
      failed_when: false

    - name: Display detected NVM installations
      ansible.builtin.debug:
        msg:
          - "NVM installations detected: {{ nvm_files.files | default([]) | length }}"
          - "{{ nvm_files.files | default([]) | map(attribute='path') | list }}"

    # =========================================================================
    # NODE.JS NVM INVENTORY
    # =========================================================================

    - name: Collect NVM Node.js versions
      ansible.builtin.shell: |
        set -o pipefail

        for NVM_DIR in \
          /root/.nvm \
          /home/*/.nvm
        do
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            export NVM_DIR="$NVM_DIR"
            . "$NVM_DIR/nvm.sh"

            echo "NVM_DIR=$NVM_DIR"

            nvm ls --no-colors 2>/dev/null || true
          fi
        done
      args:
        executable: /bin/bash
      register: nvm_inventory
      changed_when: false
      failed_when: false
      when:
        - patch_nodejs | bool

    - name: Display NVM Node.js inventory
      ansible.builtin.debug:
        var: nvm_inventory.stdout_lines

    # =========================================================================
    # NVM UPDATE - OPTIONAL
    # =========================================================================
    #
    # Disabled by default because changing a major Node.js runtime can break
    # applications.
    #
    # =========================================================================

    - name: Update NVM Node.js installations
      ansible.builtin.shell: |
        set -o pipefail

        for NVM_DIR in \
          /root/.nvm \
          /home/*/.nvm
        do
          if [ -s "$NVM_DIR/nvm.sh" ]; then

            export NVM_DIR="$NVM_DIR"
            . "$NVM_DIR/nvm.sh"

            CURRENT="$(nvm current 2>/dev/null || true)"

            if [ -n "$CURRENT" ] && [ "$CURRENT" != "system" ]; then

              if [ "{{ nodejs_allow_major_upgrade | bool | lower }}" = "true" ]; then
                nvm install --lts
                nvm alias default 'lts/*'
              else
                MAJOR="$(node --version | sed 's/^v//' | cut -d. -f1)"

                if [ -n "$MAJOR" ]; then
                  nvm install "$MAJOR"
                fi
              fi

            fi
          fi
        done
      args:
        executable: /bin/bash
      register: nvm_upgrade
      changed_when: >
        nvm_upgrade.stdout is search("Now using") or
        nvm_upgrade.stdout is search("Downloading")
      failed_when: false
      when:
        - patch_nodejs | bool
        - nodejs_update_nvm | bool

    # =========================================================================
    # GLOBAL NPM INVENTORY
    # =========================================================================

    - name: Inventory globally installed npm packages
      ansible.builtin.command:
        cmd: npm list -g --depth=0
      register: npm_inventory
      changed_when: false
      failed_when: false
      when:
        - npm_system_version.rc == 0

    - name: Detect outdated global npm packages
      ansible.builtin.command:
        cmd: npm outdated -g
      register: npm_outdated
      changed_when: false
      failed_when: false
      when:
        - npm_system_version.rc == 0

    - name: Display npm updates
      ansible.builtin.debug:
        var: npm_outdated.stdout_lines
      when:
        - npm_system_version.rc == 0

    # =========================================================================
    # GLOBAL NPM UPDATE
    # =========================================================================

    - name: Upgrade global npm packages
      ansible.builtin.command:
        cmd: npm update -g
      register: npm_upgrade
      changed_when: >
        npm_upgrade.stdout is search("updated") or
        npm_upgrade.stdout is search("added")
      failed_when: false
      when:
        - patch_npm | bool
        - npm_update_global_packages | bool
        - npm_system_version.rc == 0

    # =========================================================================
    # DOCKER DISCOVERY
    # =========================================================================

    - name: Check Docker Engine
      ansible.builtin.command:
        cmd: docker version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Detect Docker Engine version
      ansible.builtin.command:
        cmd: docker version --format "{{ '{{.Server.Version}}' }}"
      register: docker_engine_version
      changed_when: false
      failed_when: false
      when:
        - docker_check.rc == 0

    - name: Detect Docker package installation
      ansible.builtin.shell: |
        dpkg-query -W \
          -f='${Package}\t${Version}\n' \
          2>/dev/null |
        grep -E '^(docker-ce|docker-ce-cli|containerd.io|docker-buildx-plugin|docker-compose-plugin)[[:space:]]' ||
        true
      register: docker_apt_packages
      changed_when: false

    - name: Display Docker Engine information
      ansible.builtin.debug:
        msg:
          - "Docker installed       : {{ docker_check.rc == 0 }}"
          - "Docker Engine version  : {{ docker_engine_version.stdout | default('N/A') }}"
          - "Docker packages        : {{ docker_apt_packages.stdout_lines | default([]) }}"

    # =========================================================================
    # DOCKER ENGINE UPDATE
    # =========================================================================
    #
    # If Docker CE is installed through APT, APT upgrades it.
    #
    # This avoids blindly replacing Docker with an arbitrary downloaded binary.
    #
    # =========================================================================

    - name: Upgrade Docker Engine packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: false
      register: docker_engine_upgrade
      failed_when: false
      when:
        - patch_docker_engine | bool
        - docker_check.rc == 0
        - docker_apt_packages.stdout_lines | length > 0

    # =========================================================================
    # DOCKER INVENTORY
    # =========================================================================

    - name: Inventory Docker images
      ansible.builtin.shell: |
        docker images \
          --format '{{ "{{.Repository}}:{{.Tag}}" }}' |
        grep -v '<none>' |
        sort -u ||
        true
      register: docker_images
      changed_when: false
      failed_when: false
      when:
        - docker_check.rc == 0

    - name: Inventory Docker containers
      ansible.builtin.command:
        cmd: docker ps -a --format "{{ '{{.Names}}|{{.Image}}|{{.Status}}' }}"
      register: docker_containers
      changed_when: false
      failed_when: false
      when:
        - docker_check.rc == 0

    - name: Display Docker inventory
      ansible.builtin.debug:
        msg:
          - "Docker images:"
          - "{{ docker_images.stdout_lines | default([]) }}"
          - "Docker containers:"
          - "{{ docker_containers.stdout_lines | default([]) }}"

    # =========================================================================
    # DOCKER IMAGE UPDATE
    # =========================================================================
    #
    # Pulls the current image tag.
    #
    # Example:
    #
    # nginx:latest
    #
    # will be pulled from its configured registry.
    #
    # Running containers are NOT automatically recreated.
    #
    # =========================================================================

    - name: Pull newer Docker images
      ansible.builtin.shell: |
        set -o pipefail

        while read -r IMAGE
        do

          if [ -n "$IMAGE" ]; then

            echo "Checking Docker image: $IMAGE"

            docker pull "$IMAGE" || true

          fi

        done <<< "{{ docker_images.stdout }}"
      args:
        executable: /bin/bash
      register: docker_image_updates
      changed_when: >
        docker_image_updates.stdout is search("Downloaded newer image")
      failed_when: false
      when:
        - patch_docker_images | bool
        - docker_update_images | bool
        - docker_check.rc == 0

    # =========================================================================
    # DOCKER PRUNE
    # =========================================================================

    - name: Remove unused Docker images
      ansible.builtin.command:
        cmd: docker image prune -f
      register: docker_prune
      changed_when: >
        docker_prune.stdout is search("Total reclaimed space")
      failed_when: false
      when:
        - docker_prune_unused_images | bool
        - docker_check.rc == 0

    # =========================================================================
    # UNWANTED SOFTWARE
    # =========================================================================

    - name: Remove explicitly unwanted packages
      ansible.builtin.apt:
        name: "{{ unwanted_packages }}"
        state: absent
        purge: true
        autoremove: false
      when:
        - unwanted_packages | length > 0

    # =========================================================================
    # UNWANTED SERVICES
    # =========================================================================

    - name: Stop unwanted services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop: "{{ unwanted_services }}"
      failed_when: false
      when:
        - unwanted_services | length > 0

    # =========================================================================
    # KERNEL INVENTORY
    # =========================================================================

    - name: Inventory installed kernel packages
      ansible.builtin.shell: |
        dpkg-query -W \
          -f='${Package}\t${Version}\n' \
          2>/dev/null |
        grep -E '^linux-(image|modules|headers)-' |
        sort -V ||
        true
      register: kernel_inventory
      changed_when: false

    - name: Display installed kernels
      ansible.builtin.debug:
        msg:
          - "Running kernel: {{ running_kernel.stdout }}"
          - "Installed kernel packages:"
          - "{{ kernel_inventory.stdout_lines }}"

    # =========================================================================
    # KERNEL CLEANUP
    # =========================================================================
    #
    # IMPORTANT:
    #
    # Do NOT manually delete files from /boot.
    #
    # APT determines obsolete automatically installed kernels.
    #
    # This is intentionally safer than:
    #
    #   rm /boot/vmlinuz-*
    #
    # or blindly purging kernel versions.
    #
    # =========================================================================

    - name: Remove obsolete kernels using APT autoremove policy
      ansible.builtin.apt:
        autoremove: true
        purge: true
      register: kernel_cleanup
      when:
        - cleanup_old_kernels | bool

    # =========================================================================
    # VERIFY RUNNING KERNEL
    # =========================================================================

    - name: Verify running kernel files
      ansible.builtin.shell: |
        KERNEL="{{ running_kernel.stdout }}"

        if [ -e "/boot/vmlinuz-$KERNEL" ]; then
          exit 0
        fi

        if [ -e "/boot/vmlinuz-$KERNEL.efi.signed" ]; then
          exit 0
        fi

        exit 1
      register: running_kernel_file_check
      changed_when: false
      failed_when: false

    - name: Verify running kernel was not removed
      ansible.builtin.assert:
        that:
          - running_kernel_file_check.rc == 0
        fail_msg: >
          CRITICAL: The currently running kernel
          {{ running_kernel.stdout }}
          could not be found under /boot.
          Investigate before rebooting.

    # =========================================================================
    # APT AUTOREMOVE
    # =========================================================================

    - name: Remove unused dependencies
      ansible.builtin.apt:
        autoremove: true
        purge: true
      when:
        - cleanup_unused_packages | bool

    # =========================================================================
    # APT CACHE CLEANUP
    # =========================================================================

    - name: Clean obsolete APT cache
      ansible.builtin.apt:
        autoclean: true
      when:
        - clean_apt_cache | bool

    # =========================================================================
    # INITRAMFS
    # =========================================================================

    - name: Update initramfs
      ansible.builtin.command:
        cmd: update-initramfs -u -k all
      register: initramfs_result
      changed_when: true

    # =========================================================================
    # GRUB
    # =========================================================================

    - name: Update GRUB
      ansible.builtin.command:
        cmd: update-grub
      register: grub_result
      changed_when: true

    # =========================================================================
    # FINAL DPKG REPAIR
    # =========================================================================

    - name: Final dpkg configuration
      ansible.builtin.command:
        cmd: dpkg --configure -a
      register: final_dpkg
      changed_when: false
      failed_when: final_dpkg.rc != 0

    # =========================================================================
    # FINAL DEPENDENCY REPAIR
    # =========================================================================

    - name: Final dependency repair
      ansible.builtin.apt:
        state: fixed
        update_cache: false

    # =========================================================================
    # FINAL APT UPDATE INVENTORY
    # =========================================================================

    - name: Detect remaining APT updates
      ansible.builtin.shell: |
        apt list --upgradable 2>/dev/null |
        grep -v '^Listing' ||
        true
      register: remaining_apt
      changed_when: false

    # =========================================================================
    # FINAL DPKG AUDIT
    # =========================================================================

    - name: Run final dpkg audit
      ansible.builtin.command:
        cmd: dpkg --audit
      register: final_dpkg_audit
      changed_when: false

    # =========================================================================
    # FINAL APT CHECK
    # =========================================================================

    - name: Run final APT health check
      ansible.builtin.command:
        cmd: apt-get check
      register: final_apt_check
      changed_when: false

    # =========================================================================
    # FINAL SNAP CHECK
    # =========================================================================

    - name: Check remaining Snap updates
      ansible.builtin.command:
        cmd: snap refresh --list
      register: final_snap
      changed_when: false
      failed_when: false
      when:
        - snap_check.rc == 0

    # =========================================================================
    # FINAL NODE.JS
    # =========================================================================

    - name: Detect final Node.js version
      ansible.builtin.command:
        cmd: node --version
      register: final_node
      changed_when: false
      failed_when: false

    # =========================================================================
    # FINAL NPM
    # =========================================================================

    - name: Detect final npm version
      ansible.builtin.command:
        cmd: npm --version
      register: final_npm
      changed_when: false
      failed_when: false

    # =========================================================================
    # FINAL DOCKER
    # =========================================================================

    - name: Detect final Docker Engine version
      ansible.builtin.command:
        cmd: docker version --format "{{ '{{.Server.Version}}' }}"
      register: final_docker
      changed_when: false
      failed_when: false

    # =========================================================================
    # MANUAL / UNMANAGED SOFTWARE DETECTION
    # =========================================================================

    - name: Find files in manual software paths
      ansible.builtin.find:
        paths: "{{ manual_software_paths }}"
        recurse: true
        file_type: file
        hidden: false
      register: manual_software
      failed_when: false

    - name: Detect executable software not managed by dpkg
      ansible.builtin.shell: |
        set -o pipefail

        {% for file in manual_software.files | default([]) %}

        FILE="{{ file.path }}"

        if [ -x "$FILE" ]; then

          if ! dpkg-query -S "$FILE" >/dev/null 2>&1; then
            echo "$FILE"
          fi

        fi

        {% endfor %}
      args:
        executable: /bin/bash
      register: unmanaged_software
      changed_when: false
      failed_when: false

    - name: Display unmanaged software
      ansible.builtin.debug:
        msg:
          - "Unmanaged/manual executables:"
          - "{{ unmanaged_software.stdout_lines | default([]) }}"

    # =========================================================================
    # REBOOT DETECTION
    # =========================================================================

    - name: Check reboot requirement
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_required

    # =========================================================================
    # REBOOT
    # =========================================================================

    - name: Reboot server when required
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        connect_timeout: 15
        pre_reboot_delay: 5
        post_reboot_delay: "{{ reboot_post_delay }}"
        test_command: uptime
      when:
        - reboot_if_required | bool
        - reboot_required.stat.exists | bool

    # =========================================================================
    # REFRESH FACTS
    # =========================================================================

    - name: Refresh facts after reboot
      ansible.builtin.setup:
      when:
        - reboot_if_required | bool
        - reboot_required.stat.exists | bool

    # =========================================================================
    # FINAL KERNEL
    # =========================================================================

    - name: Detect final running kernel
      ansible.builtin.command:
        cmd: uname -r
      register: final_kernel
      changed_when: false

    # =========================================================================
    # FINAL SSH
    # =========================================================================

    - name: Check SSH service
      ansible.builtin.systemd:
        name: ssh
      register: ssh_status
      changed_when: false
      failed_when: false

    # =========================================================================
    # FINAL UPTIME
    # =========================================================================

    - name: Get final uptime
      ansible.builtin.command:
        cmd: uptime
      register: final_uptime
      changed_when: false

    # =========================================================================
    # FINAL REPORT
    # =========================================================================

    - name: Enterprise patch report
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "             ENTERPRISE UNIVERSAL PATCH REPORT"
          - "=================================================================="
          - ""
          - "SYSTEM"
          - "------------------------------------------------------------------"
          - "Hostname                  : {{ ansible_hostname }}"
          - "Operating System         : {{ ansible_distribution }}"
          - "OS Version               : {{ ansible_distribution_version }}"
          - "Release                  : {{ ansible_distribution_release }}"
          - "Architecture             : {{ ansible_architecture }}"
          - ""
          - "KERNEL"
          - "------------------------------------------------------------------"
          - "Kernel before             : {{ running_kernel.stdout }}"
          - "Kernel after              : {{ final_kernel.stdout }}"
          - "Kernel packages detected : {{ kernel_inventory.stdout_lines | length }}"
          - ""
          - "APT / DPKG"
          - "------------------------------------------------------------------"
          - "Installed packages       : {{ apt_inventory.stdout_lines | length }}"
          - "Remaining APT updates    : {{ remaining_apt.stdout_lines | length }}"
          - "APT health               : {{ 'PASS' if final_apt_check.rc == 0 else 'FAILED' }}"
          - "DPKG health              : {{ 'PASS' if final_dpkg_audit.stdout | trim == '' else 'FAILED' }}"
          - ""
          - "SNAP"
          - "------------------------------------------------------------------"
          - "Snap detected             : {{ 'YES' if snap_check.rc == 0 else 'NO' }}"
          - ""
          - "PYTHON / PIP"
          - "------------------------------------------------------------------"
          - "pip detected              : {{ 'YES' if pip_check.rc == 0 else 'NO' }}"
          - ""
          - "NODE.JS"
          - "------------------------------------------------------------------"
          - "Node.js detected          : {{ 'YES' if node_system_version.rc == 0 else 'NO' }}"
          - "Node.js version           : {{ final_node.stdout | default('N/A') }}"
          - "npm version               : {{ final_npm.stdout | default('N/A') }}"
          - "NVM detected              : {{ nvm_files.files | default([]) | length }}"
          - ""
          - "DOCKER"
          - "------------------------------------------------------------------"
          - "Docker detected           : {{ 'YES' if docker_check.rc == 0 else 'NO' }}"
          - "Docker Engine version     : {{ final_docker.stdout | default('N/A') }}"
          - "Docker images detected    : {{ docker_images.stdout_lines | default([]) | length }}"
          - "Docker containers         : {{ docker_containers.stdout_lines | default([]) | length }}"
          - ""
          - "UNMANAGED SOFTWARE"
          - "------------------------------------------------------------------"
          - "Unmanaged executables     : {{ unmanaged_software.stdout_lines | default([]) | length }}"
          - ""
          - "REBOOT"
          - "------------------------------------------------------------------"
          - "Reboot initially required : {{ reboot_before.stat.exists }}"
          - "Reboot required           : {{ reboot_required.stat.exists }}"
          - ""
          - "SSH"
          - "------------------------------------------------------------------"
          - "SSH state                 : {{ ssh_status.status.ActiveState | default('unknown') }}"
          - ""
          - "UPTIME"
          - "------------------------------------------------------------------"
          - "{{ final_uptime.stdout }}"
          - ""
          - "=================================================================="
          - "                 PATCHING COMPLETE"
          - "=================================================================="

    # =========================================================================
    # FINAL VALIDATION
    # =========================================================================

    - name: Validate APT
      ansible.builtin.assert:
        that:
          - final_apt_check.rc == 0
        fail_msg: >
          APT health check failed on {{ inventory_hostname }}.

    - name: Validate dpkg
      ansible.builtin.assert:
        that:
          - final_dpkg_audit.stdout | trim == ''
        fail_msg: >
          dpkg reports unresolved package problems on {{ inventory_hostname }}.

    - name: Validate final kernel
      ansible.builtin.assert:
        that:
          - final_kernel.stdout | trim != ''
        fail_msg: >
          Final kernel could not be detected.
