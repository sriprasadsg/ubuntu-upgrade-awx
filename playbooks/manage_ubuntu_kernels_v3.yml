---
# Ubuntu Kernel Management and Cleanup
#
# Policy:
#   - Detect the running kernel.
#   - Install/update the appropriate Ubuntu kernel meta-package.
#   - Detect all installed kernel versions.
#   - KEEP the running kernel.
#   - KEEP the newest installed kernel.
#   - REMOVE older kernel packages explicitly.
#   - Never remove the running kernel.
#   - Update GRUB.
#   - Optionally reboot.
#   - Generate a before/after report on every host.
#
# Test:
#   ansible-playbook -i inventory.ini manage_ubuntu_kernels_v2.yml
#
# Automatic reboot:
#   ansible-playbook -i inventory.ini manage_ubuntu_kernels_v2.yml \
#     -e "perform_reboot=true"

- name: Safely manage Ubuntu kernels
  hosts: all
  become: true
  gather_facts: true

  vars:
    perform_reboot: false
    reboot_timeout: 900
    report_dir: /var/log/ansible-kernel

  tasks:

    - name: Verify Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
        fail_msg: "This playbook supports Ubuntu only."

    - name: Create report directory
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Generate report timestamp
      ansible.builtin.command:
        cmd: date +%Y%m%d_%H%M%S
      register: report_timestamp
      changed_when: false

    - name: Set report path
      ansible.builtin.set_fact:
        kernel_report: "{{ report_dir }}/kernel_cleanup_{{ report_timestamp.stdout }}.txt"

    - name: Get running kernel before changes
      ansible.builtin.command:
        cmd: uname -r
      register: running_kernel_before
      changed_when: false

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        update_cache_retries: 5
        update_cache_retry_max_delay: 12

    # Detect whether the currently running kernel is HWE.
    # Ubuntu 24.04 HWE kernels include versions such as 6.17 and 7.x.
    - name: Detect active HWE kernel
      ansible.builtin.set_fact:
        active_hwe: >-
          {{
            running_kernel_before.stdout is search('^(6\.17|7\.).*-generic$')
          }}

    - name: Select active Ubuntu kernel meta package
      ansible.builtin.set_fact:
        active_kernel_meta: >-
          {{
            'linux-generic-hwe-24.04'
            if active_hwe
            else 'linux-generic'
          }}

    - name: Display selected kernel track
      ansible.builtin.debug:
        msg:
          - "Running kernel: {{ running_kernel_before.stdout }}"
          - "HWE detected: {{ active_hwe }}"
          - "Kernel meta package: {{ active_kernel_meta }}"

    - name: Install or update active Ubuntu kernel
      ansible.builtin.apt:
        name: "{{ active_kernel_meta }}"
        state: latest
      register: kernel_update

    # /boot/vmlinuz-* is used instead of parsing dpkg package names.
    - name: Detect installed kernel versions
      ansible.builtin.shell: |
        set -o pipefail
        find /boot -maxdepth 1 -type f -name 'vmlinuz-*' \
          -printf '%f\n' 2>/dev/null |
          sed 's/^vmlinuz-//' |
          sort -V
      args:
        executable: /bin/bash
      register: installed_kernel_versions
      changed_when: false

    - name: Verify installed kernels were detected
      ansible.builtin.assert:
        that:
          - installed_kernel_versions.stdout_lines | length > 0
        fail_msg: "No installed kernel was detected under /boot."

    - name: Determine newest installed kernel
      ansible.builtin.set_fact:
        newest_kernel: "{{ installed_kernel_versions.stdout_lines | last }}"

    - name: Verify running kernel is installed
      ansible.builtin.assert:
        that:
          - running_kernel_before.stdout in installed_kernel_versions.stdout_lines
        fail_msg: >-
          Running kernel {{ running_kernel_before.stdout }} was not found
          in the detected installed kernel list. Cleanup aborted.

    # Protect both the running kernel and newest kernel.
    - name: Build protected kernel list
      ansible.builtin.set_fact:
        kernels_to_keep: >-
          {{
            [running_kernel_before.stdout, newest_kernel] | unique
          }}

    - name: Determine old kernel versions
      ansible.builtin.set_fact:
        old_kernels: >-
          {{
            installed_kernel_versions.stdout_lines
            | difference(kernels_to_keep)
          }}

    - name: Display cleanup plan
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "Running kernel: {{ running_kernel_before.stdout }}"
          - "Newest kernel: {{ newest_kernel }}"
          - "Kernels KEEP: {{ kernels_to_keep }}"
          - "Kernels REMOVE: {{ old_kernels | default([]) }}"
          - "=============================================="

    # Get all installed Linux kernel packages and select packages
    # whose versioned kernel identifier matches an old kernel.
    #
    # This avoids the YAML/awk quoting problem in the previous file.
    - name: Find installed packages belonging to old kernels
      ansible.builtin.shell: |
        set -e

        dpkg-query -W -f='${binary:Package}\t${Status}\n' 2>/dev/null |
        while IFS="$(printf '\t')" read -r package status; do
          [ "$status" = "install ok installed" ] || continue

          case "$package" in
            linux-image-*|linux-modules-*|linux-modules-extra-*|linux-headers-*)
              for kernel in {{ old_kernels | map('quote') | join(' ') }}; do
                case "$package" in
                  "linux-image-$kernel"|"linux-modules-$kernel"|"linux-modules-extra-$kernel"|"linux-headers-$kernel")
                    printf '%s\n' "$package"
                    ;;
                esac
              done
              ;;
          esac
        done | sort -u
      args:
        executable: /bin/bash
      register: old_kernel_packages
      changed_when: false

    - name: Display packages selected for removal
      ansible.builtin.debug:
        msg:
          - "Old kernel packages:"
          - "{{ old_kernel_packages.stdout_lines | default([]) }}"

    # Critical safety check.
    - name: Verify running kernel is not selected for removal
      ansible.builtin.assert:
        that:
          - >-
            old_kernel_packages.stdout_lines
            | select('search', running_kernel_before.stdout)
            | list
            | length == 0
        fail_msg: >-
          SAFETY ABORT: the running kernel
          {{ running_kernel_before.stdout }}
          appears in the removal list.

    - name: Remove old kernel packages
      ansible.builtin.apt:
        name: "{{ old_kernel_packages.stdout_lines }}"
        state: absent
        purge: true
      register: kernel_cleanup
      when:
        - old_kernel_packages.stdout_lines | length > 0

    - name: Remove unused dependencies
      ansible.builtin.apt:
        autoremove: true
        purge: true
      register: autoremove_result

    - name: Update GRUB
      ansible.builtin.command:
        cmd: update-grub
      register: grub_update
      changed_when: true

    - name: Check whether reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot when explicitly requested
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        connect_timeout: 10
        pre_reboot_delay: 5
        post_reboot_delay: 20
        test_command: uname -r
      register: reboot_result
      when:
        - perform_reboot | bool
        - reboot_required.stat.exists

    - name: Get running kernel after changes
      ansible.builtin.command:
        cmd: uname -r
      register: running_kernel_after
      changed_when: false

    - name: Detect final installed kernels
      ansible.builtin.shell: |
        set -o pipefail
        find /boot -maxdepth 1 -type f -name 'vmlinuz-*' \
          -printf '%f\n' 2>/dev/null |
          sed 's/^vmlinuz-//' |
          sort -V
      args:
        executable: /bin/bash
      register: final_kernel_versions
      changed_when: false

    - name: Check final reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: final_reboot_required

    - name: Generate kernel cleanup report
      ansible.builtin.copy:
        dest: "{{ kernel_report }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          ============================================================
          UBUNTU KERNEL CLEANUP REPORT
          ============================================================

          Host:
          {{ inventory_hostname }}

          Ubuntu:
          {{ ansible_distribution }} {{ ansible_distribution_version }}

          Report:
          {{ report_timestamp.stdout }}

          ------------------------------------------------------------
          BEFORE
          ------------------------------------------------------------

          Running kernel:
          {{ running_kernel_before.stdout }}

          Installed kernels:
          {{ installed_kernel_versions.stdout }}

          Active HWE:
          {{ active_hwe }}

          Active kernel meta package:
          {{ active_kernel_meta }}

          ------------------------------------------------------------
          KERNEL UPDATE
          ------------------------------------------------------------

          Changed:
          {{ kernel_update.changed }}

          Newest installed kernel:
          {{ newest_kernel }}

          ------------------------------------------------------------
          CLEANUP PLAN
          ------------------------------------------------------------

          Protected kernels:
          {{ kernels_to_keep | join(', ') }}

          Old kernels:
          {% if old_kernels | length > 0 %}
          {{ old_kernels | join(', ') }}
          {% else %}
          None
          {% endif %}

          Packages removed:
          {% if old_kernel_packages.stdout | trim %}
          {{ old_kernel_packages.stdout }}
          {% else %}
          None
          {% endif %}

          ------------------------------------------------------------
          CLEANUP RESULT
          ------------------------------------------------------------

          Kernel cleanup changed:
          {{ (kernel_cleanup is defined and kernel_cleanup.changed) | default(false) }}

          Autoremove changed:
          {{ autoremove_result.changed }}

          GRUB updated:
          {{ grub_update.changed }}

          ------------------------------------------------------------
          REBOOT
          ------------------------------------------------------------

          Reboot required before:
          {{ reboot_required.stat.exists }}

          Reboot requested:
          {{ perform_reboot }}

          Reboot performed:
          {{ (reboot_result is defined and reboot_result.changed) | default(false) }}

          ------------------------------------------------------------
          AFTER
          ------------------------------------------------------------

          Running kernel:
          {{ running_kernel_after.stdout }}

          Installed kernels:
          {{ final_kernel_versions.stdout }}

          Final reboot required:
          {{ final_reboot_required.stat.exists }}

          ------------------------------------------------------------
          FINAL STATUS
          ------------------------------------------------------------

          {% if running_kernel_after.stdout == newest_kernel and not final_reboot_required.stat.exists %}
          SUCCESS - newest kernel is running
          {% elif running_kernel_after.stdout != newest_kernel %}
          REBOOT REQUIRED - newest kernel is not running
          {% else %}
          MANUAL REVIEW REQUIRED
          {% endif %}

          ============================================================
          END REPORT
          ============================================================
      register: report_result

    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " UBUNTU KERNEL CLEANUP"
          - "============================================================"
          - "Host: {{ inventory_hostname }}"
          - "Running BEFORE: {{ running_kernel_before.stdout }}"
          - "Newest installed: {{ newest_kernel }}"
          - "Running AFTER: {{ running_kernel_after.stdout }}"
          - "KEEP: {{ kernels_to_keep }}"
          - "REMOVE: {{ old_kernels | default([]) }}"
          - "Cleanup changed: {{ (kernel_cleanup is defined and kernel_cleanup.changed) | default(false) }}"
          - "Reboot performed: {{ (reboot_result is defined and reboot_result.changed) | default(false) }}"
          - "Final reboot required: {{ final_reboot_required.stat.exists }}"
          - "Report: {{ kernel_report }}"
          - "============================================================"
