---
# ============================================================
# Enterprise Linux Software & Kernel Update
# ============================================================
#
# Purpose:
#   1. Identify OS and kernel information
#   2. Inventory installed APT packages
#   3. Identify available package updates
#   4. Identify security updates
#   5. Upgrade installed APT packages
#   6. Upgrade Linux kernel packages
#   7. Upgrade Snap packages
#   8. Detect reboot requirement
#   9. Perform post-update validation
#  10. Generate JSON software/update report
#
# Supported:
#   Ubuntu / Debian
#
# Recommended first run:
#   ansible-playbook software_update.yml -i inventory.ini
#
# Audit only:
#   update_packages: false
#
# Update everything:
#   update_packages: true
#
# Update + reboot:
#   update_packages: true
#   reboot_if_required: true
#
# ============================================================

- name: Enterprise Linux Software Inventory and Update
  hosts: all
  become: true
  gather_facts: true

  vars:

    # --------------------------------------------------------
    # MAIN SETTINGS
    # --------------------------------------------------------

    update_packages: false

    update_kernel: true

    update_snap: true

    reboot_if_required: false

    cleanup_packages: true

    update_cache: true

    # --------------------------------------------------------
    # Package exclusions
    #
    # Add production-critical packages here if required.
    # --------------------------------------------------------

    excluded_packages: []

    # Example:
    #
    # excluded_packages:
    #   - postgresql*
    #   - gitlab-ce
    #   - gitlab-ee
    #   - docker-ce
    #   - docker-ce-cli

    # --------------------------------------------------------
    # Report location
    # --------------------------------------------------------

    report_directory: "/var/log/ansible-software-update"

    report_file: "/var/log/ansible-software-update/software-update-report.json"

  tasks:

    # ========================================================
    # 1. Validate OS
    # ========================================================

    - name: Display operating system
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"
          - "Kernel: {{ ansible_kernel }}"

    - name: Stop on unsupported operating system
      ansible.builtin.fail:
        msg: >
          Unsupported operating system:
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          This playbook currently supports Ubuntu and Debian.
      when:
        - ansible_distribution not in ['Ubuntu', 'Debian']

    # ========================================================
    # 2. Create report directory
    # ========================================================

    - name: Create report directory
      ansible.builtin.file:
        path: "{{ report_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    # ========================================================
    # 3. Collect current kernel information
    # ========================================================

    - name: Get running kernel
      ansible.builtin.command:
        cmd: uname -r
      register: running_kernel
      changed_when: false

    - name: Get kernel architecture
      ansible.builtin.command:
        cmd: uname -m
      register: kernel_architecture
      changed_when: false

    - name: Get installed kernel packages
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W -f='${binary:Package}\t${Version}\n' \
          'linux-image*' 'linux-headers*' 'linux-modules*' 2>/dev/null || true
      register: installed_kernel_packages
      changed_when: false

    # ========================================================
    # 4. Refresh APT cache
    # ========================================================

    - name: Update APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: update_cache

    # ========================================================
    # 5. Collect installed software inventory
    # ========================================================

    - name: Collect installed APT packages
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
          -f='${binary:Package}\t${Version}\t${Architecture}\t${Status}\n'
      register: installed_packages
      changed_when: false

    - name: Count installed packages
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W -f='${binary:Package}\n' | wc -l
      register: installed_package_count
      changed_when: false

    # ========================================================
    # 6. Identify available updates
    # ========================================================

    - name: Get packages with available updates
      ansible.builtin.shell:
        cmd: |
          apt list --upgradable 2>/dev/null | tail -n +2
      register: available_updates
      changed_when: false

    - name: Count available updates
      ansible.builtin.shell:
        cmd: |
          apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: available_update_count
      changed_when: false

    # ========================================================
    # 7. Identify security updates
    # ========================================================

    - name: Get available security updates
      ansible.builtin.shell:
        cmd: |
          apt list --upgradable 2>/dev/null |
          grep -Ei 'security|security.ubuntu.com|security.debian.org' ||
          true
      register: security_updates
      changed_when: false

    - name: Count security updates
      ansible.builtin.shell:
        cmd: |
          apt list --upgradable 2>/dev/null |
          grep -Ei 'security|security.ubuntu.com|security.debian.org' |
          wc -l || true
      register: security_update_count
      changed_when: false

    # ========================================================
    # 8. Check packages on hold
    # ========================================================

    - name: Identify held packages
      ansible.builtin.shell:
        cmd: |
          apt-mark showhold || true
      register: held_packages
      changed_when: false

    # ========================================================
    # 9. Display audit information
    # ========================================================

    - name: Display software audit
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "SOFTWARE AUDIT"
          - "=============================================="
          - "Hostname: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"
          - "Running kernel: {{ running_kernel.stdout }}"
          - "Installed packages: {{ installed_package_count.stdout | trim }}"
          - "Available updates: {{ available_update_count.stdout | trim }}"
          - "Security updates: {{ security_update_count.stdout | trim }}"
          - "Held packages: {{ held_packages.stdout_lines | length }}"
          - "=============================================="

    # ========================================================
    # 10. Upgrade APT packages
    # ========================================================

    - name: Upgrade all APT packages
      ansible.builtin.apt:
        name: "*"
        state: latest
        update_cache: false
        only_upgrade: true
        autoremove: false
      when:
        - update_packages
        - excluded_packages | length == 0

    # ========================================================
    # 11. Upgrade packages with exclusions
    # ========================================================

    - name: Get installed package names
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W -f='${binary:Package}\n'
      register: installed_package_names
      changed_when: false
      when:
        - update_packages
        - excluded_packages | length > 0

    - name: Build package update list excluding protected packages
      ansible.builtin.set_fact:
        update_package_list: >-
          {{
            installed_package_names.stdout_lines
            | reject('match', excluded_packages | join('|'))
            | list
          }}
      when:
        - update_packages
        - excluded_packages | length > 0

    - name: Upgrade packages excluding protected packages
      ansible.builtin.apt:
        name: "{{ update_package_list }}"
        state: latest
        update_cache: false
        only_upgrade: true
        autoremove: false
      when:
        - update_packages
        - excluded_packages | length > 0
        - update_package_list | length > 0

    # ========================================================
    # 12. Explicit kernel update
    # ========================================================

    - name: Install latest Ubuntu/Debian generic kernel
      ansible.builtin.apt:
        name:
          - linux-image-generic
          - linux-headers-generic
        state: latest
        update_cache: false
      when:
        - update_packages
        - update_kernel
        - ansible_distribution in ['Ubuntu', 'Debian']
      register: kernel_update

    # ========================================================
    # 13. Refresh kernel information after update
    # ========================================================

    - name: Get installed kernels after update
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W -f='${binary:Package}\t${Version}\n' \
          'linux-image*' 2>/dev/null || true
      register: kernels_after_update
      changed_when: false

    # ========================================================
    # 14. Snap inventory
    # ========================================================

    - name: Check whether Snap is installed
      ansible.builtin.command:
        cmd: which snap
      register: snap_binary
      changed_when: false
      failed_when: false

    - name: Collect installed Snap packages
      ansible.builtin.command:
        cmd: snap list
      register: snap_inventory
      changed_when: false
      failed_when: false
      when:
        - snap_binary.rc == 0

    # ========================================================
    # 15. Upgrade Snap packages
    # ========================================================

    - name: Refresh Snap packages
      ansible.builtin.command:
        cmd: snap refresh
      register: snap_update
      changed_when: >
        'All snaps up to date' not in snap_update.stdout
      when:
        - update_packages
        - update_snap
        - snap_binary.rc == 0

    # ========================================================
    # 16. APT autoremove
    # ========================================================

    - name: Remove unused packages
      ansible.builtin.apt:
        autoremove: true
        autoclean: true
      when:
        - update_packages
        - cleanup_packages

    # ========================================================
    # 17. Check reboot requirement
    # ========================================================

    - name: Check Ubuntu/Debian reboot marker
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Check reboot-required packages
      ansible.builtin.shell:
        cmd: |
          if [ -f /var/run/reboot-required.pkgs ]; then
            cat /var/run/reboot-required.pkgs
          else
            true
          fi
      register: reboot_packages
      changed_when: false

    # ========================================================
    # 18. Determine reboot requirement
    # ========================================================

    - name: Set reboot status
      ansible.builtin.set_fact:
        reboot_required: "{{ reboot_required_file.stat.exists }}"

    - name: Display reboot information
      ansible.builtin.debug:
        msg:
          - "Reboot required: {{ reboot_required }}"
          - "Packages requiring reboot:"
          - "{{ reboot_packages.stdout_lines }}"

    # ========================================================
    # 19. Optional reboot
    # ========================================================

    - name: Reboot system when required
      ansible.builtin.reboot:
        msg: "Ansible software/kernel update reboot"
        reboot_timeout: 900
        connect_timeout: 30
        pre_reboot_delay: 5
        post_reboot_delay: 20
        test_command: whoami
      when:
        - update_packages
        - reboot_if_required
        - reboot_required

    # ========================================================
    # 20. Verify running kernel after reboot/update
    # ========================================================

    - name: Get final running kernel
      ansible.builtin.command:
        cmd: uname -r
      register: final_kernel
      changed_when: false

    - name: Verify kernel state
      ansible.builtin.debug:
        msg:
          - "Previous running kernel: {{ running_kernel.stdout }}"
          - "Current running kernel: {{ final_kernel.stdout }}"
          - "Kernel changed: {{ running_kernel.stdout != final_kernel.stdout }}"

    # ========================================================
    # 21. Verify package manager health
    # ========================================================

    - name: Check dpkg database
      ansible.builtin.command:
        cmd: dpkg --audit
      register: dpkg_audit
      changed_when: false
      failed_when: false

    - name: Check broken dependencies
      ansible.builtin.command:
        cmd: apt-get check
      register: apt_check
      changed_when: false
      failed_when: false

    # ========================================================
    # 22. Collect final package count
    # ========================================================

    - name: Get final installed package count
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W -f='${binary:Package}\n' | wc -l
      register: final_package_count
      changed_when: false

    # ========================================================
    # 23. Collect final available updates
    # ========================================================

    - name: Get remaining available updates
      ansible.builtin.shell:
        cmd: |
          apt list --upgradable 2>/dev/null | tail -n +2
      register: remaining_updates
      changed_when: false

    - name: Count remaining updates
      ansible.builtin.shell:
        cmd: |
          apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: remaining_update_count
      changed_when: false

    # ========================================================
    # 24. Generate JSON report
    # ========================================================

    - name: Generate software update report
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          {
            "hostname": "{{ ansible_hostname }}",
            "fqdn": "{{ ansible_fqdn }}",
            "operating_system": "{{ ansible_distribution }}",
            "os_version": "{{ ansible_distribution_version }}",
            "architecture": "{{ ansible_architecture }}",
            "kernel": {
              "previous_running_kernel": "{{ running_kernel.stdout }}",
              "current_running_kernel": "{{ final_kernel.stdout }}",
              "kernel_changed": {{ (running_kernel.stdout != final_kernel.stdout) | lower }},
              "reboot_required": {{ reboot_required | lower }}
            },
            "software": {
              "installed_package_count_before": {{ installed_package_count.stdout | trim | int }},
              "available_updates_before": {{ available_update_count.stdout | trim | int }},
              "security_updates_before": {{ security_update_count.stdout | trim | int }},
              "installed_package_count_after": {{ final_package_count.stdout | trim | int }},
              "remaining_updates_after": {{ remaining_update_count.stdout | trim | int }}
            },
            "update_configuration": {
              "update_packages": {{ update_packages | lower }},
              "update_kernel": {{ update_kernel | lower }},
              "update_snap": {{ update_snap | lower }},
              "cleanup_packages": {{ cleanup_packages | lower }},
              "reboot_if_required": {{ reboot_if_required | lower }}
            },
            "held_packages": {{ held_packages.stdout_lines | to_json }},
            "reboot_packages": {{ reboot_packages.stdout_lines | to_json }},
            "remaining_updates": {{ remaining_updates.stdout_lines | to_json }},
            "dpkg_audit": {{ dpkg_audit.stdout_lines | to_json }},
            "apt_check": {{ apt_check.stdout_lines | to_json }}
          }

    # ========================================================
    # 25. Final summary
    # ========================================================

    - name: Display final update summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ENTERPRISE SOFTWARE UPDATE SUMMARY"
          - "============================================================"
          - "Host: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel before: {{ running_kernel.stdout }}"
          - "Kernel after:  {{ final_kernel.stdout }}"
          - "Installed packages before: {{ installed_package_count.stdout | trim }}"
          - "Available updates before: {{ available_update_count.stdout | trim }}"
          - "Security updates before: {{ security_update_count.stdout | trim }}"
          - "Installed packages after: {{ final_package_count.stdout | trim }}"
          - "Remaining updates: {{ remaining_update_count.stdout | trim }}"
          - "Reboot required: {{ reboot_required }}"
          - "DPKG audit: {{ 'PASS' if dpkg_audit.rc == 0 else 'CHECK REQUIRED' }}"
          - "APT dependency check: {{ 'PASS' if apt_check.rc == 0 else 'CHECK REQUIRED' }}"
          - "Report: {{ report_file }}"
          - "============================================================"

