---
- name: Automatic Ubuntu kernel vulnerability remediation
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Auto-detect the kernel track already used by the server.
    # Supported tracks below:
    #   - Ubuntu 24.04 HWE
    #   - Ubuntu generic
    kernel_track: auto

    # Packages used when auto-detection finds the corresponding track.
    hwe_kernel_meta: linux-generic-hwe-24.04
    generic_kernel_meta: linux-generic

    # Reboot automatically when a kernel update is installed.
    automatic_reboot: true

    # Allow APT to remove obsolete packages/kernels after reboot.
    automatic_cleanup: true

    # Number of old kernels to retain.
    # The running kernel is always protected by the package manager.
    cleanup_old_kernels: true

  pre_tasks:

    # ---------------------------------------------------------------
    # OS validation
    # ---------------------------------------------------------------

    - name: Verify operating system is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
        fail_msg: "This playbook is designed for Ubuntu servers."

    - name: Display system information
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Ubuntu: {{ ansible_facts.distribution_version }}"
          - "Architecture: {{ ansible_facts.architecture }}"
          - "Current kernel: {{ ansible_facts.kernel }}"

    # ---------------------------------------------------------------
    # Determine kernel track
    # ---------------------------------------------------------------

    - name: Check whether Ubuntu 24.04 HWE meta-package is installed
      ansible.builtin.shell: |
        dpkg-query -W -f='${Status}' {{ hwe_kernel_meta }} 2>/dev/null \
        | grep -q '^install ok installed$'
      register: hwe_installed
      changed_when: false
      failed_when: false

    - name: Check whether generic kernel meta-package is installed
      ansible.builtin.shell: |
        dpkg-query -W -f='${Status}' {{ generic_kernel_meta }} 2>/dev/null \
        | grep -q '^install ok installed$'
      register: generic_installed
      changed_when: false
      failed_when: false

    - name: Determine kernel meta-package
      ansible.builtin.set_fact:
        kernel_meta_package: >-
          {{
            hwe_kernel_meta
            if hwe_installed.rc == 0
            else generic_kernel_meta
            if generic_installed.rc == 0
            else ''
          }}

    - name: Verify kernel track was detected
      ansible.builtin.assert:
        that:
          - kernel_meta_package | length > 0
        fail_msg: >-
          Could not automatically detect the installed Ubuntu kernel track.
          Refusing to switch the server to a different kernel family.

    - name: Display detected kernel track
      ansible.builtin.debug:
        msg:
          - "Detected kernel meta-package: {{ kernel_meta_package }}"
          - "Current running kernel: {{ ansible_facts.kernel }}"

    # ---------------------------------------------------------------
    # Update repositories
    # ---------------------------------------------------------------

    - name: Refresh APT repositories
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # ---------------------------------------------------------------
    # Determine latest available kernel
    # ---------------------------------------------------------------

    - name: Get latest available kernel meta-package version
      ansible.builtin.shell: |
        apt-cache policy {{ kernel_meta_package }} |
        awk '/Candidate:/ {print $2}'
      register: kernel_candidate
      changed_when: false

    - name: Verify a kernel candidate exists
      ansible.builtin.assert:
        that:
          - kernel_candidate.stdout | trim != ""
          - kernel_candidate.stdout | trim != "none"
        fail_msg: >-
          No candidate version found for {{ kernel_meta_package }}.
          Check Ubuntu repositories and APT configuration.

    - name: Display latest available kernel
      ansible.builtin.debug:
        msg:
          - "Kernel package: {{ kernel_meta_package }}"
          - "Latest APT candidate: {{ kernel_candidate.stdout | trim }}"

    # ---------------------------------------------------------------
    # Record current kernel
    # ---------------------------------------------------------------

    - name: Record current running kernel
      ansible.builtin.set_fact:
        previous_kernel: "{{ ansible_facts.kernel }}"

    # ---------------------------------------------------------------
    # Install latest kernel automatically
    # ---------------------------------------------------------------

  tasks:

    - name: Install latest kernel meta-package
      ansible.builtin.apt:
        name: "{{ kernel_meta_package }}"
        state: latest
        install_recommends: true
      register: kernel_update

    - name: Perform complete package upgrade
      ansible.builtin.apt:
        upgrade: full
        autoremove: false
        autoclean: true
      register: full_upgrade

    - name: Check whether Ubuntu requires reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display update status
      ansible.builtin.debug:
        msg:
          - "Kernel package changed: {{ kernel_update.changed }}"
          - "Full upgrade changed packages: {{ full_upgrade.changed }}"
          - "Reboot required: {{ reboot_required.stat.exists }}"
          - "Previous kernel: {{ previous_kernel }}"

    # ---------------------------------------------------------------
    # Reboot
    # ---------------------------------------------------------------

    - name: Reboot after kernel update
      ansible.builtin.reboot:
        msg: >-
          Automatic reboot after Ubuntu kernel security remediation.
        connect_timeout: 10
        reboot_timeout: 900
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: "uname -r"
      when:
        - automatic_reboot | bool
        - kernel_update.changed or reboot_required.stat.exists

    # ---------------------------------------------------------------
    # Refresh facts after reboot
    # ---------------------------------------------------------------

    - name: Gather facts after remediation
      ansible.builtin.setup:

    - name: Display running kernel after remediation
      ansible.builtin.debug:
        msg:
          - "Previous kernel: {{ previous_kernel }}"
          - "Current kernel: {{ ansible_facts.kernel }}"

    # ---------------------------------------------------------------
    # Verify kernel changed when an update was installed
    # ---------------------------------------------------------------

    - name: Verify kernel changed after kernel update
      ansible.builtin.assert:
        that:
          - ansible_facts.kernel != previous_kernel
        fail_msg: >-
          A kernel update was installed but the server is still running
          the previous kernel {{ previous_kernel }}.
      when: kernel_update.changed

    # ---------------------------------------------------------------
    # Cleanup old kernels and packages
    # ---------------------------------------------------------------

    - name: Remove obsolete packages and old kernels
      ansible.builtin.apt:
        autoremove: true
        purge: true
      when: automatic_cleanup | bool

    - name: Clean APT cache
      ansible.builtin.apt:
        autoclean: true

    # ---------------------------------------------------------------
    # List installed kernels
    # ---------------------------------------------------------------

    - name: Get installed Linux kernel packages
      ansible.builtin.shell: |
        dpkg-query -W -f='${Package}\t${Version}\n' 2>/dev/null |
        grep -E '^linux-image(-[0-9].*)?\s' || true
      register: installed_kernel_packages
      changed_when: false

    - name: Display installed kernel packages
      ansible.builtin.debug:
        var: installed_kernel_packages.stdout_lines

    # ---------------------------------------------------------------
    # Final reboot check
    # ---------------------------------------------------------------

    - name: Check final reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: final_reboot_required

    - name: Final security validation
      ansible.builtin.assert:
        that:
          - not final_reboot_required.stat.exists
        fail_msg: >-
          System still requires a reboot after remediation.
      when: automatic_reboot | bool

  post_tasks:

    - name: Final remediation report
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - " Ubuntu Kernel Remediation Complete"
          - "=============================================="
          - "Host: {{ inventory_hostname }}"
          - "Kernel package: {{ kernel_meta_package }}"
          - "Latest APT candidate at start: {{ kernel_candidate.stdout | trim }}"
          - "Previous kernel: {{ previous_kernel }}"
          - "Current kernel: {{ ansible_facts.kernel }}"
          - "Kernel package updated: {{ kernel_update.changed }}"
          - "Automatic cleanup: {{ automatic_cleanup }}"
          - "=============================================="
