---
- name: Harden SSH MACs and CBC ciphers
  hosts: all
  become: true
  gather_facts: true

  vars:
    ssh_hardening_file: /etc/ssh/sshd_config.d/99-crypto-hardening.conf
    ssh_backup_dir: /etc/ssh/ansible-backups

    requested_macs:
      - hmac-sha2-512
      - hmac-sha2-512-etm@openssh.com
      - hmac-sha2-256
      - hmac-sha2-256-etm@openssh.com
      - hmac-ripemd160-etm@openssh.com
      - hmac-ripemd160

    # Scanner specifically asks CBC to be replaced with CTR.
    allowed_ciphers:
      - aes128-ctr
      - aes192-ctr
      - aes256-ctr

  pre_tasks:

    - name: Verify Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
        fail_msg: "This playbook is intended for Ubuntu servers."

    - name: Install required SSH packages
      ansible.builtin.apt:
        name:
          - openssh-server
          - openssh-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure SSH drop-in directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure Ansible SSH backup directory exists
      ansible.builtin.file:
        path: "{{ ssh_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Important:
    # Remove the previous copy created by this playbook.
    # This allows us to validate the original SSH configuration first.
    - name: Remove previous managed hardening file
      ansible.builtin.file:
        path: "{{ ssh_hardening_file }}"
        state: absent

    - name: Validate existing SSH configuration
      ansible.builtin.command:
        cmd: sshd -t
      register: current_sshd_test
      changed_when: false

    - name: Stop if existing SSH configuration is invalid
      ansible.builtin.fail:
        msg: >-
          Existing SSH configuration is invalid.
          Refusing to modify SSH configuration.
          Error: {{ current_sshd_test.stderr }}
      when: current_sshd_test.rc != 0

    - name: Get SSH MAC algorithms supported by OpenSSH
      ansible.builtin.command:
        cmd: ssh -Q mac
      register: supported_macs
      changed_when: false

    - name: Determine supported requested MACs
      ansible.builtin.set_fact:
        effective_macs: >-
          {{
            requested_macs
            | select('in', supported_macs.stdout_lines)
            | list
          }}

    - name: Display MAC selection
      ansible.builtin.debug:
        msg:
          - "Requested: {{ requested_macs }}"
          - "Supported: {{ supported_macs.stdout_lines }}"
          - "Will configure: {{ effective_macs }}"

    - name: Ensure required SHA-2 MACs are supported
      ansible.builtin.assert:
        that:
          - "'hmac-sha2-512' in effective_macs"
          - "'hmac-sha2-512-etm@openssh.com' in effective_macs"
          - "'hmac-sha2-256' in effective_macs"
          - "'hmac-sha2-256-etm@openssh.com' in effective_macs"
        fail_msg: "One or more required SHA-2 MACs are unavailable."

  tasks:

    - name: Backup current sshd_config
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: "{{ ssh_backup_dir }}/sshd_config-{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
        force: false

    - name: Create hardened SSH configuration
      ansible.builtin.copy:
        dest: "{{ ssh_hardening_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # ==========================================================
          # Managed by Ansible
          # SSH Cryptographic Hardening
          # ==========================================================

          MACs {{ effective_macs | join(',') }}

          Ciphers {{ allowed_ciphers | join(',') }}
      register: ssh_hardening_changed

    - name: Validate new SSH configuration
      ansible.builtin.command:
        cmd: sshd -t
      register: hardened_sshd_test
      changed_when: false
      ignore_errors: true

    - name: Remove hardening file if validation failed
      ansible.builtin.file:
        path: "{{ ssh_hardening_file }}"
        state: absent
      when: hardened_sshd_test.rc != 0

    - name: Fail safely if new SSH configuration is invalid
      ansible.builtin.fail:
        msg: >-
          New SSH hardening configuration is invalid.
          The Ansible-created configuration was removed.
          SSH has NOT been restarted.
          Error: {{ hardened_sshd_test.stderr }}
      when: hardened_sshd_test.rc != 0

    - name: Get final effective SSH configuration
      ansible.builtin.command:
        cmd: sshd -T
      register: final_sshd_config
      changed_when: false

    - name: Display final MAC configuration
      ansible.builtin.debug:
        msg: >-
          {{
            final_sshd_config.stdout_lines
            | select('match', '^macs ')
            | list
          }}

    - name: Display final cipher configuration
      ansible.builtin.debug:
        msg: >-
          {{
            final_sshd_config.stdout_lines
            | select('match', '^ciphers ')
            | list
          }}

    - name: Verify CBC ciphers are disabled
      ansible.builtin.assert:
        that:
          - "'3des-cbc' not in final_sshd_config.stdout"
          - "'aes128-cbc' not in final_sshd_config.stdout"
          - "'aes192-cbc' not in final_sshd_config.stdout"
          - "'aes256-cbc' not in final_sshd_config.stdout"
        fail_msg: "CBC cipher detected in effective SSH configuration."

    - name: Verify MD5 MACs are disabled
      ansible.builtin.assert:
        that:
          - "'hmac-md5' not in final_sshd_config.stdout"
          - "'hmac-md5-96' not in final_sshd_config.stdout"
          - "'hmac-md5-etm@openssh.com' not in final_sshd_config.stdout"
          - "'hmac-md5-96-etm@openssh.com' not in final_sshd_config.stdout"
        fail_msg: "MD5 MAC detected in effective SSH configuration."

    - name: Verify 96-bit MACs are disabled
      ansible.builtin.assert:
        that:
          - "'hmac-sha1-96' not in final_sshd_config.stdout"
          - "'hmac-sha1-96-etm@openssh.com' not in final_sshd_config.stdout"
          - "'hmac-md5-96' not in final_sshd_config.stdout"
          - "'hmac-md5-96-etm@openssh.com' not in final_sshd_config.stdout"
        fail_msg: "96-bit MAC detected in effective SSH configuration."

    - name: Restart SSH only after all validation succeeds
      ansible.builtin.systemd:
        name: ssh
        state: restarted
        enabled: true
      when: ssh_hardening_changed.changed

    - name: Verify SSH service
      ansible.builtin.systemd:
        name: ssh
        state: started
      register: ssh_service

    - name: Final sshd syntax check
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false

  post_tasks:

    - name: Display remediation result
      ansible.builtin.debug:
        msg:
          - "SSH cryptographic hardening completed."
          - "Target: {{ inventory_hostname }}"
          - "MACs: {{ effective_macs | join(',') }}"
          - "Ciphers: {{ allowed_ciphers | join(',') }}"
