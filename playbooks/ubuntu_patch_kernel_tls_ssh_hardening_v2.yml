---
# Ubuntu 24.04 AWX patching and hardening playbook
#
# IMPORTANT:
# - Test in staging first and take VM snapshots/backups.
# - Keep out-of-band console access available before SSH/kernel changes.
# - TLS policy is applied to Nginx/Apache if installed. TLS 1.2 is retained
#   alongside TLS 1.3 for compatibility; set tls_protocols to "TLSv1.3" only
#   after confirming every client/application supports TLS 1.3.
# - Kernel cleanup protects metapackages and keeps the newest two installed
#   versioned generic kernels, plus the running kernel if it is older.
# - Hosts that fail a task are marked failed, but Ansible continues with other
#   hosts unless the AWX job is configured to stop on failure.

- name: Patch Ubuntu 24.04 and harden SSH/TLS
  hosts: all
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: false
  max_fail_percentage: 100

  vars:
    supported_distribution: Ubuntu
    supported_release: "24.04"

    # Compatibility-first setting. Use only TLSv1.3 if explicitly required
    # and all application/client compatibility has been tested.
    tls_protocols: "TLSv1.2 TLSv1.3"

    kernel_metapackages:
      - linux-image-generic
      - linux-image-generic-hwe-24.04

    ssh_crypto_policy: |
      # Managed by Ansible: modern SSH cryptography
      KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
      HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
      PubkeyAcceptedAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

  pre_tasks:
    - name: Skip hosts that are not Ubuntu 24.04
      ansible.builtin.meta: end_host
      when: >-
        not (ansible_facts.distribution == supported_distribution and
        ansible_facts.distribution_version is version(supported_release, '=='))

    - name: Check APT package update simulation
      ansible.builtin.shell: |
        set -o pipefail
        apt-get -s dist-upgrade 2>/dev/null | awk '/^Inst / {print}'
      args:
        executable: /bin/bash
      register: patch_audit
      changed_when: false
      failed_when: false

    - name: Get installed versioned generic kernel image packages
      ansible.builtin.shell: |
        dpkg-query -W -f='${binary:Package}\n' 'linux-image-[0-9]*-generic' 2>/dev/null \
          | sed 's/:.*//' | sort -u || true
      args:
        executable: /bin/bash
      register: kernel_audit
      changed_when: false
      failed_when: false

    - name: Check whether Nginx package is installed
      ansible.builtin.command: dpkg-query -W -f=${Status} nginx
      register: nginx_package_audit
      changed_when: false
      failed_when: false

    - name: Check whether Apache package is installed
      ansible.builtin.command: dpkg-query -W -f=${Status} apache2
      register: apache_package_audit
      changed_when: false
      failed_when: false

    - name: Read effective SSH daemon settings
      ansible.builtin.command: /usr/sbin/sshd -T
      register: ssh_audit
      changed_when: false
      failed_when: false

    - name: Inspect effective Nginx TLS protocol directives
      ansible.builtin.shell: |
        nginx -T 2>&1 | awk '/ssl_protocols[[:space:]]/ {print}' || true
      args:
        executable: /bin/bash
      register: nginx_tls_audit
      changed_when: false
      failed_when: false
      when: nginx_package_audit.rc == 0 and 'install ok installed' in nginx_package_audit.stdout

    - name: Inspect Apache TLS protocol directives
      ansible.builtin.shell: |
        grep -RhsE '^[[:space:]]*SSLProtocol[[:space:]]' /etc/apache2 2>/dev/null || true
      args:
        executable: /bin/bash
      register: apache_tls_audit
      changed_when: false
      failed_when: false
      when: apache_package_audit.rc == 0 and 'install ok installed' in apache_package_audit.stdout

    - name: Calculate SSH compliance
      ansible.builtin.set_fact:
        ssh_policy_compliant: >-
          {{
            ssh_audit.rc == 0 and
            'chacha20-poly1305@openssh.com' in ssh_audit.stdout and
            'hmac-sha2-512-etm@openssh.com' in ssh_audit.stdout and
            ('sntrup761x25519-sha512@openssh.com' in ssh_audit.stdout or
             'curve25519-sha256' in ssh_audit.stdout)
          }}

    - name: Calculate web TLS compliance
      ansible.builtin.set_fact:
        tls_policy_compliant: >-
          {{
            (
              (nginx_package_audit.rc != 0 or
               'install ok installed' not in nginx_package_audit.stdout or
               (nginx_tls_audit is defined and
                'TLSv1.3' in nginx_tls_audit.stdout and
                'TLSv1.1' not in nginx_tls_audit.stdout and
                'TLSv1 ' not in nginx_tls_audit.stdout))
            and
            (apache_package_audit.rc != 0 or
             'install ok installed' not in apache_package_audit.stdout or
             (apache_tls_audit is defined and
              'TLSv1.3' in apache_tls_audit.stdout and
              'TLSv1.1' not in apache_tls_audit.stdout and
              'TLSv1 ' not in apache_tls_audit.stdout)))
          }}

    - name: Calculate package and kernel compliance
      ansible.builtin.set_fact:
        packages_compliant: "{{ (patch_audit.stdout | default('') | trim) == '' and patch_audit.rc == 0 }}"
        kernel_count: "{{ kernel_audit.stdout_lines | default([]) | length }}"
        kernel_count_compliant: "{{ (kernel_audit.stdout_lines | default([]) | length) <= 2 }}"

    - name: Report compliant host
      ansible.builtin.debug:
        msg: "SKIPPED {{ inventory_hostname }}: preliminary package, kernel-count, TLS and SSH checks indicate compliance."
      when:
        - packages_compliant | bool
        - kernel_count_compliant | bool
        - tls_policy_compliant | bool
        - ssh_policy_compliant | bool

    - name: End host when all audited settings are compliant
      ansible.builtin.meta: end_host
      when:
        - packages_compliant | bool
        - kernel_count_compliant | bool
        - tls_policy_compliant | bool
        - ssh_policy_compliant | bool

  tasks:
    - name: Refresh APT cache (retry transient failures)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
      register: apt_refresh
      retries: 3
      delay: 10
      until: apt_refresh is succeeded

    - name: Apply available package updates
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        autoremove: false
        autoclean: true
        dpkg_options: force-confdef,force-confold
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Ensure generic/HWE kernel metapackages that are already installed remain installed
      ansible.builtin.shell: |
        set -e
        for p in linux-image-generic linux-image-generic-hwe-24.04; do
          if dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed'; then
            apt-mark manual "$p" >/dev/null
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Get running kernel release
      ansible.builtin.command: uname -r
      register: running_kernel
      changed_when: false

    - name: Get installed versioned kernel package names in version order
      ansible.builtin.shell: |
        set -e
        for p in $(dpkg-query -W -f='${binary:Package}\n' 'linux-image-[0-9]*-generic' 2>/dev/null | sed 's/:.*//' | sort -u); do
          version="${p#linux-image-}"
          printf '%s\t%s\n' "$version" "$p"
        done | sort -V
      args:
        executable: /bin/bash
      register: sorted_kernels
      changed_when: false
      failed_when: false

    - name: Calculate newest two kernel packages to retain
      ansible.builtin.set_fact:
        newest_two_kernels: "{{ (sorted_kernels.stdout_lines | default([]) | map('regex_replace', '^.*\\t', '') | list)[-2:] }}"
      when: (sorted_kernels.stdout_lines | default([]) | length) > 0

    - name: Retain the running kernel too if it is outside the newest two
      ansible.builtin.set_fact:
        kernels_to_keep: >-
          {{
            (newest_two_kernels | default([])) +
            (
              (sorted_kernels.stdout_lines | default([]) |
               select('search', running_kernel.stdout) |
               map('regex_replace', '^.*\\t', '') | list)
            )
          | unique }}
      when: newest_two_kernels is defined

    - name: Remove older versioned kernel image packages only
      ansible.builtin.apt:
        name: "{{ item }}"
        state: absent
        purge: true
        autoremove: false
      loop: >-
        {{
          (sorted_kernels.stdout_lines | default([]) |
           map('regex_replace', '^.*\\t', '') | list) |
          difference(kernels_to_keep | default([]))
        }}
      when:
        - sorted_kernels.stdout_lines is defined
        - sorted_kernels.stdout_lines | length > 2
      # Only explicitly named versioned linux-image packages are removed.
      # Kernel metapackages and autoremove are never targeted here.

    - name: Ensure SSH configuration drop-in directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Back up SSH main configuration
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: "/etc/ssh/sshd_config.ansible-backup-{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
        force: false

    - name: Install modern SSH algorithm policy
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-ansible-crypto-hardening.conf
        content: "{{ ssh_crypto_policy }}\n"
        owner: root
        group: root
        mode: "0600"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Validate and reload SSH

    - name: Back up Nginx configuration before changes
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "/root/nginx-config-backup-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
          - -C
          - /
          - etc/nginx
      args:
        creates: "/root/nginx-config-backup-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
      changed_when: true
      when: nginx_package_audit.rc == 0 and 'install ok installed' in nginx_package_audit.stdout

    - name: Remove duplicate Nginx ssl_protocols directives from regular config files
      ansible.builtin.shell: |
        set -e
        python3 - <<'PYCODE'
        import os, re
        root = '/etc/nginx'
        pattern = re.compile(r'^\s*ssl_protocols\s+.*?;\s*(?:#.*)?$')
        for base, dirs, files in os.walk(root):
            dirs[:] = [d for d in dirs if d not in ('modules',)]
            for name in files:
                path = os.path.join(base, name)
                if os.path.islink(path) or not os.path.isfile(path):
                    continue
                try:
                    with open(path, 'r', encoding='utf-8') as f:
                        lines = f.readlines()
                except (UnicodeDecodeError, OSError):
                    continue
                filtered = [line for line in lines if not pattern.match(line)]
                if filtered != lines:
                    with open(path, 'w', encoding='utf-8') as f:
                        f.writelines(filtered)
        PYCODE
      args:
        executable: /bin/bash
      changed_when: true
      when: nginx_package_audit.rc == 0 and 'install ok installed' in nginx_package_audit.stdout

    - name: Configure one shared Nginx TLS protocol policy
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/00-ansible-tls-hardening.conf
        content: |
          # Managed by Ansible: single shared TLS protocol policy.
          ssl_protocols {{ tls_protocols }};
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload Nginx
      when: nginx_package_audit.rc == 0 and 'install ok installed' in nginx_package_audit.stdout

    - name: Back up Apache configuration before changes
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "/root/apache-config-backup-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
          - -C
          - /
          - etc/apache2
      args:
        creates: "/root/apache-config-backup-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
      changed_when: true
      when: apache_package_audit.rc == 0 and 'install ok installed' in apache_package_audit.stdout

    - name: Configure Apache TLS protocol policy
      ansible.builtin.copy:
        dest: /etc/apache2/conf-available/ansible-tls-hardening.conf
        content: |
          # Managed by Ansible. TLS 1.2 retained for compatibility; TLS 1.3 enabled.
          SSLProtocol {{ tls_protocols }}
        owner: root
        group: root
        mode: "0644"
      notify: Validate and reload Apache
      when: apache_package_audit.rc == 0 and 'install ok installed' in apache_package_audit.stdout

    - name: Enable Apache SSL module
      ansible.builtin.command: a2enmod ssl
      register: apache_ssl_module
      changed_when: "'Enabling module ssl' in apache_ssl_module.stdout"
      failed_when: false
      when: apache_package_audit.rc == 0 and 'install ok installed' in apache_package_audit.stdout

    - name: Enable Apache TLS hardening configuration
      ansible.builtin.command: a2enconf ansible-tls-hardening
      register: apache_tls_conf
      changed_when: "'Enabling conf ansible-tls-hardening' in apache_tls_conf.stdout"
      failed_when: false
      notify: Validate and reload Apache
      when: apache_package_audit.rc == 0 and 'install ok installed' in apache_package_audit.stdout

    - name: Apply pending validation/reload handlers before final checks
      ansible.builtin.meta: flush_handlers

    - name: Validate effective SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: ssh_final
      changed_when: false
      failed_when: >-
        ssh_final.rc != 0 or
        'chacha20-poly1305@openssh.com' not in ssh_final.stdout or
        'hmac-sha2-512-etm@openssh.com' not in ssh_final.stdout

    - name: Validate Nginx configuration and TLS protocol
      ansible.builtin.shell: |
        set -e
        nginx -t
        nginx -T 2>&1 | grep -E 'ssl_protocols.*TLSv1\.3'
      args:
        executable: /bin/bash
      register: nginx_final
      changed_when: false
      when: nginx_package_audit.rc == 0 and 'install ok installed' in nginx_package_audit.stdout

    - name: Validate Apache configuration and TLS protocol
      ansible.builtin.shell: |
        set -e
        apache2ctl configtest
        grep -RhsE '^[[:space:]]*SSLProtocol.*TLSv1\.3' /etc/apache2/conf-enabled
      args:
        executable: /bin/bash
      register: apache_final
      changed_when: false
      when: apache_package_audit.rc == 0 and 'install ok installed' in apache_package_audit.stdout

    - name: Report successful remediation
      ansible.builtin.debug:
        msg:
          - "Host {{ inventory_hostname }} passed the configured SSH checks."
          - "TLS policy configured for installed Nginx/Apache: {{ tls_protocols }}."
          - "Kernel metapackages were protected from explicit cleanup."
          - "Reboot may be required to activate the newly installed kernel."

  handlers:
    - name: Validate and reload SSH
      ansible.builtin.shell: |
        set -e
        /usr/sbin/sshd -t
        if systemctl is-active --quiet ssh; then
          systemctl reload ssh
        elif systemctl is-active --quiet sshd; then
          systemctl reload sshd
        fi
      args:
        executable: /bin/bash
      listen: Validate and reload SSH

    - name: Validate and reload Nginx
      ansible.builtin.shell: |
        set -e
        nginx -t
        systemctl reload nginx
      args:
        executable: /bin/bash
      listen: Validate and reload Nginx

    - name: Validate and reload Apache
      ansible.builtin.shell: |
        set -e
        apache2ctl configtest
        systemctl reload apache2
      args:
        executable: /bin/bash
      listen: Validate and reload Apache
