      - package: 'wget'
        vulnerable_version: '1.21.4-1ubuntu4.1'

  tasks:
    - name: Validate Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
        fail_msg: "This playbook is intended for Ubuntu."

    - name: Create report directory
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Generate report timestamp
      ansible.builtin.command: date +%Y%m%d_%H%M%S
      register: report_timestamp
      changed_when: false

    - name: Set report path
      ansible.builtin.set_fact:
        report_file: "{{ report_dir }}/full_vulnerability_remediation_{{ report_timestamp.stdout }}.txt"

    - name: Capture running kernel BEFORE
      ansible.builtin.command: uname -r
      register: kernel_before
      changed_when: false

    - name: Capture reboot requirement BEFORE
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_before

    - name: Capture installed kernels BEFORE
      ansible.builtin.shell: |
        find /boot -maxdepth 1 -type f -name 'vmlinuz-*' -printf '%f\n' 2>/dev/null |
        sed 's/^vmlinuz-//' | sort -V
      args:
        executable: /bin/bash
      register: kernels_before
      changed_when: false

    - name: Capture source package versions BEFORE
      ansible.builtin.shell: |
        {% for f in source_findings %}
        printf '%s\t' '{{ f.package }}'
        dpkg-query -W -f='${Version}' '{{ f.package }}' 2>/dev/null || printf 'NOT_INSTALLED'
        printf '\n'
        {% endfor %}
      args:
        executable: /bin/bash
      register: source_before
      changed_when: false

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0
        update_cache_retries: 5
        update_cache_retry_max_delay: 15
      register: apt_update

    - name: Upgrade all installed packages including phased updates
      ansible.builtin.command:
        cmd: apt-get -o APT::Get::Always-Include-Phased-Updates=true upgrade -y
      register: apt_upgrade
      changed_when: "'0 upgraded' not in (apt_upgrade.stdout | default(''))"
      failed_when: false

    - name: Full distribution upgrade including phased updates
      ansible.builtin.command:
        cmd: apt-get -o APT::Get::Always-Include-Phased-Updates=true dist-upgrade -y
      register: apt_dist_upgrade
      changed_when: "'0 upgraded' not in (apt_dist_upgrade.stdout | default(''))"
      failed_when: false

    - name: Select Ubuntu kernel meta package
      ansible.builtin.set_fact:
        kernel_meta_package: >-
          {{ 'linux-generic-hwe-24.04'
             if ansible_facts.distribution_major_version | int == 24
             else 'linux-generic' }}

    - name: Upgrade Ubuntu kernel meta package
      ansible.builtin.command:
        cmd: apt-get -o APT::Get::Always-Include-Phased-Updates=true install -y "{{ kernel_meta_package }}"
      register: kernel_upgrade
      changed_when: "'0 upgraded' not in (kernel_upgrade.stdout | default(''))"
      failed_when: false

    - name: Repair interrupted dpkg configuration
      ansible.builtin.command: dpkg --configure -a
      register: dpkg_configure
      changed_when: false
      failed_when: false

    - name: Autoremove obsolete dependencies
      ansible.builtin.command:
        cmd: apt-get autoremove -y
      register: autoremove
      changed_when: "'0 removed' not in (autoremove.stdout | default(''))"
      failed_when: false

    - name: Capture installed kernels AFTER package upgrade
      ansible.builtin.shell: |
        find /boot -maxdepth 1 -type f -name 'vmlinuz-*' -printf '%f\n' 2>/dev/null |
        sed 's/^vmlinuz-//' | sort -V
      args:
        executable: /bin/bash
      register: kernels_after_install
      changed_when: false

    - name: Determine newest installed kernel
      ansible.builtin.set_fact:
        newest_kernel: >-
          {{ kernels_after_install.stdout_lines[-1]
             if (kernels_after_install.stdout_lines | length > 0)
             else '' }}

    - name: Determine whether a newer kernel was installed
      ansible.builtin.set_fact:
        newer_kernel_installed: >-
          {{ newest_kernel | length > 0 and newest_kernel != kernel_before.stdout }}

    - name: Check reboot requirement AFTER upgrade
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_after_upgrade

    - name: Reboot if requested and required
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        connect_timeout: 10
        pre_reboot_delay: 5
        post_reboot_delay: 20
        test_command: uname -r
      register: reboot_result
      when:
        - perform_reboot | bool
        - reboot_after_upgrade.stat.exists

    - name: Capture running kernel AFTER
      ansible.builtin.command: uname -r
      register: kernel_after
      changed_when: false

    - name: Capture source package versions AFTER
      ansible.builtin.shell: |
        {% for f in source_findings %}
        printf '%s\t' '{{ f.package }}'
        dpkg-query -W -f='${Version}' '{{ f.package }}' 2>/dev/null || printf 'NOT_INSTALLED'
        printf '\n'
        {% endfor %}
      args:
        executable: /bin/bash
      register: source_after
      changed_when: false

    - name: Check remaining APT upgrades
      ansible.builtin.shell: |
        apt list --upgradable 2>/dev/null | sed '1d' || true
      args:
        executable: /bin/bash
      register: remaining_upgrades
      changed_when: false

    - name: Capture final reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_final

    - name: Capture installed kernels AFTER
      ansible.builtin.shell: |
        find /boot -maxdepth 1 -type f -name 'vmlinuz-*' -printf '%f\n' 2>/dev/null |
        sed 's/^vmlinuz-//' | sort -V
      args:
        executable: /bin/bash
      register: kernels_after
      changed_when: false

    - name: Determine final status
      ansible.builtin.set_fact:
        final_status: >-
          {{ 'REMEDIATED'
             if (remaining_upgrades.stdout | trim) == ''
             and not reboot_final.stat.exists
             else 'REMEDIATION_INCOMPLETE' }}

    - name: Determine final reason
      ansible.builtin.set_fact:
        final_reason: >-
          {{ 'All currently available package upgrades were applied and no reboot is pending.'
             if final_status == 'REMEDIATED'
             else 'Remaining package upgrades exist and/or Ubuntu still requires a reboot. Review the report.' }}

    - name: Display detailed remediation result
      ansible.builtin.debug:
        msg: |
          ============================================================
          UBUNTU FULL VULNERABILITY REMEDIATION
          ============================================================
          Source: {{ source_file }}
          Host: {{ inventory_hostname }}
          Records: {{ source_record_count }}
          Unique CVEs: {{ source_unique_cves }}

          BEFORE
          Running kernel: {{ kernel_before.stdout }}
          Installed kernels:
          {{ kernels_before.stdout if kernels_before.stdout else 'NONE' }}
          Reboot required: {{ reboot_before.stat.exists }}
          Source package versions:
          {{ source_before.stdout if source_before.stdout else 'NONE' }}

          REMEDIATION
          APT update rc: {{ apt_update.rc | default('N/A') }}
          apt upgrade: {{ 'CHANGED' if apt_upgrade.changed else 'NO CHANGE' }}
          apt dist-upgrade: {{ 'CHANGED' if apt_dist_upgrade.changed else 'NO CHANGE' }}
          Kernel meta package: {{ kernel_meta_package }}
          Kernel upgrade: {{ 'CHANGED' if kernel_upgrade.changed else 'NO CHANGE' }}
          Newer kernel installed: {{ newer_kernel_installed }}
          Newest kernel: {{ newest_kernel }}
          Reboot requested: {{ perform_reboot }}
          Reboot performed: {{ reboot_result.changed | default(false) }}

          AFTER
          Running kernel: {{ kernel_after.stdout }}
          Installed kernels:
          {{ kernels_after.stdout if kernels_after.stdout else 'NONE' }}
          Remaining APT upgrades:
          {{ remaining_upgrades.stdout if remaining_upgrades.stdout else 'NONE' }}
          Reboot required: {{ reboot_final.stat.exists }}
          Source package versions AFTER:
          {{ source_after.stdout if source_after.stdout else 'NONE' }}

          RESULT: {{ final_status }}
          REASON: {{ final_reason }}
          REPORT: {{ report_file }}
          ============================================================

    - name: Write complete remediation report
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          ============================================================
          UBUNTU FULL VULNERABILITY REMEDIATION REPORT
          ============================================================

          Source CSV:
          {{ source_file }}

          Host:
          {{ inventory_hostname }}

          Report timestamp:
          {{ report_timestamp.stdout }}

          Vulnerability records:
          {{ source_record_count }}

          Unique CVEs:
          {{ source_unique_cves }}

          ============================================================
          1. BEFORE STATE
          ============================================================

          Running kernel:
          {{ kernel_before.stdout }}

          Installed kernels:
          {{ kernels_before.stdout if kernels_before.stdout else 'NONE' }}

          Reboot required:
          {{ reboot_before.stat.exists }}

          Source package versions BEFORE:
          {{ source_before.stdout if source_before.stdout else 'NONE' }}

          ============================================================
          2. REMEDIATION ACTIONS
          ============================================================

          APT update rc:
          {{ apt_update.rc | default('N/A') }}

          APT upgrade:
          {{ 'CHANGED' if apt_upgrade.changed else 'NO CHANGE' }}

          APT upgrade rc:
          {{ apt_upgrade.rc | default('N/A') }}

          APT dist-upgrade:
          {{ 'CHANGED' if apt_dist_upgrade.changed else 'NO CHANGE' }}

          APT dist-upgrade rc:
          {{ apt_dist_upgrade.rc | default('N/A') }}

          Kernel meta package:
          {{ kernel_meta_package }}

          Kernel upgrade:
          {{ 'CHANGED' if kernel_upgrade.changed else 'NO CHANGE' }}

          Autoremove:
          {{ 'CHANGED' if autoremove.changed else 'NO CHANGE' }}

          Newer kernel installed:
          {{ newer_kernel_installed }}

          Newest installed kernel:
          {{ newest_kernel }}

          Reboot requested:
          {{ perform_reboot }}

          Reboot performed:
          {{ reboot_result.changed | default(false) }}

          ============================================================
          3. AFTER STATE
          ============================================================

          Running kernel:
          {{ kernel_after.stdout }}

          Installed kernels:
          {{ kernels_after.stdout if kernels_after.stdout else 'NONE' }}

          Remaining APT upgrades:
          {{ remaining_upgrades.stdout if remaining_upgrades.stdout else 'NONE' }}

          Reboot required:
          {{ reboot_final.stat.exists }}

          Source package versions AFTER:
          {{ source_after.stdout if source_after.stdout else 'NONE' }}

          ============================================================
          4. FINAL STATUS
          ============================================================

          STATUS:
          {{ final_status }}

          REASON:
          {{ final_reason }}

          ============================================================
          END REPORT
          ============================================================

    - name: Fail if remediation is incomplete
      ansible.builtin.fail:
        msg: >-
          Vulnerability remediation is incomplete. {{ final_reason }}
          Full report: {{ report_file }}
      when: final_status != 'REMEDIATED'
