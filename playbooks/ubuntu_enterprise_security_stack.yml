---
# ================================================================
# Ubuntu Enterprise Security Stack
# ================================================================
#
# Components:
#   1. ManageEngine Endpoint Central / UEMS Linux Agent
#   2. Wazuh Agent
#   3. Zabbix Agent 2
#   4. Auditd
#   5. Chrony
#   6. Rsyslog
#   7. Unattended Security Updates
#
# Workflow:
#
#   DETECT
#      |
#      v
#   INVENTORY
#      |
#      v
#   INSTALL ONLY IF MISSING
#      |
#      v
#   CONFIGURE
#      |
#      v
#   START / ENABLE SERVICES
#      |
#      v
#   VERSION VERIFICATION
#      |
#      v
#   HEALTH CHECK
#      |
#      v
#   PATCH STATUS
#      |
#      v
#   FINAL REPORT
#
# Tested design target:
#   Ubuntu 22.04
#   Ubuntu 24.04
#
# ================================================================


- name: Ubuntu Enterprise Security Stack
  hosts: ubuntu_servers
  become: true
  gather_facts: true

  vars:

    # ============================================================
    # GENERAL SETTINGS
    # ============================================================

    minimum_disk_space_gb: 2

    # IMPORTANT:
    # false = only configure automatic security patching.
    # true  = perform apt dist-upgrade.
    perform_os_upgrade: false

    # Automatically reboot after patching.
    auto_reboot: false


    # ============================================================
    # UEMS / ENDPOINT CENTRAL
    # ============================================================

    uems_enabled: true

    # Internal software repository
    uems_download_url: "http://192.168.10.10/Softwares/DefaultRemoteOffice_UEMSLinuxAgent.zip"

    uems_download_dir: "/opt/uems-installer"

    uems_archive_name: "DefaultRemoteOffice_UEMSLinuxAgent.zip"

    # Vendor documented default installation directory
    uems_install_dir: "/usr/local/desktopcentralagent"

    # Installer supplied inside ZIP
    uems_installer_name: "UEMS_LinuxAgent.bin"

    # Property file supplied inside ZIP
    uems_serverinfo_name: "serverinfo.json"


    # ============================================================
    # WAZUH
    # ============================================================

    wazuh_enabled: true

    wazuh_manager_ip: "192.168.10.54"

    wazuh_manager_port: 1514

    wazuh_registration_port: 1515

    wazuh_agent_group: "ubuntu-servers"


    # ============================================================
    # ZABBIX
    # ============================================================

    zabbix_enabled: true

    zabbix_server_ip: "192.168.10.216"

    zabbix_server_port: 10051

    zabbix_version: "7.0"


    # ============================================================
    # PATCH MANAGEMENT
    # ============================================================

    patch_management_enabled: true

    unattended_security_updates: true


    # ============================================================
    # REQUIRED UBUNTU PACKAGES
    # ============================================================

    enterprise_packages:

      - apt-transport-https
      - ca-certificates
      - curl
      - wget
      - gnupg
      - software-properties-common
      - unzip
      - zip
      - jq
      - vim
      - nano
      - net-tools
      - lsof
      - rsync
      - git
      - sudo
      - openssh-client
      - python3
      - python3-apt
      - bash-completion
      - logrotate
      - rsyslog
      - chrony
      - auditd
      - audispd-plugins
      - unattended-upgrades
      - apt-listchanges


  tasks:

    # ============================================================
    # 1. SERVER INFORMATION
    # ============================================================

    - name: Display server information
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - " UBUNTU ENTERPRISE SECURITY DEPLOYMENT"
          - "======================================================"
          - "Hostname       : {{ ansible_hostname }}"
          - "FQDN           : {{ ansible_fqdn }}"
          - "OS             : {{ ansible_distribution }}"
          - "OS Version     : {{ ansible_distribution_version }}"
          - "Kernel         : {{ ansible_kernel }}"
          - "Architecture   : {{ ansible_architecture }}"
          - "Primary IP     : {{ ansible_default_ipv4.address | default('N/A') }}"
          - "CPU Cores      : {{ ansible_processor_vcpus | default('N/A') }}"
          - "RAM            : {{ ansible_memtotal_mb }} MB"
          - "======================================================"


    # ============================================================
    # 2. OS VALIDATION
    # ============================================================

    - name: Validate operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version in ["22", "24"]
        fail_msg: >
          Unsupported operating system.
          This playbook supports Ubuntu 22.04 and Ubuntu 24.04.


    # ============================================================
    # 3. DISK SPACE CHECK
    # ============================================================

    - name: Check root filesystem space
      ansible.builtin.shell:
        cmd: |
          df -BG / --output=avail |
          tail -1 |
          tr -dc '0-9'
      register: root_disk_free
      changed_when: false


    - name: Validate available disk space
      ansible.builtin.assert:
        that:
          - root_disk_free.stdout | int >= minimum_disk_space_gb
        fail_msg: >
          Insufficient disk space.
          Minimum required: {{ minimum_disk_space_gb }} GB.
          Available: {{ root_disk_free.stdout }} GB.


    # ============================================================
    # 4. UPDATE APT CACHE
    # ============================================================

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600


    # ============================================================
    # 5. FULL INSTALLED SOFTWARE INVENTORY
    # ============================================================

    - name: Collect installed Debian packages
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='${Package}|${Version}|${Status}\n' \
            2>/dev/null
      register: installed_packages
      changed_when: false


    - name: Count installed packages
      ansible.builtin.set_fact:
        installed_package_count: "{{ installed_packages.stdout_lines | length }}"


    # ============================================================
    # 6. DETECT UEMS
    # ============================================================

    - name: Check UEMS installation directory
      ansible.builtin.stat:
        path: "{{ uems_install_dir }}"
      register: uems_install_dir_check
      when: uems_enabled


    - name: Check UEMS agent files
      ansible.builtin.find:
        paths:
          - "{{ uems_install_dir }}"
        patterns:
          - "dcaagent"
          - "dcagent"
          - "dctroubleshootingtool"
        recurse: true
        file_type: file
      register: uems_agent_files
      failed_when: false
      when: uems_enabled


    - name: Detect UEMS processes
      ansible.builtin.shell:
        cmd: |
          pgrep -af \
            'desktopcentral|uems|dcagent|dcaagent' || true
      register: uems_process_check
      changed_when: false
      failed_when: false
      when: uems_enabled


    - name: Detect UEMS services
      ansible.builtin.shell:
        cmd: |
          systemctl list-unit-files \
            --type=service \
            --no-legend 2>/dev/null |
          grep -Ei \
            'desktopcentral|uems|dcagent|dcaagent' |
          awk '{print $1}' |
          head -10 || true
      register: uems_service_detection
      changed_when: false
      failed_when: false
      when: uems_enabled


    - name: Set UEMS installation status
      ansible.builtin.set_fact:
        uems_installed: >-
          {{
            (
              uems_install_dir_check.stat.exists
              and
              uems_agent_files.matched | int > 0
            )
            or
            (
              uems_process_check.stdout | trim != ""
            )
            or
            (
              uems_service_detection.stdout | trim != ""
            )
          }}
      when: uems_enabled


    - name: Display UEMS detection result
      ansible.builtin.debug:
        msg:
          - "UEMS enabled       : {{ uems_enabled }}"
          - "UEMS installed     : {{ uems_installed | default(false) }}"
          - "Installation path  : {{ uems_install_dir }}"
          - "Agent files found  : {{ uems_agent_files.matched | default(0) }}"
          - "Services detected  : {{ uems_service_detection.stdout | default('NONE') }}"
      when: uems_enabled


    # ============================================================
    # 7. DETECT WAZUH
    # ============================================================

    - name: Detect Wazuh Agent
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='${Status}' \
            wazuh-agent 2>/dev/null
      register: wazuh_detect
      changed_when: false
      failed_when: false
      when: wazuh_enabled


    - name: Set Wazuh installation status
      ansible.builtin.set_fact:
        wazuh_installed: >-
          {{
            wazuh_detect.rc == 0
            and
            'install ok installed' in wazuh_detect.stdout
          }}
      when: wazuh_enabled


    - name: Display Wazuh detection
      ansible.builtin.debug:
        msg: "Wazuh installed: {{ wazuh_installed | default(false) }}"
      when: wazuh_enabled


    # ============================================================
    # 8. DETECT ZABBIX
    # ============================================================

    - name: Detect Zabbix Agent 2
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='${Status}' \
            zabbix-agent2 2>/dev/null
      register: zabbix_detect
      changed_when: false
      failed_when: false
      when: zabbix_enabled


    - name: Set Zabbix installation status
      ansible.builtin.set_fact:
        zabbix_installed: >-
          {{
            zabbix_detect.rc == 0
            and
            'install ok installed' in zabbix_detect.stdout
          }}
      when: zabbix_enabled


    - name: Display Zabbix detection
      ansible.builtin.debug:
        msg: "Zabbix installed: {{ zabbix_installed | default(false) }}"
      when: zabbix_enabled


    # ============================================================
    # 9. INSTALL REQUIRED PACKAGES
    # ============================================================

    - name: Install required enterprise packages
      ansible.builtin.apt:
        name: "{{ enterprise_packages }}"
        state: present


    # ============================================================
    # 10. UEMS DOWNLOAD DIRECTORY
    # ============================================================

    - name: Create UEMS installer directory
      ansible.builtin.file:
        path: "{{ uems_download_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - uems_enabled
        - not uems_installed


    # ============================================================
    # 11. DOWNLOAD UEMS
    # ============================================================

    - name: Download UEMS Linux Agent package
      ansible.builtin.get_url:
        url: "{{ uems_download_url }}"
        dest: "{{ uems_download_dir }}/{{ uems_archive_name }}"
        owner: root
        group: root
        mode: "0644"
        force: false
      when:
        - uems_enabled
        - not uems_installed


    # ============================================================
    # 12. EXTRACT UEMS
    # ============================================================

    - name: Extract UEMS Linux Agent package
      ansible.builtin.unarchive:
        src: "{{ uems_download_dir }}/{{ uems_archive_name }}"
        dest: "{{ uems_download_dir }}"
        remote_src: true
      when:
        - uems_enabled
        - not uems_installed


    # ============================================================
    # 13. VERIFY UEMS_LinuxAgent.bin
    # ============================================================

    - name: Check UEMS installer
      ansible.builtin.stat:
        path: "{{ uems_download_dir }}/{{ uems_installer_name }}"
      register: uems_bin_check
      when:
        - uems_enabled
        - not uems_installed


    # ============================================================
    # 14. VERIFY serverinfo.json
    # ============================================================

    - name: Check UEMS serverinfo.json
      ansible.builtin.stat:
        path: "{{ uems_download_dir }}/{{ uems_serverinfo_name }}"
      register: uems_serverinfo_check
      when:
        - uems_enabled
        - not uems_installed


    # ============================================================
    # 15. VALIDATE UEMS INSTALLATION FILES
    # ============================================================

    - name: Validate UEMS installation files
      ansible.builtin.assert:
        that:
          - uems_bin_check.stat.exists
          - uems_serverinfo_check.stat.exists
        fail_msg: |
          UEMS installation cannot continue.

          Required files:

          {{ uems_download_dir }}/{{ uems_installer_name }}
          {{ uems_download_dir }}/{{ uems_serverinfo_name }}

          Both files must exist in the same directory.
      when:
        - uems_enabled
        - not uems_installed


    # ============================================================
    # 16. MAKE UEMS INSTALLER EXECUTABLE
    # ============================================================

    - name: Make UEMS installer executable
      ansible.builtin.file:
        path: "{{ uems_download_dir }}/{{ uems_installer_name }}"
        owner: root
        group: root
        mode: "0755"
      when:
        - uems_enabled
        - not uems_installed


    # ============================================================
    # 17. INSTALL UEMS
    # ============================================================

    - name: Install UEMS Linux Agent
      ansible.builtin.command:
        cmd: "./{{ uems_installer_name }}"
        chdir: "{{ uems_download_dir }}"
      register: uems_install_result
      when:
        - uems_enabled
        - not uems_installed


    # ============================================================
    # 18. VERIFY UEMS INSTALLATION
    # ============================================================

    - name: Verify UEMS installation directory
      ansible.builtin.stat:
        path: "{{ uems_install_dir }}"
      register: uems_post_install
      when: uems_enabled


    - name: Check UEMS processes after installation
      ansible.builtin.shell:
        cmd: |
          pgrep -af \
            'desktopcentral|uems|dcagent|dcaagent' || true
      register: uems_process_after_install
      changed_when: false
      failed_when: false
      when: uems_enabled


    # ============================================================
    # 19. DETECT UEMS SERVICE AFTER INSTALL
    # ============================================================

    - name: Detect UEMS service after installation
      ansible.builtin.shell:
        cmd: |
          systemctl list-unit-files \
            --type=service \
            --no-legend 2>/dev/null |
          grep -Ei \
            'desktopcentral|uems|dcagent|dcaagent' |
          awk '{print $1}' |
          head -1 || true
      register: uems_service_after_install
      changed_when: false
      failed_when: false
      when: uems_enabled


    - name: Set UEMS service name
      ansible.builtin.set_fact:
        uems_service_name: "{{ uems_service_after_install.stdout | trim }}"
      when:
        - uems_enabled
        - uems_service_after_install.stdout | trim != ""


    # ============================================================
    # 20. START UEMS SERVICE
    # ============================================================

    - name: Enable and start UEMS service
      ansible.builtin.systemd:
        name: "{{ uems_service_name }}"
        enabled: true
        state: started
      when:
        - uems_enabled
        - uems_service_name is defined
        - uems_service_name | length > 0


    # ============================================================
    # 21. UEMS VERSION
    # ============================================================

    - name: Run UEMS troubleshooting tool
      ansible.builtin.command:
        cmd: "{{ uems_install_dir }}/bin/dctroubleshootingtool"
      register: uems_troubleshooting
      changed_when: false
      failed_when: false
      when:
        - uems_enabled
        - uems_post_install.stat.exists
        - uems_install_dir is defined


    - name: Extract UEMS agent version
      ansible.builtin.set_fact:
        uems_version: >-
          {{
            (
              uems_troubleshooting.stdout
              | regex_findall('AGENT VERSION\\s+([^\\s]+)')
              | first
            )
            | default('UNKNOWN')
          }}
      when:
        - uems_enabled
        - uems_troubleshooting is defined


    # ============================================================
    # 22. WAZUH REPOSITORY
    # ============================================================

    - name: Install Wazuh GPG key
      ansible.builtin.get_url:
        url: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"
        dest: "/usr/share/keyrings/wazuh.gpg"
        owner: root
        group: root
        mode: "0644"
      when:
        - wazuh_enabled
        - not wazuh_installed


    - name: Configure Wazuh repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
        filename: wazuh
        state: present
      when:
        - wazuh_enabled
        - not wazuh_installed


    - name: Update APT cache for Wazuh
      ansible.builtin.apt:
        update_cache: true
      when:
        - wazuh_enabled
        - not wazuh_installed


    # ============================================================
    # 23. INSTALL WAZUH
    # ============================================================

    - name: Install Wazuh Agent
      ansible.builtin.apt:
        name: wazuh-agent
        state: present
      environment:
        WAZUH_MANAGER: "{{ wazuh_manager_ip }}"
        WAZUH_MANAGER_PORT: "{{ wazuh_manager_port }}"
        WAZUH_REGISTRATION_SERVER: "{{ wazuh_manager_ip }}"
        WAZUH_REGISTRATION_PORT: "{{ wazuh_registration_port }}"
        WAZUH_AGENT_GROUP: "{{ wazuh_agent_group }}"
      when:
        - wazuh_enabled
        - not wazuh_installed


    # ============================================================
    # 24. CONFIGURE WAZUH
    # ============================================================

    - name: Configure Wazuh manager
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: '<address>.*?</address>'
        replace: "<address>{{ wazuh_manager_ip }}</address>"
      when:
        - wazuh_enabled
      notify: Restart Wazuh


    # ============================================================
    # 25. START WAZUH
    # ============================================================

    - name: Enable and start Wazuh
      ansible.builtin.systemd:
        name: wazuh-agent
        enabled: true
        state: started
      when: wazuh_enabled


    # ============================================================
    # 26. WAZUH VERSION
    # ============================================================

    - name: Get Wazuh version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='${Version}' \
            wazuh-agent 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: wazuh_version_result
      changed_when: false
      failed_when: false
      when: wazuh_enabled


    # ============================================================
    # 27. ZABBIX REPOSITORY
    # ============================================================

    - name: Download Zabbix repository package
      ansible.builtin.get_url:
        url: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+ubuntu{{ ansible_distribution_version | replace('.', '') }}_all.deb"
        dest: "/tmp/zabbix-release.deb"
        mode: "0644"
      when:
        - zabbix_enabled
        - not zabbix_installed


    - name: Install Zabbix repository
      ansible.builtin.apt:
        deb: "/tmp/zabbix-release.deb"
      when:
        - zabbix_enabled
        - not zabbix_installed


    - name: Update APT cache for Zabbix
      ansible.builtin.apt:
        update_cache: true
      when:
        - zabbix_enabled
        - not zabbix_installed


    # ============================================================
    # 28. INSTALL ZABBIX AGENT 2
    # ============================================================

    - name: Install Zabbix Agent 2
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present
      when:
        - zabbix_enabled
        - not zabbix_installed


    # ============================================================
    # 29. CONFIGURE ZABBIX
    # ============================================================

    - name: Configure Zabbix Server
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*Server='
        line: "Server={{ zabbix_server_ip }}"
      when: zabbix_enabled
      notify: Restart Zabbix


    - name: Configure Zabbix Active Server
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}:{{ zabbix_server_port }}"
      when: zabbix_enabled
      notify: Restart Zabbix


    - name: Configure Zabbix Hostname
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*Hostname='
        line: "Hostname={{ ansible_hostname }}"
      when: zabbix_enabled
      notify: Restart Zabbix


    # ============================================================
    # 30. START ZABBIX
    # ============================================================

    - name: Enable and start Zabbix Agent 2
      ansible.builtin.systemd:
        name: zabbix-agent2
        enabled: true
        state: started
      when: zabbix_enabled


    # ============================================================
    # 31. ZABBIX VERSION
    # ============================================================

    - name: Get Zabbix version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='${Version}' \
            zabbix-agent2 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: zabbix_version_result
      changed_when: false
      failed_when: false
      when: zabbix_enabled


    # ============================================================
    # 32. SYSTEM SERVICES
    # ============================================================

    - name: Ensure Chrony installed
      ansible.builtin.apt:
        name: chrony
        state: present


    - name: Enable Chrony
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started


    - name: Ensure Rsyslog installed
      ansible.builtin.apt:
        name: rsyslog
        state: present


    - name: Enable Rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        enabled: true
        state: started


    - name: Ensure Auditd installed
      ansible.builtin.apt:
        name: auditd
        state: present


    - name: Enable Auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started


    # ============================================================
    # 33. PATCH MANAGEMENT
    # ============================================================

    - name: Configure automatic updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
      when:
        - patch_management_enabled
        - unattended_security_updates


    - name: Configure security unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          Unattended-Upgrade::Origins-Pattern {
              "origin=Ubuntu,archive=${distro_codename}-security";
          };

          Unattended-Upgrade::Remove-Unused-Dependencies "true";

          Unattended-Upgrade::Automatic-Reboot "false";
      when:
        - patch_management_enabled
        - unattended_security_updates


    # ============================================================
    # 34. PENDING UPDATES
    # ============================================================

    - name: Refresh package lists
      ansible.builtin.apt:
        update_cache: true
      when: patch_management_enabled


    - name: Count pending updates
      ansible.builtin.shell:
        cmd: |
          apt list --upgradable 2>/dev/null |
          tail -n +2 |
          wc -l
      register: pending_updates
      changed_when: false
      when: patch_management_enabled


    - name: Get pending security updates
      ansible.builtin.shell:
        cmd: |
          apt list --upgradable 2>/dev/null |
          grep -Ei 'security|esm' |
          wc -l
      register: pending_security_updates
      changed_when: false
      failed_when: false
      when: patch_management_enabled


    # ============================================================
    # 35. OPTIONAL OS UPGRADE
    # ============================================================

    - name: Perform OS package upgrade
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      when:
        - patch_management_enabled
        - perform_os_upgrade


    # ============================================================
    # 36. REBOOT DETECTION
    # ============================================================

    - name: Check whether reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required


    - name: Reboot server when enabled
      ansible.builtin.reboot:
        msg: "Ubuntu Enterprise Security Stack requires system reboot."
        reboot_timeout: 900
        connect_timeout: 30
        test_command: "uptime"
      when:
        - reboot_required.stat.exists
        - auto_reboot


    # ============================================================
    # 37. FINAL SERVICE STATUS
    # ============================================================

    - name: Get UEMS service status
      ansible.builtin.command:
        cmd: "systemctl is-active {{ uems_service_name }}"
      register: uems_service_status
      changed_when: false
      failed_when: false
      when:
        - uems_enabled
        - uems_service_name is defined
        - uems_service_name | length > 0


    - name: Get Wazuh service status
      ansible.builtin.command:
        cmd: "systemctl is-active wazuh-agent"
      register: wazuh_service_status
      changed_when: false
      failed_when: false
      when: wazuh_enabled


    - name: Get Zabbix service status
      ansible.builtin.command:
        cmd: "systemctl is-active zabbix-agent2"
      register: zabbix_service_status
      changed_when: false
      failed_when: false
      when: zabbix_enabled


    - name: Get Chrony service status
      ansible.builtin.command:
        cmd: "systemctl is-active chrony"
      register: chrony_service_status
      changed_when: false
      failed_when: false


    - name: Get Rsyslog service status
      ansible.builtin.command:
        cmd: "systemctl is-active rsyslog"
      register: rsyslog_service_status
      changed_when: false
      failed_when: false


    - name: Get Auditd service status
      ansible.builtin.command:
        cmd: "systemctl is-active auditd"
      register: auditd_service_status
      changed_when: false
      failed_when: false


    # ============================================================
    # 38. VERSION VERIFICATION
    # ============================================================

    - name: Get Auditd version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='${Version}' \
            auditd 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: auditd_version_result
      changed_when: false


    - name: Get Chrony version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='${Version}' \
            chrony 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: chrony_version_result
      changed_when: false


    - name: Get Rsyslog version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='${Version}' \
            rsyslog 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: rsyslog_version_result
      changed_when: false


    # ============================================================
    # 39. FAILED SYSTEMD SERVICES
    # ============================================================

    - name: Detect failed systemd services
      ansible.builtin.shell:
        cmd: |
          systemctl --failed \
            --no-legend \
            --no-pager 2>/dev/null |
          awk '{print $2}' |
          sed '/^$/d' || true
      register: failed_services
      changed_when: false


    # ============================================================
    # 40. CPU / MEMORY / DISK HEALTH
    # ============================================================

    - name: Get memory utilization
      ansible.builtin.shell:
        cmd: |
          free -m |
          awk '/Mem:/ {
            printf "%.1f", ($3/$2)*100
          }'
      register: memory_usage
      changed_when: false


    - name: Get disk utilization
      ansible.builtin.shell:
        cmd: |
          df -P / |
          awk 'NR==2 {
            gsub("%","",$5);
            print $5
          }'
      register: disk_usage
      changed_when: false


    - name: Get load average
      ansible.builtin.shell:
        cmd: |
          awk '{print $1" "$2" "$3}' /proc/loadavg
      register: load_average
      changed_when: false


    # ============================================================
    # 41. SOFTWARE INVENTORY
    # ============================================================

    - name: Generate security software inventory
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='${Package}|${Version}\n' 2>/dev/null |
          grep -Ei \
            'wazuh|zabbix|seqrite|quickheal|manageengine|desktopcentral|uems|auditd|chrony|rsyslog|unattended' \
            || true
      register: security_software_inventory
      changed_when: false


    - name: Generate complete installed package inventory
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='${Package}|${Version}|${Status}\n' \
            2>/dev/null |
          sort
      register: complete_software_inventory
      changed_when: false


    # ============================================================
    # 42. HEALTH CALCULATION
    # ============================================================

    - name: Calculate UEMS health
      ansible.builtin.set_fact:
        uems_health: >-
          {{
            'HEALTHY'
            if
            (
              not uems_enabled
              or
              (
                uems_post_install.stat.exists
                and
                (
                  uems_service_status.rc == 0
                  if uems_service_name is defined
                  else
                  uems_process_after_install.stdout | trim != ""
                )
              )
            )
            else 'FAILED'
          }}


    - name: Calculate Wazuh health
      ansible.builtin.set_fact:
        wazuh_health: >-
          {{
            'HEALTHY'
            if
            (
              not wazuh_enabled
              or
              (
                wazuh_service_status.rc == 0
                and
                wazuh_version_result.stdout != 'NOT_INSTALLED'
              )
            )
            else 'FAILED'
          }}


    - name: Calculate Zabbix health
      ansible.builtin.set_fact:
        zabbix_health: >-
          {{
            'HEALTHY'
            if
            (
              not zabbix_enabled
              or
              (
                zabbix_service_status.rc == 0
                and
                zabbix_version_result.stdout != 'NOT_INSTALLED'
              )
            )
            else 'FAILED'
          }}


    - name: Calculate system services health
      ansible.builtin.set_fact:
        system_services_health: >-
          {{
            'HEALTHY'
            if
            (
              chrony_service_status.rc == 0
              and
              rsyslog_service_status.rc == 0
              and
              auditd_service_status.rc == 0
            )
            else 'FAILED'
          }}


    - name: Calculate overall health
      ansible.builtin.set_fact:
        overall_health: >-
          {{
            'HEALTHY'
            if
            (
              uems_health == 'HEALTHY'
              and
              wazuh_health == 'HEALTHY'
              and
              zabbix_health == 'HEALTHY'
              and
              system_services_health == 'HEALTHY'
              and
              failed_services.stdout | trim == ''
            )
            else 'ATTENTION_REQUIRED'
          }}


    # ============================================================
    # 43. WRITE SERVER REPORT
    # ============================================================

    - name: Create report directory
      ansible.builtin.file:
        path: "/var/log/ubuntu-enterprise"
        state: directory
        owner: root
        group: root
        mode: "0755"


    - name: Generate final server health report
      ansible.builtin.copy:
        dest: "/var/log/ubuntu-enterprise/security-stack-report.txt"
        owner: root
        group: root
        mode: "0644"
        content: |
          ================================================================
                    UBUNTU ENTERPRISE SECURITY REPORT
          ================================================================

          SERVER
          ----------------------------------------------------------------
          Hostname              : {{ ansible_hostname }}
          FQDN                  : {{ ansible_fqdn }}
          IP Address            : {{ ansible_default_ipv4.address | default('N/A') }}
          Operating System      : {{ ansible_distribution }} {{ ansible_distribution_version }}
          Kernel                : {{ ansible_kernel }}
          Architecture          : {{ ansible_architecture }}
          CPU Cores             : {{ ansible_processor_vcpus | default('N/A') }}
          RAM                   : {{ ansible_memtotal_mb }} MB
          Root Free Space      : {{ root_disk_free.stdout }} GB
          Disk Usage            : {{ disk_usage.stdout }}%
          Memory Usage          : {{ memory_usage.stdout }}%
          Load Average          : {{ load_average.stdout }}

          UEMS / ENDPOINT CENTRAL
          ----------------------------------------------------------------
          Enabled               : {{ uems_enabled }}
          Installed             : {{ uems_installed | default(false) }}
          Installation Path     : {{ uems_install_dir }}
          Version               : {{ uems_version | default('UNKNOWN') }}
          Service               : {{ uems_service_name | default('NOT DETECTED') }}
          Service Status        : {{ uems_service_status.stdout | default('NOT DETECTED') }}
          Health                : {{ uems_health }}

          WAZUH AGENT
          ----------------------------------------------------------------
          Enabled               : {{ wazuh_enabled }}
          Installed             : {{ wazuh_installed | default(false) }}
          Manager               : {{ wazuh_manager_ip }}
          Version               : {{ wazuh_version_result.stdout | default('UNKNOWN') }}
          Service Status        : {{ wazuh_service_status.stdout | default('NOT DETECTED') }}
          Health                : {{ wazuh_health }}

          ZABBIX AGENT 2
          ----------------------------------------------------------------
          Enabled               : {{ zabbix_enabled }}
          Installed             : {{ zabbix_installed | default(false) }}
          Server                : {{ zabbix_server_ip }}
          Version               : {{ zabbix_version_result.stdout | default('UNKNOWN') }}
          Service Status        : {{ zabbix_service_status.stdout | default('NOT DETECTED') }}
          Health                : {{ zabbix_health }}

          SYSTEM SERVICES
          ----------------------------------------------------------------
          Auditd Version        : {{ auditd_version_result.stdout }}
          Auditd Service        : {{ auditd_service_status.stdout }}

          Chrony Version        : {{ chrony_version_result.stdout }}
          Chrony Service        : {{ chrony_service_status.stdout }}

          Rsyslog Version       : {{ rsyslog_version_result.stdout }}
          Rsyslog Service       : {{ rsyslog_service_status.stdout }}

          System Services Health: {{ system_services_health }}

          FAILED SERVICES
          ----------------------------------------------------------------
          {{ failed_services.stdout | default('NONE') }}

          PATCH MANAGEMENT
          ----------------------------------------------------------------
          Enabled               : {{ patch_management_enabled }}
          Automatic Security Updates: {{ unattended_security_updates }}
          Pending Updates       : {{ pending_updates.stdout | default('N/A') }}
          Security Updates      : {{ pending_security_updates.stdout | default('N/A') }}
          Reboot Required       : {{ reboot_required.stat.exists }}

          INSTALLED SECURITY SOFTWARE
          ----------------------------------------------------------------
          {{ security_software_inventory.stdout }}

          COMPLETE SOFTWARE INVENTORY
          ----------------------------------------------------------------
          Total Packages       : {{ installed_package_count }}

          {{ complete_software_inventory.stdout }}

          ================================================================
          FINAL STATUS
          ================================================================
          UEMS                  : {{ uems_health }}
          Wazuh                 : {{ wazuh_health }}
          Zabbix                : {{ zabbix_health }}
          System Services       : {{ system_services_health }}
          Overall               : {{ overall_health }}
          ================================================================


    # ============================================================
    # 44. DISPLAY FINAL REPORT
    # ============================================================

    - name: Display final health report
      ansible.builtin.debug:
        msg:
          - ""
          - "================================================================"
          - "        UBUNTU ENTERPRISE SECURITY HEALTH REPORT"
          - "================================================================"
          - ""
          - "SERVER"
          - "----------------------------------------------------------------"
          - "Hostname             : {{ ansible_hostname }}"
          - "IP Address           : {{ ansible_default_ipv4.address | default('N/A') }}"
          - "OS                   : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel               : {{ ansible_kernel }}"
          - "RAM                  : {{ ansible_memtotal_mb }} MB"
          - "Disk Usage           : {{ disk_usage.stdout }}%"
          - "Memory Usage         : {{ memory_usage.stdout }}%"
          - "Load Average         : {{ load_average.stdout }}"
          - ""
          - "UEMS / ENDPOINT CENTRAL"
          - "----------------------------------------------------------------"
          - "Installed            : {{ uems_installed | default(false) }}"
          - "Path                 : {{ uems_install_dir }}"
          - "Version              : {{ uems_version | default('UNKNOWN') }}"
          - "Service              : {{ uems_service_name | default('NOT DETECTED') }}"
          - "Service Status       : {{ uems_service_status.stdout | default('NOT DETECTED') }}"
          - "Health               : {{ uems_health }}"
          - ""
          - "WAZUH"
          - "----------------------------------------------------------------"
          - "Installed            : {{ wazuh_installed | default(false) }}"
          - "Version              : {{ wazuh_version_result.stdout | default('UNKNOWN') }}"
          - "Service Status       : {{ wazuh_service_status.stdout | default('NOT DETECTED') }}"
          - "Health               : {{ wazuh_health }}"
          - ""
          - "ZABBIX"
          - "----------------------------------------------------------------"
          - "Installed            : {{ zabbix_installed | default(false) }}"
          - "Version              : {{ zabbix_version_result.stdout | default('UNKNOWN') }}"
          - "Service Status       : {{ zabbix_service_status.stdout | default('NOT DETECTED') }}"
          - "Health               : {{ zabbix_health }}"
          - ""
          - "PATCH MANAGEMENT"
          - "----------------------------------------------------------------"
          - "Pending Updates      : {{ pending_updates.stdout | default('N/A') }}"
          - "Security Updates     : {{ pending_security_updates.stdout | default('N/A') }}"
          - "Reboot Required      : {{ reboot_required.stat.exists }}"
          - ""
          - "SYSTEM"
          - "----------------------------------------------------------------"
          - "Auditd               : {{ auditd_service_status.stdout }}"
          - "Chrony               : {{ chrony_service_status.stdout }}"
          - "Rsyslog              : {{ rsyslog_service_status.stdout }}"
          - "Failed Services      : {{ failed_services.stdout | default('NONE') }}"
          - ""
          - "================================================================"
          - "OVERALL STATUS        : {{ overall_health }}"
          - "================================================================"
          - ""
          - "Detailed report:"
          - "/var/log/ubuntu-enterprise/security-stack-report.txt"
          - ""


  # ==============================================================
  # HANDLERS
  # ==============================================================

  handlers:

    - name: Restart Wazuh
      ansible.builtin.systemd:
        name: wazuh-agent
        state: restarted
        enabled: true


    - name: Restart Zabbix
      ansible.builtin.systemd:
        name: zabbix-agent2
        state: restarted
        enabled: true
        
