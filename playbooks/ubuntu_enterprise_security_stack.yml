---
# ============================================================================
# Ubuntu Enterprise Security Stack - Production v2
#
# Workflow:
#   DETECT -> INSTALL IF MISSING -> CONFIGURE -> SERVICE VERIFY
#   -> VERSION VERIFY -> PATCH STATUS -> SOFTWARE INVENTORY -> HEALTH REPORT
#
# Components:
#   - ManageEngine UEMS Linux Agent
#   - Wazuh Agent
#   - Zabbix Agent / Agent 2
#   - Auditd
#   - Chrony
#   - Rsyslog
#   - Unattended security updates / patch status
#
# Usage:
#   ansible-playbook -i inventory.ini ubuntu_enterprise_security_stack.yml --syntax-check
#   ansible-playbook -i inventory.ini ubuntu_enterprise_security_stack.yml --limit HOSTNAME
#
# ============================================================================

- name: Ubuntu Enterprise Security Stack
  hosts: ubuntu_servers
  become: true
  gather_facts: true

  vars:
    # -----------------------------
    # General
    # -----------------------------
    minimum_disk_space_gb: 2
    perform_os_upgrade: false
    auto_reboot: false

    # -----------------------------
    # UEMS / ManageEngine
    # -----------------------------
    uems_enabled: true
    uems_download_url: "http://192.168.10.10/Softwares/DefaultRemoteOffice_UEMSLinuxAgent.zip"
    uems_download_dir: "/opt/uems-installer"
    uems_archive_name: "DefaultRemoteOffice_UEMSLinuxAgent.zip"
    uems_install_dir: "/usr/local/desktopcentralagent"
    uems_installer_name: "UEMS_LinuxAgent.bin"
    uems_serverinfo_name: "serverinfo.json"

    # -----------------------------
    # Wazuh
    # -----------------------------
    wazuh_enabled: true
    wazuh_manager_ip: "192.168.10.100"
    wazuh_manager_port: 1514
    wazuh_registration_port: 1515
    wazuh_agent_group: "ubuntu-servers"

    # -----------------------------
    # Zabbix
    # Existing zabbix-agent OR zabbix-agent2 is respected.
    # If neither exists, Agent 2 is installed.
    # -----------------------------
    zabbix_enabled: true
    zabbix_server_ip: "192.168.10.101"
    zabbix_server_port: 10051
    zabbix_version: "7.0"

    # -----------------------------
    # Patch management
    # -----------------------------
    patch_management_enabled: true
    unattended_security_updates: true

    enterprise_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - wget
      - gnupg
      - software-properties-common
      - unzip
      - zip
      - jq
      - vim
      - nano
      - net-tools
      - lsof
      - rsync
      - git
      - sudo
      - openssh-client
      - python3
      - python3-apt
      - bash-completion
      - logrotate

  pre_tasks:

    - name: Display server information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " UBUNTU ENTERPRISE SECURITY STACK"
          - "============================================================"
          - "Hostname       : {{ ansible_hostname }}"
          - "FQDN           : {{ ansible_fqdn }}"
          - "OS             : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel         : {{ ansible_kernel }}"
          - "Architecture   : {{ ansible_architecture }}"
          - "Primary IP     : {{ ansible_default_ipv4.address | default('N/A') }}"
          - "CPU Cores      : {{ ansible_processor_vcpus | default('N/A') }}"
          - "RAM            : {{ ansible_memtotal_mb }} MB"
          - "============================================================"

    - name: Validate operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version in ["22", "24"]
        fail_msg: "Supported operating systems are Ubuntu 22.04 and Ubuntu 24.04."

    - name: Check root filesystem free space
      ansible.builtin.shell:
        cmd: "df -BG / --output=avail | tail -1 | tr -dc '0-9'"
      register: root_disk_free
      changed_when: false

    - name: Validate root disk space
      ansible.builtin.assert:
        that:
          - root_disk_free.stdout | int >= minimum_disk_space_gb
        fail_msg: "Insufficient root filesystem space."

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: auto

  tasks:

    # ========================================================================
    # BASE PACKAGES
    # ========================================================================

    - name: Install required base packages
      ansible.builtin.apt:
        name: "{{ enterprise_packages }}"
        state: present

    # ========================================================================
    # DETECTION - UEMS
    # ========================================================================

    - name: Check UEMS installation path
      ansible.builtin.stat:
        path: "{{ uems_install_dir }}"
      register: uems_install_dir_check
      when: uems_enabled

    - name: Set UEMS path facts
      ansible.builtin.set_fact:
        uems_path_exists: "{{ uems_install_dir_check.stat.exists | default(false) }}"
        uems_path_is_directory: >-
          {{
            uems_install_dir_check.stat.exists | default(false)
            and
            uems_install_dir_check.stat.isdir | default(false)
          }}
      when: uems_enabled

    - name: Detect UEMS files
      ansible.builtin.find:
        paths:
          - "{{ uems_install_dir }}"
        patterns:
          - "dcaagent"
          - "dcagent"
          - "dctroubleshootingtool"
        recurse: true
        file_type: file
      register: uems_agent_files
      changed_when: false
      failed_when: false
      when:
        - uems_enabled
        - uems_path_is_directory | default(false)

    - name: Detect UEMS processes
      ansible.builtin.shell:
        cmd: "pgrep -af 'desktopcentral|uems|dcagent|dcaagent' || true"
      register: uems_process_detection
      changed_when: false
      failed_when: false
      when: uems_enabled

    - name: Detect UEMS services
      ansible.builtin.shell:
        cmd: |
          systemctl list-unit-files --type=service --no-legend 2>/dev/null |
          grep -Ei 'desktopcentral|uems|dcagent|dcaagent' |
          awk '{print $1}' | head -10 || true
      register: uems_service_detection
      changed_when: false
      failed_when: false
      when: uems_enabled

    - name: Determine UEMS installation state
      ansible.builtin.set_fact:
        uems_agent_file_count: "{{ uems_agent_files.matched | default(0) | int }}"
        uems_installed: >-
          {{
            (
              uems_path_is_directory | default(false)
              and
              (uems_agent_files.matched | default(0) | int > 0)
            )
            or
            (uems_process_detection.stdout | default('') | trim != '')
            or
            (uems_service_detection.stdout | default('') | trim != '')
          }}
      when: uems_enabled

    - name: Set UEMS disabled state
      ansible.builtin.set_fact:
        uems_installed: false
        uems_agent_file_count: 0
        uems_path_exists: false
        uems_path_is_directory: false
      when: not uems_enabled

    - name: Display UEMS detection
      ansible.builtin.debug:
        msg:
          - "UEMS enabled         : {{ uems_enabled }}"
          - "UEMS installed       : {{ uems_installed }}"
          - "UEMS path            : {{ uems_install_dir }}"
          - "Path is directory    : {{ uems_path_is_directory | default(false) }}"
          - "Agent files detected : {{ uems_agent_file_count }}"
          - "Services detected    : {{ uems_service_detection.stdout | default('NONE') | trim }}"

    # ========================================================================
    # DETECTION - WAZUH
    # ========================================================================

    - name: Detect Wazuh package
      ansible.builtin.set_fact:
        wazuh_installed: "{{ 'wazuh-agent' in ansible_facts.packages }}"
      when: wazuh_enabled

    - name: Set Wazuh disabled state
      ansible.builtin.set_fact:
        wazuh_installed: false
      when: not wazuh_enabled

    - name: Get installed Wazuh version
      ansible.builtin.set_fact:
        wazuh_installed_version: >-
          {{
            ansible_facts.packages['wazuh-agent'][0].version
            if 'wazuh-agent' in ansible_facts.packages
            else 'NOT_INSTALLED'
          }}

    # ========================================================================
    # DETECTION - ZABBIX
    # ========================================================================

    - name: Detect Zabbix Agent
      ansible.builtin.set_fact:
        zabbix_agent_installed: "{{ 'zabbix-agent' in ansible_facts.packages }}"

    - name: Detect Zabbix Agent 2
      ansible.builtin.set_fact:
        zabbix_agent2_installed: "{{ 'zabbix-agent2' in ansible_facts.packages }}"

    - name: Determine whether Zabbix is installed
      ansible.builtin.set_fact:
        zabbix_installed: >-
          {{
            zabbix_agent_installed
            or
            zabbix_agent2_installed
          }}

    - name: Get Zabbix Agent version
      ansible.builtin.set_fact:
        zabbix_agent_version: >-
          {{
            ansible_facts.packages['zabbix-agent'][0].version
            if 'zabbix-agent' in ansible_facts.packages
            else 'NOT_INSTALLED'
          }}

    - name: Get Zabbix Agent 2 version
      ansible.builtin.set_fact:
        zabbix_agent2_version: >-
          {{
            ansible_facts.packages['zabbix-agent2'][0].version
            if 'zabbix-agent2' in ansible_facts.packages
            else 'NOT_INSTALLED'
          }}

    # ========================================================================
    # DETECTION - SYSTEM SECURITY SERVICES
    # ========================================================================

    - name: Detect Auditd
      ansible.builtin.set_fact:
        auditd_installed: "{{ 'auditd' in ansible_facts.packages }}"

    - name: Detect Chrony
      ansible.builtin.set_fact:
        chrony_installed: "{{ 'chrony' in ansible_facts.packages }}"

    - name: Detect Rsyslog
      ansible.builtin.set_fact:
        rsyslog_installed: "{{ 'rsyslog' in ansible_facts.packages }}"

    # ========================================================================
    # INSTALL / CONFIGURE - AUDITD
    # ========================================================================

    - name: Install Auditd if missing
      ansible.builtin.apt:
        name:
          - auditd
          - audispd-plugins
        state: present

    - name: Enable and start Auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started
      failed_when: false

    # ========================================================================
    # INSTALL / CONFIGURE - CHRONY
    # ========================================================================

    - name: Install Chrony if missing
      ansible.builtin.apt:
        name: chrony
        state: present

    - name: Enable and start Chrony
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started
      failed_when: false

    # ========================================================================
    # INSTALL / CONFIGURE - RSYSLOG
    # ========================================================================

    - name: Install Rsyslog if missing
      ansible.builtin.apt:
        name: rsyslog
        state: present

    - name: Enable and start Rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        enabled: true
        state: started
      failed_when: false

    # ========================================================================
    # UEMS INSTALLATION
    # ========================================================================

    - name: Create UEMS installer directory
      ansible.builtin.file:
        path: "{{ uems_download_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - uems_enabled
        - not uems_installed

    - name: Download UEMS package
      ansible.builtin.get_url:
        url: "{{ uems_download_url }}"
        dest: "{{ uems_download_dir }}/{{ uems_archive_name }}"
        owner: root
        group: root
        mode: "0644"
        force: false
      when:
        - uems_enabled
        - not uems_installed

    - name: Extract UEMS package
      ansible.builtin.unarchive:
        src: "{{ uems_download_dir }}/{{ uems_archive_name }}"
        dest: "{{ uems_download_dir }}"
        remote_src: true
      when:
        - uems_enabled
        - not uems_installed

    - name: Locate UEMS installer binary
      ansible.builtin.find:
        paths:
          - "{{ uems_download_dir }}"
        patterns:
          - "*.bin"
        recurse: true
        file_type: file
      register: uems_bin_files
      changed_when: false
      failed_when: false
      when:
        - uems_enabled
        - not uems_installed

    - name: Validate UEMS installer binary
      ansible.builtin.assert:
        that:
          - uems_bin_files.matched | int > 0
        fail_msg: "No .bin UEMS installer was found in {{ uems_download_dir }}."
      when:
        - uems_enabled
        - not uems_installed

    - name: Set UEMS installer path
      ansible.builtin.set_fact:
        uems_installer_path: "{{ uems_bin_files.files[0].path }}"
      when:
        - uems_enabled
        - not uems_installed
        - uems_bin_files.matched | int > 0

    - name: Make UEMS installer executable
      ansible.builtin.file:
        path: "{{ uems_installer_path }}"
        owner: root
        group: root
        mode: "0755"
      when:
        - uems_enabled
        - not uems_installed

    - name: Install UEMS Linux Agent
      ansible.builtin.command:
        cmd: "{{ uems_installer_path }}"
      register: uems_install_result
      changed_when: true
      failed_when: false
      when:
        - uems_enabled
        - not uems_installed

    # ========================================================================
    # UEMS POST-INSTALL VERIFICATION
    # ========================================================================

    - name: Re-check UEMS installation directory
      ansible.builtin.stat:
        path: "{{ uems_install_dir }}"
      register: uems_post_install_path
      when: uems_enabled

    - name: Detect UEMS files after installation
      ansible.builtin.find:
        paths:
          - "{{ uems_install_dir }}"
        patterns:
          - "dcaagent"
          - "dcagent"
          - "dctroubleshootingtool"
        recurse: true
        file_type: file
      register: uems_post_install_files
      changed_when: false
      failed_when: false
      when:
        - uems_enabled
        - uems_post_install_path.stat.exists | default(false)
        - uems_post_install_path.stat.isdir | default(false)

    - name: Detect UEMS service after installation
      ansible.builtin.shell:
        cmd: |
          systemctl list-unit-files --type=service --no-legend 2>/dev/null |
          grep -Ei 'desktopcentral|uems|dcagent|dcaagent' |
          awk '{print $1}' | head -1 || true
      register: uems_service_after_install
      changed_when: false
      failed_when: false
      when: uems_enabled

    - name: Set UEMS service name
      ansible.builtin.set_fact:
        uems_service_name: "{{ uems_service_after_install.stdout | trim }}"
      when:
        - uems_enabled
        - uems_service_after_install.stdout | default('') | trim != ''

    - name: Enable and start UEMS service
      ansible.builtin.systemd:
        name: "{{ uems_service_name }}"
        enabled: true
        state: started
      register: uems_service_start
      failed_when: false
      when:
        - uems_enabled
        - uems_service_name is defined
        - uems_service_name | length > 0

    - name: Detect UEMS processes after installation
      ansible.builtin.shell:
        cmd: "pgrep -af 'desktopcentral|uems|dcagent|dcaagent' || true"
      register: uems_process_after_install
      changed_when: false
      failed_when: false
      when: uems_enabled

    - name: Initialize UEMS version
      ansible.builtin.set_fact:
        uems_version: "UNKNOWN"

    - name: Check UEMS troubleshooting tool
      ansible.builtin.stat:
        path: "{{ uems_install_dir }}/bin/dctroubleshootingtool"
      register: uems_troubleshooting_tool
      when:
        - uems_enabled
        - uems_post_install_path.stat.exists | default(false)
        - uems_post_install_path.stat.isdir | default(false)

    - name: Run UEMS troubleshooting tool
      ansible.builtin.command:
        cmd: "{{ uems_install_dir }}/bin/dctroubleshootingtool"
      register: uems_troubleshooting
      changed_when: false
      failed_when: false
      when:
        - uems_enabled
        - uems_troubleshooting_tool.stat.exists | default(false)

    - name: Extract UEMS version safely
      ansible.builtin.set_fact:
        uems_version: >-
          {{
            (
              uems_troubleshooting.stdout
              | default('')
              | regex_findall('AGENT VERSION\s+([^\s]+)')
              | first
            )
            | default('UNKNOWN', true)
          }}
      when:
        - uems_enabled
        - uems_troubleshooting is defined

    # ========================================================================
    # WAZUH INSTALLATION
    # ========================================================================

    - name: Install Wazuh GPG key if Wazuh is missing
      ansible.builtin.get_url:
        url: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"
        dest: "/usr/share/keyrings/wazuh.gpg"
        owner: root
        group: root
        mode: "0644"
      when:
        - wazuh_enabled
        - not wazuh_installed

    - name: Configure Wazuh repository if Wazuh is missing
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
        filename: wazuh
        state: present
      when:
        - wazuh_enabled
        - not wazuh_installed

    - name: Update APT cache for Wazuh
      ansible.builtin.apt:
        update_cache: true
      when:
        - wazuh_enabled
        - not wazuh_installed

    - name: Install Wazuh Agent if missing
      ansible.builtin.apt:
        name: wazuh-agent
        state: present
      environment:
        WAZUH_MANAGER: "{{ wazuh_manager_ip }}"
        WAZUH_MANAGER_PORT: "{{ wazuh_manager_port }}"
        WAZUH_REGISTRATION_SERVER: "{{ wazuh_manager_ip }}"
        WAZUH_REGISTRATION_PORT: "{{ wazuh_registration_port }}"
        WAZUH_AGENT_GROUP: "{{ wazuh_agent_group }}"
      when:
        - wazuh_enabled
        - not wazuh_installed

    - name: Configure Wazuh manager address
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: '<address>.*?</address>'
        replace: "<address>{{ wazuh_manager_ip }}</address>"
      register: wazuh_config_change
      failed_when: false
      when:
        - wazuh_enabled
        - wazuh_installed or (wazuh_install_result is defined and wazuh_install_result.rc == 0)
      notify: Restart Wazuh

    - name: Enable and start Wazuh
      ansible.builtin.systemd:
        name: wazuh-agent
        enabled: true
        state: started
      register: wazuh_service_start
      failed_when: false
      when: wazuh_enabled

    - name: Get final Wazuh version
      ansible.builtin.shell:
        cmd: "dpkg-query -W -f='${Version}' wazuh-agent 2>/dev/null || echo 'NOT_INSTALLED'"
      register: wazuh_final_version
      changed_when: false
      failed_when: false

    # ========================================================================
    # ZABBIX INSTALLATION
    # ========================================================================

    - name: Install Zabbix repository package when no Zabbix agent exists
      ansible.builtin.get_url:
        url: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+ubuntu{{ ansible_distribution_version | replace('.', '') }}_all.deb"
        dest: "/tmp/zabbix-release.deb"
        mode: "0644"
      register: zabbix_repo_download
      failed_when: false
      when:
        - zabbix_enabled
        - not zabbix_installed

    - name: Install Zabbix repository package
      ansible.builtin.apt:
        deb: "/tmp/zabbix-release.deb"
      register: zabbix_repo_install
      failed_when: false
      when:
        - zabbix_enabled
        - not zabbix_installed
        - zabbix_repo_download is succeeded

    - name: Update APT cache for Zabbix
      ansible.builtin.apt:
        update_cache: true
      when:
        - zabbix_enabled
        - not zabbix_installed

    - name: Install Zabbix Agent 2 only when neither agent exists
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present
      register: zabbix_install_result
      failed_when: false
      when:
        - zabbix_enabled
        - not zabbix_installed

    # ========================================================================
    # ZABBIX CONFIGURATION
    # ========================================================================

    - name: Configure existing Zabbix Agent
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '^#?\s*Server='
        line: "Server={{ zabbix_server_ip }}"
      register: zabbix_agent_config
      failed_when: false
      when:
        - zabbix_enabled
        - zabbix_agent_installed

    - name: Configure existing Zabbix Agent Active Server
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '^#?\s*ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}:{{ zabbix_server_port }}"
      register: zabbix_agent_active_config
      failed_when: false
      when:
        - zabbix_enabled
        - zabbix_agent_installed

    - name: Configure existing Zabbix Agent Hostname
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agentd.conf
        regexp: '^#?\s*Hostname='
        line: "Hostname={{ ansible_hostname }}"
      register: zabbix_agent_hostname_config
      failed_when: false
      when:
        - zabbix_enabled
        - zabbix_agent_installed

    - name: Configure Zabbix Agent 2
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*Server='
        line: "Server={{ zabbix_server_ip }}"
      register: zabbix_agent2_config
      failed_when: false
      when:
        - zabbix_enabled
        - >
          (zabbix_agent2_installed | default(false))
          or
          (
            (zabbix_install_result is defined)
            and
            (zabbix_install_result.rc | default(1) == 0)
          )

    - name: Configure Zabbix Agent 2 Active Server
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}:{{ zabbix_server_port }}"
      register: zabbix_agent2_active_config
      failed_when: false
      when:
        - zabbix_enabled
        - >
          (zabbix_agent2_installed | default(false))
          or
          (
            (zabbix_install_result is defined)
            and
            (zabbix_install_result.rc | default(1) == 0)
          )

    - name: Configure Zabbix Agent 2 Hostname
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*Hostname='
        line: "Hostname={{ ansible_hostname }}"
      register: zabbix_agent2_hostname_config
      failed_when: false
      when:
        - zabbix_enabled
        - >
          (zabbix_agent2_installed | default(false))
          or
          (
            (zabbix_install_result is defined)
            and
            (zabbix_install_result.rc | default(1) == 0)
          )

    # ========================================================================
    # ZABBIX SERVICE VERIFICATION
    # ========================================================================

    - name: Enable and start existing Zabbix Agent
      ansible.builtin.systemd:
        name: zabbix-agent
        enabled: true
        state: started
      register: zabbix_agent_service_start
      failed_when: false
      when:
        - zabbix_enabled
        - zabbix_agent_installed

    - name: Enable and start Zabbix Agent 2
      ansible.builtin.systemd:
        name: zabbix-agent2
        enabled: true
        state: started
      register: zabbix_agent2_service_start
      failed_when: false
      when:
        - zabbix_enabled
        - >
          (zabbix_agent2_installed | default(false))
          or
          (
            (zabbix_install_result is defined)
            and
            (zabbix_install_result.rc | default(1) == 0)
          )

    - name: Get final Zabbix Agent version
      ansible.builtin.shell:
        cmd: "dpkg-query -W -f='${Version}' zabbix-agent 2>/dev/null || echo 'NOT_INSTALLED'"
      register: zabbix_final_agent_version
      changed_when: false
      failed_when: false

    - name: Get final Zabbix Agent 2 version
      ansible.builtin.shell:
        cmd: "dpkg-query -W -f='${Version}' zabbix-agent2 2>/dev/null || echo 'NOT_INSTALLED'"
      register: zabbix_final_agent2_version
      changed_when: false
      failed_when: false

    # ========================================================================
    # PATCH MANAGEMENT
    # ========================================================================

    - name: Configure automatic APT updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
      when:
        - patch_management_enabled
        - unattended_security_updates

    - name: Configure unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          Unattended-Upgrade::Origins-Pattern {
              "origin=Ubuntu,archive=${distro_codename}-security";
          };
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";
      when:
        - patch_management_enabled
        - unattended_security_updates

    - name: Refresh package lists for patch reporting
      ansible.builtin.apt:
        update_cache: true
      when: patch_management_enabled

    - name: Count pending updates
      ansible.builtin.shell:
        cmd: "apt list --upgradable 2>/dev/null | tail -n +2 | wc -l"
      register: pending_updates
      changed_when: false
      failed_when: false
      when: patch_management_enabled

    - name: Count pending security updates
      ansible.builtin.shell:
        cmd: "apt list --upgradable 2>/dev/null | grep -Ei 'security|esm' | wc -l"
      register: pending_security_updates
      changed_when: false
      failed_when: false
      when: patch_management_enabled

    - name: Perform optional full OS upgrade
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      when:
        - patch_management_enabled
        - perform_os_upgrade

    - name: Check reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Optional reboot
      ansible.builtin.reboot:
        msg: "Ubuntu Enterprise Security Stack requested reboot."
        reboot_timeout: 900
        connect_timeout: 30
        test_command: "uptime"
      when:
        - reboot_required.stat.exists
        - auto_reboot

    # ========================================================================
    # FINAL SERVICE CHECKS
    # ========================================================================

    - name: Check Auditd service
      ansible.builtin.command: systemctl is-active auditd
      register: auditd_service_status
      changed_when: false
      failed_when: false

    - name: Check Chrony service
      ansible.builtin.command: systemctl is-active chrony
      register: chrony_service_status
      changed_when: false
      failed_when: false

    - name: Check Rsyslog service
      ansible.builtin.command: systemctl is-active rsyslog
      register: rsyslog_service_status
      changed_when: false
      failed_when: false

    - name: Check Wazuh service
      ansible.builtin.command: systemctl is-active wazuh-agent
      register: wazuh_service_status
      changed_when: false
      failed_when: false
      when: wazuh_enabled

    - name: Check Zabbix Agent service
      ansible.builtin.command: systemctl is-active zabbix-agent
      register: zabbix_agent_service_status
      changed_when: false
      failed_when: false
      when:
        - zabbix_enabled
        - zabbix_agent_installed

    - name: Check Zabbix Agent 2 service
      ansible.builtin.command: systemctl is-active zabbix-agent2
      register: zabbix_agent2_service_status
      changed_when: false
      failed_when: false
      when:
        - zabbix_enabled
        - >
          (zabbix_agent2_installed | default(false))
          or
          (
            (zabbix_install_result is defined)
            and
            (zabbix_install_result.rc | default(1) == 0)
          )

    - name: Check UEMS service
      ansible.builtin.command: systemctl is-active "{{ uems_service_name }}"
      register: uems_service_status
      changed_when: false
      failed_when: false
      when:
        - uems_enabled
        - uems_service_name is defined
        - uems_service_name | length > 0

    - name: Set UEMS service status when service is not detected
      ansible.builtin.set_fact:
        uems_service_status_text: "NOT_DETECTED"
      when:
        - uems_enabled
        - uems_service_status is not defined

    - name: Set UEMS service status when service is detected
      ansible.builtin.set_fact:
        uems_service_status_text: "{{ uems_service_status.stdout | default('UNKNOWN') }}"
      when:
        - uems_enabled
        - uems_service_status is defined

    # ========================================================================
    # VERSION VERIFICATION
    # ========================================================================

    - name: Get Auditd version
      ansible.builtin.shell:
        cmd: "dpkg-query -W -f='${Version}' auditd 2>/dev/null || echo 'NOT_INSTALLED'"
      register: auditd_version
      changed_when: false
      failed_when: false

    - name: Get Chrony version
      ansible.builtin.shell:
        cmd: "dpkg-query -W -f='${Version}' chrony 2>/dev/null || echo 'NOT_INSTALLED'"
      register: chrony_version
      changed_when: false
      failed_when: false

    - name: Get Rsyslog version
      ansible.builtin.shell:
        cmd: "dpkg-query -W -f='${Version}' rsyslog 2>/dev/null || echo 'NOT_INSTALLED'"
      register: rsyslog_version
      changed_when: false
      failed_when: false

    # ========================================================================
    # SYSTEM HEALTH
    # ========================================================================

    - name: Detect failed systemd services
      ansible.builtin.shell:
        cmd: |
          systemctl --failed --no-legend --no-pager 2>/dev/null |
          awk '{print $2}' | sed '/^$/d' || true
      register: failed_services
      changed_when: false
      failed_when: false

    - name: Get memory usage
      ansible.builtin.shell:
        cmd: "free -m | awk '/Mem:/ {printf \"%.1f\", ($3/$2)*100}'"
      register: memory_usage
      changed_when: false

    - name: Get disk usage
      ansible.builtin.shell:
        cmd: "df -P / | awk 'NR==2 {gsub(\"%\",\"\",$5); print $5}'"
      register: disk_usage
      changed_when: false

    - name: Get load average
      ansible.builtin.shell:
        cmd: "awk '{print $1\" \"$2\" \"$3}' /proc/loadavg"
      register: load_average
      changed_when: false

    # ========================================================================
    # COMPLETE SOFTWARE INVENTORY
    # ========================================================================

    - name: Generate complete installed software inventory
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W -f='${Package}|${Version}|${Status}\n' 2>/dev/null |
          sort
      register: complete_software_inventory
      changed_when: false

    - name: Generate security software inventory
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W -f='${Package}|${Version}|${Status}\n' 2>/dev/null |
          grep -Ei 'wazuh|zabbix|seqrite|quickheal|manageengine|desktopcentral|uems|auditd|chrony|rsyslog|unattended' ||
          true
      register: security_software_inventory
      changed_when: false

    - name: Count installed packages
      ansible.builtin.set_fact:
        installed_package_count: "{{ complete_software_inventory.stdout_lines | length }}"

    # ========================================================================
    # HEALTH CALCULATION
    # ========================================================================

    - name: Calculate UEMS health
      ansible.builtin.set_fact:
        uems_health: >-
          {{
            'NOT_ENABLED'
            if not uems_enabled
            else
            (
              'HEALTHY'
              if
              (
                uems_installed
                and
                (
                  (uems_service_status_text | default('NOT_DETECTED')) == 'active'
                  or
                  (uems_process_after_install.stdout | default('') | trim != '')
                )
              )
              else
              (
                'INSTALLED_BUT_SERVICE_NOT_DETECTED'
                if uems_installed
                else
                'NOT_INSTALLED'
              )
            )
          }}

    - name: Calculate Wazuh health
      ansible.builtin.set_fact:
        wazuh_health: >-
          {{
            'NOT_ENABLED'
            if not wazuh_enabled
            else
            (
              'HEALTHY'
              if
              (
                (wazuh_service_status.stdout | default('')) == 'active'
                and
                (wazuh_final_version.stdout | default('NOT_INSTALLED')) != 'NOT_INSTALLED'
              )
              else
              (
                'INSTALLED_BUT_SERVICE_NOT_RUNNING'
                if wazuh_installed
                else
                'NOT_INSTALLED'
              )
            )
          }}

    - name: Calculate Zabbix health
      ansible.builtin.set_fact:
        zabbix_health: >-
          {{
            'NOT_ENABLED'
            if not zabbix_enabled
            else
            (
              'HEALTHY'
              if
              (
                (
                  zabbix_agent_installed
                  and
                  (zabbix_agent_service_status.stdout | default('')) == 'active'
                )
                or
                (
                  zabbix_agent2_installed
                  and
                  (zabbix_agent2_service_status.stdout | default('')) == 'active'
                )
                or
                (
                  (not zabbix_installed)
                  and
                  (zabbix_install_result is defined)
                  and
                  (zabbix_install_result.rc | default(1) == 0)
                  and
                  (zabbix_agent2_service_status.stdout | default('')) == 'active'
                )
              )
              else
              (
                'INSTALLED_BUT_SERVICE_NOT_RUNNING'
                if zabbix_installed
                else
                'NOT_INSTALLED'
              )
            )
          }}

    - name: Calculate system service health
      ansible.builtin.set_fact:
        system_services_health: >-
          {{
            'HEALTHY'
            if
            (
              (auditd_service_status.stdout | default('')) == 'active'
              and
              (chrony_service_status.stdout | default('')) == 'active'
              and
              (rsyslog_service_status.stdout | default('')) == 'active'
            )
            else
            'FAILED'
          }}

    - name: Calculate overall health
      ansible.builtin.set_fact:
        overall_health: >-
          {{
            'HEALTHY'
            if
            (
              uems_health in ['HEALTHY', 'NOT_ENABLED', 'INSTALLED_BUT_SERVICE_NOT_DETECTED']
              and
              wazuh_health in ['HEALTHY', 'NOT_ENABLED']
              and
              zabbix_health in ['HEALTHY', 'NOT_ENABLED']
              and
              system_services_health == 'HEALTHY'
              and
              (failed_services.stdout | default('') | trim == '')
            )
            else
            'ATTENTION_REQUIRED'
          }}

    # ========================================================================
    # FINAL REPORT
    # ========================================================================

    - name: Create report directory
      ansible.builtin.file:
        path: "/var/log/ubuntu-enterprise"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Generate final security report
      ansible.builtin.copy:
        dest: "/var/log/ubuntu-enterprise/security-stack-report.txt"
        owner: root
        group: root
        mode: "0644"
        content: |
          ========================================================================
                    UBUNTU ENTERPRISE SECURITY STACK REPORT
          ========================================================================

          SERVER
          ------------------------------------------------------------------------
          Hostname              : {{ ansible_hostname }}
          FQDN                  : {{ ansible_fqdn }}
          IP Address            : {{ ansible_default_ipv4.address | default('N/A') }}
          OS                    : {{ ansible_distribution }} {{ ansible_distribution_version }}
          Kernel                : {{ ansible_kernel }}
          Architecture          : {{ ansible_architecture }}
          CPU Cores             : {{ ansible_processor_vcpus | default('N/A') }}
          RAM                   : {{ ansible_memtotal_mb }} MB
          Root Free Space      : {{ root_disk_free.stdout }} GB
          Disk Usage            : {{ disk_usage.stdout }}%
          Memory Usage          : {{ memory_usage.stdout }}%
          Load Average          : {{ load_average.stdout }}

          ========================================================================
          UEMS / MANAGEENGINE
          ========================================================================
          Enabled               : {{ uems_enabled }}
          Installed             : {{ uems_installed }}
          Installation Path     : {{ uems_install_dir }}
          Version               : {{ uems_version }}
          Service               : {{ uems_service_name | default('NOT_DETECTED') }}
          Service Status        : {{ uems_service_status_text | default('NOT_DETECTED') }}
          Health                : {{ uems_health }}

          ========================================================================
          WAZUH AGENT
          ========================================================================
          Enabled               : {{ wazuh_enabled }}
          Installed             : {{ wazuh_installed }}
          Manager               : {{ wazuh_manager_ip }}
          Version               : {{ wazuh_final_version.stdout | default('UNKNOWN') }}
          Service Status        : {{ wazuh_service_status.stdout | default('NOT_DETECTED') }}
          Health                : {{ wazuh_health }}

          ========================================================================
          ZABBIX
          ========================================================================
          Enabled               : {{ zabbix_enabled }}

          Zabbix Agent Installed : {{ zabbix_agent_installed }}
          Zabbix Agent Version   : {{ zabbix_final_agent_version.stdout }}
          Zabbix Agent Service   : {{ zabbix_agent_service_status.stdout | default('NOT_DETECTED') }}

          Zabbix Agent2 Installed: {{ zabbix_agent2_installed }}
          Zabbix Agent2 Version  : {{ zabbix_final_agent2_version.stdout }}
          Zabbix Agent2 Service  : {{ zabbix_agent2_service_status.stdout | default('NOT_DETECTED') }}

          Zabbix Health          : {{ zabbix_health }}

          ========================================================================
          SYSTEM SECURITY SERVICES
          ========================================================================

          Auditd
          Version               : {{ auditd_version.stdout }}
          Service               : {{ auditd_service_status.stdout }}

          Chrony
          Version               : {{ chrony_version.stdout }}
          Service               : {{ chrony_service_status.stdout }}

          Rsyslog
          Version               : {{ rsyslog_version.stdout }}
          Service               : {{ rsyslog_service_status.stdout }}

          System Services Health : {{ system_services_health }}

          ========================================================================
          PATCH MANAGEMENT
          ========================================================================
          Patch Management      : {{ patch_management_enabled }}
          Automatic Updates     : {{ unattended_security_updates }}
          Pending Updates       : {{ pending_updates.stdout | default('N/A') }}
          Security Updates      : {{ pending_security_updates.stdout | default('N/A') }}
          Reboot Required       : {{ reboot_required.stat.exists }}

          ========================================================================
          FAILED SYSTEMD SERVICES
          ========================================================================
          {{ failed_services.stdout | default('NONE') | trim }}

          ========================================================================
          SECURITY SOFTWARE INVENTORY
          ========================================================================
          {{ security_software_inventory.stdout }}

          ========================================================================
          COMPLETE SOFTWARE INVENTORY
          ========================================================================
          Total Installed Packages: {{ installed_package_count }}

          {{ complete_software_inventory.stdout }}

          ========================================================================
          FINAL HEALTH
          ========================================================================
          UEMS                  : {{ uems_health }}
          Wazuh                 : {{ wazuh_health }}
          Zabbix                : {{ zabbix_health }}
          System Services       : {{ system_services_health }}
          Overall               : {{ overall_health }}

          Report:
          /var/log/ubuntu-enterprise/security-stack-report.txt

          ========================================================================

    - name: Display final health report
      ansible.builtin.debug:
        msg:
          - ""
          - "================================================================"
          - "       UBUNTU ENTERPRISE SECURITY HEALTH REPORT"
          - "================================================================"
          - "Hostname             : {{ ansible_hostname }}"
          - "IP Address           : {{ ansible_default_ipv4.address | default('N/A') }}"
          - ""
          - "UEMS"
          - "  Installed          : {{ uems_installed }}"
          - "  Version            : {{ uems_version }}"
          - "  Service            : {{ uems_service_name | default('NOT_DETECTED') }}"
          - "  Status             : {{ uems_service_status_text | default('NOT_DETECTED') }}"
          - "  Health             : {{ uems_health }}"
          - ""
          - "WAZUH"
          - "  Installed          : {{ wazuh_installed }}"
          - "  Version            : {{ wazuh_final_version.stdout | default('UNKNOWN') }}"
          - "  Service            : {{ wazuh_service_status.stdout | default('NOT_DETECTED') }}"
          - "  Health             : {{ wazuh_health }}"
          - ""
          - "ZABBIX"
          - "  Agent Installed    : {{ zabbix_agent_installed }}"
          - "  Agent Version      : {{ zabbix_final_agent_version.stdout }}"
          - "  Agent Service      : {{ zabbix_agent_service_status.stdout | default('NOT_DETECTED') }}"
          - "  Agent2 Installed   : {{ zabbix_agent2_installed }}"
          - "  Agent2 Version     : {{ zabbix_final_agent2_version.stdout }}"
          - "  Agent2 Service     : {{ zabbix_agent2_service_status.stdout | default('NOT_DETECTED') }}"
          - "  Health             : {{ zabbix_health }}"
          - ""
          - "SYSTEM SERVICES"
          - "  Auditd             : {{ auditd_service_status.stdout }}"
          - "  Chrony             : {{ chrony_service_status.stdout }}"
          - "  Rsyslog            : {{ rsyslog_service_status.stdout }}"
          - "  Health             : {{ system_services_health }}"
          - ""
          - "PATCH MANAGEMENT"
          - "  Pending Updates    : {{ pending_updates.stdout | default('N/A') }}"
          - "  Security Updates   : {{ pending_security_updates.stdout | default('N/A') }}"
          - "  Reboot Required    : {{ reboot_required.stat.exists }}"
          - ""
          - "OVERALL STATUS      : {{ overall_health }}"
          - ""
          - "Detailed report:"
          - "/var/log/ubuntu-enterprise/security-stack-report.txt"
          - "================================================================"

  handlers:

    - name: Restart Wazuh
      ansible.builtin.systemd:
        name: wazuh-agent
        state: restarted
        enabled: true

    - name: Restart Zabbix Agent
      ansible.builtin.systemd:
        name: zabbix-agent
        state: restarted
        enabled: true

    - name: Restart Zabbix
      ansible.builtin.systemd:
        name: zabbix-agent2
        state: restarted
        enabled: true
        
