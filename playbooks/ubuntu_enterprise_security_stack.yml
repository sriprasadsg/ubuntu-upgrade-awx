---
# =====================================================================
# Ubuntu Enterprise Security Stack
# =====================================================================
#
# Workflow:
#
# DETECT
#   |
#   +--> UEMS / ManageEngine Endpoint Central
#   +--> Wazuh Agent
#   +--> Zabbix Agent / Agent 2
#   +--> Auditd
#   +--> Chrony
#   +--> Rsyslog
#   |
# INSTALL ONLY IF MISSING
#   |
# CONFIGURE
#   |
# SERVICE VERIFICATION
#   |
# VERSION VERIFICATION
#   |
# PATCH STATUS
#   |
# COMPLETE SOFTWARE INVENTORY
#   |
# FINAL HEALTH REPORT
#
# Supported:
#   Ubuntu 22.04
#   Ubuntu 24.04
#
# =====================================================================

- name: Ubuntu Enterprise Security Stack
  hosts: all
  become: true
  gather_facts: true

  vars:

    # =================================================================
    # GENERAL
    # =================================================================

    minimum_disk_space_gb: 2

    # false = do not perform full package upgrade
    # true  = apt dist-upgrade
    perform_os_upgrade: false

    # Do not automatically reboot production servers
    auto_reboot: false


    # =================================================================
    # UEMS / MANAGEENGINE ENDPOINT CENTRAL
    # =================================================================

    uems_enabled: true

    uems_download_url: "http://192.168.10.10/Softwares/DefaultRemoteOffice_UEMSLinuxAgent.zip"

    uems_download_dir: "/opt/uems-installer"

    uems_archive_name: "DefaultRemoteOffice_UEMSLinuxAgent.zip"

    uems_install_dir: "/usr/local/desktopcentralagent"

    uems_installer_name: "UEMS_LinuxAgent.bin"

    uems_serverinfo_name: "serverinfo.json"


    # =================================================================
    # WAZUH
    # =================================================================

    wazuh_enabled: true

    wazuh_manager_ip: "192.168.10.100"

    wazuh_manager_port: 1514

    wazuh_registration_port: 1515

    wazuh_agent_group: "ubuntu-servers"


    # =================================================================
    # ZABBIX
    # =================================================================

    zabbix_enabled: true

    zabbix_server_ip: "192.168.10.101"

    zabbix_server_port: 10051

    zabbix_version: "7.0"


    # =================================================================
    # PATCH MANAGEMENT
    # =================================================================

    patch_management_enabled: true

    unattended_security_updates: true


    # =================================================================
    # REQUIRED SYSTEM PACKAGES
    # =================================================================

    enterprise_packages:

      - apt-transport-https
      - ca-certificates
      - curl
      - wget
      - gnupg
      - software-properties-common
      - unzip
      - zip
      - jq
      - vim
      - nano
      - net-tools
      - lsof
      - rsync
      - git
      - sudo
      - openssh-client
      - python3
      - python3-apt
      - bash-completion
      - logrotate


  tasks:

    # =================================================================
    # 1. SERVER INFORMATION
    # =================================================================

    - name: Display server information
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " UBUNTU ENTERPRISE SECURITY STACK"
          - "============================================================"
          - "Hostname       : {{ ansible_hostname }}"
          - "FQDN           : {{ ansible_fqdn }}"
          - "OS             : {{ ansible_distribution }}"
          - "OS Version     : {{ ansible_distribution_version }}"
          - "Kernel         : {{ ansible_kernel }}"
          - "Architecture   : {{ ansible_architecture }}"
          - "Primary IP     : {{ ansible_default_ipv4.address | default('N/A') }}"
          - "CPU Cores      : {{ ansible_processor_vcpus | default('N/A') }}"
          - "RAM            : {{ ansible_memtotal_mb }} MB"
          - "============================================================"


    # =================================================================
    # 2. OS VALIDATION
    # =================================================================

    - name: Validate operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_major_version in ["22", "24"]
        fail_msg: >
          Unsupported operating system.
          Supported versions are Ubuntu 22.04 and Ubuntu 24.04.


    # =================================================================
    # 3. DISK SPACE
    # =================================================================

    - name: Check root filesystem free space
      ansible.builtin.shell:
        cmd: |
          df -BG / --output=avail |
          tail -1 |
          tr -dc '0-9'
      register: root_disk_free
      changed_when: false


    - name: Validate root disk space
      ansible.builtin.assert:
        that:
          - root_disk_free.stdout | int >= minimum_disk_space_gb
        fail_msg: >
          Insufficient disk space.
          Required: {{ minimum_disk_space_gb }} GB.
          Available: {{ root_disk_free.stdout }} GB.


    # =================================================================
    # 4. APT CACHE
    # =================================================================

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600


    # =================================================================
    # 5. BASE PACKAGE DETECTION
    # =================================================================

    - name: Detect base enterprise packages
      ansible.builtin.package_facts:
        manager: auto


    # =================================================================
    # 6. UEMS DETECTION
    # =================================================================

    - name: Check UEMS installation path
      ansible.builtin.stat:
        path: "{{ uems_install_dir }}"
      register: uems_install_dir_check
      when: uems_enabled


    - name: Determine whether UEMS directory exists
      ansible.builtin.set_fact:
        uems_path_exists: >-
          {{
            uems_install_dir_check.stat.exists
            | default(false)
          }}

        uems_path_is_directory: >-
          {{
            uems_install_dir_check.stat.exists
            and
            uems_install_dir_check.stat.isdir | default(false)
          }}
      when: uems_enabled


    - name: Check UEMS agent files
      ansible.builtin.find:
        paths:
          - "{{ uems_install_dir }}"
        patterns:
          - "dcaagent"
          - "dcagent"
          - "dctroubleshootingtool"
        recurse: true
        file_type: file
      register: uems_agent_files
      changed_when: false
      failed_when: false
      when:
        - uems_enabled
        - uems_path_is_directory | default(false)


    - name: Detect UEMS processes
      ansible.builtin.shell:
        cmd: |
          pgrep -af \
          'desktopcentral|uems|dcagent|dcaagent' || true
      register: uems_process_detection
      changed_when: false
      failed_when: false
      when: uems_enabled


    - name: Detect UEMS services
      ansible.builtin.shell:
        cmd: |
          systemctl list-unit-files \
          --type=service \
          --no-legend 2>/dev/null |
          grep -Ei \
          'desktopcentral|uems|dcagent|dcaagent' |
          awk '{print $1}' |
          head -10 || true
      register: uems_service_detection
      changed_when: false
      failed_when: false
      when: uems_enabled


    - name: Determine UEMS installation status
      ansible.builtin.set_fact:

        uems_agent_file_count: >-
          {{
            uems_agent_files.matched
            | default(0)
            | int
          }}

        uems_installed: >-
          {{
            (
              uems_path_is_directory | default(false)
              and
              (uems_agent_files.matched | default(0) | int > 0)
            )
            or
            (
              uems_process_detection.stdout
              | default('')
              | trim
              != ''
            )
            or
            (
              uems_service_detection.stdout
              | default('')
              | trim
              != ''
            )
          }}
      when: uems_enabled


    - name: Set UEMS disabled state
      ansible.builtin.set_fact:
        uems_installed: false
        uems_agent_file_count: 0
      when: not uems_enabled


    - name: Display UEMS detection
      ansible.builtin.debug:
        msg:
          - "UEMS enabled          : {{ uems_enabled }}"
          - "UEMS installed        : {{ uems_installed }}"
          - "Installation path     : {{ uems_install_dir }}"
          - "Path is directory     : {{ uems_path_is_directory | default(false) }}"
          - "Agent files detected  : {{ uems_agent_file_count }}"
          - "Services detected     : {{ uems_service_detection.stdout | default('NONE') | trim }}"


    # =================================================================
    # 7. WAZUH DETECTION
    # =================================================================

    - name: Detect Wazuh Agent package
      ansible.builtin.set_fact:
        wazuh_installed: >-
          {{
            'wazuh-agent' in ansible_facts.packages
          }}
      when: wazuh_enabled


    - name: Set Wazuh disabled state
      ansible.builtin.set_fact:
        wazuh_installed: false
      when: not wazuh_enabled


    - name: Get installed Wazuh version
      ansible.builtin.set_fact:
        wazuh_installed_version: >-
          {{
            ansible_facts.packages['wazuh-agent'][0].version
            if 'wazuh-agent' in ansible_facts.packages
            else 'NOT_INSTALLED'
          }}


    - name: Display Wazuh detection
      ansible.builtin.debug:
        msg:
          - "Wazuh enabled     : {{ wazuh_enabled }}"
          - "Wazuh installed   : {{ wazuh_installed }}"
          - "Wazuh version     : {{ wazuh_installed_version }}"


    # =================================================================
    # 8. ZABBIX DETECTION
    # =================================================================

    - name: Detect Zabbix Agent
      ansible.builtin.set_fact:
        zabbix_agent_installed: >-
          {{
            'zabbix-agent' in ansible_facts.packages
          }}


    - name: Detect Zabbix Agent 2
      ansible.builtin.set_fact:
        zabbix_agent2_installed: >-
          {{
            'zabbix-agent2' in ansible_facts.packages
          }}


    - name: Determine whether any Zabbix agent exists
      ansible.builtin.set_fact:
        zabbix_installed: >-
          {{
            zabbix_agent_installed
            or
            zabbix_agent2_installed
          }}


    - name: Get Zabbix Agent version
      ansible.builtin.set_fact:
        zabbix_agent_version: >-
          {{
            ansible_facts.packages['zabbix-agent'][0].version
            if 'zabbix-agent' in ansible_facts.packages
            else 'NOT_INSTALLED'
          }}


    - name: Get Zabbix Agent 2 version
      ansible.builtin.set_fact:
        zabbix_agent2_version: >-
          {{
            ansible_facts.packages['zabbix-agent2'][0].version
            if 'zabbix-agent2' in ansible_facts.packages
            else 'NOT_INSTALLED'
          }}


    - name: Display Zabbix detection
      ansible.builtin.debug:
        msg:
          - "Zabbix Agent installed : {{ zabbix_agent_installed }}"
          - "Zabbix Agent version   : {{ zabbix_agent_version }}"
          - "Zabbix Agent 2 installed: {{ zabbix_agent2_installed }}"
          - "Zabbix Agent 2 version  : {{ zabbix_agent2_version }}"


    # =================================================================
    # 9. DETECT SYSTEM SERVICES
    # =================================================================

    - name: Detect Auditd
      ansible.builtin.set_fact:
        auditd_installed: "{{ 'auditd' in ansible_facts.packages }}"


    - name: Detect Chrony
      ansible.builtin.set_fact:
        chrony_installed: "{{ 'chrony' in ansible_facts.packages }}"


    - name: Detect Rsyslog
      ansible.builtin.set_fact:
        rsyslog_installed: "{{ 'rsyslog' in ansible_facts.packages }}"


    # =================================================================
    # 10. INSTALL BASE PACKAGES ONLY IF MISSING
    # =================================================================

    - name: Install base enterprise packages
      ansible.builtin.apt:
        name: "{{ enterprise_packages }}"
        state: present


    # =================================================================
    # 11. INSTALL AUDITD IF MISSING
    # =================================================================

    - name: Install Auditd
      ansible.builtin.apt:
        name:
          - auditd
          - audispd-plugins
        state: present
      when: not auditd_installed


    - name: Enable Auditd
      ansible.builtin.systemd:
        name: auditd
        enabled: true
        state: started


    # =================================================================
    # 12. INSTALL CHRONY IF MISSING
    # =================================================================

    - name: Install Chrony
      ansible.builtin.apt:
        name: chrony
        state: present
      when: not chrony_installed


    - name: Enable Chrony
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started


    # =================================================================
    # 13. INSTALL RSYSLOG IF MISSING
    # =================================================================

    - name: Install Rsyslog
      ansible.builtin.apt:
        name: rsyslog
        state: present
      when: not rsyslog_installed


    - name: Enable Rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        enabled: true
        state: started


    # =================================================================
    # 14. UEMS DOWNLOAD DIRECTORY
    # =================================================================

    - name: Create UEMS installer directory
      ansible.builtin.file:
        path: "{{ uems_download_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - uems_enabled
        - not uems_installed


    # =================================================================
    # 15. UEMS DOWNLOAD
    # =================================================================

    - name: Download UEMS package
      ansible.builtin.get_url:
        url: "{{ uems_download_url }}"
        dest: "{{ uems_download_dir }}/{{ uems_archive_name }}"
        owner: root
        group: root
        mode: "0644"
        force: false
      when:
        - uems_enabled
        - not uems_installed


    # =================================================================
    # 16. UEMS EXTRACT
    # =================================================================

    - name: Extract UEMS package
      ansible.builtin.unarchive:
        src: "{{ uems_download_dir }}/{{ uems_archive_name }}"
        dest: "{{ uems_download_dir }}"
        remote_src: true
      when:
        - uems_enabled
        - not uems_installed


    # =================================================================
    # 17. VERIFY UEMS INSTALLER
    # =================================================================

    - name: Check UEMS binary
      ansible.builtin.stat:
        path: "{{ uems_download_dir }}/{{ uems_installer_name }}"
      register: uems_bin_check
      when:
        - uems_enabled
        - not uems_installed


    - name: Check UEMS serverinfo.json
      ansible.builtin.stat:
        path: "{{ uems_download_dir }}/{{ uems_serverinfo_name }}"
      register: uems_serverinfo_check
      when:
        - uems_enabled
        - not uems_installed


    - name: Validate UEMS files
      ansible.builtin.assert:
        that:
          - uems_bin_check.stat.exists
          - uems_serverinfo_check.stat.exists
        fail_msg: |
          UEMS installation files are incomplete.

          Expected:

          {{ uems_download_dir }}/{{ uems_installer_name }}
          {{ uems_download_dir }}/{{ uems_serverinfo_name }}

          Both files are required.
      when:
        - uems_enabled
        - not uems_installed


    # =================================================================
    # 18. INSTALL UEMS
    # =================================================================

    - name: Make UEMS installer executable
      ansible.builtin.file:
        path: "{{ uems_download_dir }}/{{ uems_installer_name }}"
        owner: root
        group: root
        mode: "0755"
      when:
        - uems_enabled
        - not uems_installed


    - name: Install UEMS Linux Agent
      ansible.builtin.command:
        cmd: "./{{ uems_installer_name }}"
        chdir: "{{ uems_download_dir }}"
      register: uems_install_result
      changed_when: true
      failed_when: false
      when:
        - uems_enabled
        - not uems_installed


    # =================================================================
    # 19. RE-DETECT UEMS AFTER INSTALL
    # =================================================================

    - name: Re-check UEMS installation directory
      ansible.builtin.stat:
        path: "{{ uems_install_dir }}"
      register: uems_post_install_path


    - name: Check UEMS files after installation
      ansible.builtin.find:
        paths:
          - "{{ uems_install_dir }}"
        patterns:
          - "dcaagent"
          - "dcagent"
          - "dctroubleshootingtool"
        recurse: true
        file_type: file
      register: uems_post_install_files
      failed_when: false
      when:
        - uems_post_install_path.stat.exists
        - uems_post_install_path.stat.isdir | default(false)


    # =================================================================
    # 20. UEMS SERVICE DETECTION
    # =================================================================

    - name: Detect UEMS service after installation
      ansible.builtin.shell:
        cmd: |
          systemctl list-unit-files \
          --type=service \
          --no-legend 2>/dev/null |
          grep -Ei \
          'desktopcentral|uems|dcagent|dcaagent' |
          awk '{print $1}' |
          head -1 || true
      register: uems_service_after_install
      changed_when: false
      failed_when: false
      when: uems_enabled


    - name: Set UEMS service name
      ansible.builtin.set_fact:
        uems_service_name: "{{ uems_service_after_install.stdout | trim }}"
      when:
        - uems_enabled
        - uems_service_after_install.stdout | default('') | trim != ""


    # =================================================================
    # 21. START UEMS SERVICE
    # =================================================================

    - name: Enable and start UEMS service
      ansible.builtin.systemd:
        name: "{{ uems_service_name }}"
        enabled: true
        state: started
      register: uems_service_start
      failed_when: false
      when:
        - uems_enabled
        - uems_service_name is defined
        - uems_service_name | length > 0


    # =================================================================
    # 22. UEMS PROCESS VERIFICATION
    # =================================================================

    - name: Check UEMS processes
      ansible.builtin.shell:
        cmd: |
          pgrep -af \
          'desktopcentral|uems|dcagent|dcaagent' || true
      register: uems_process_after_install
      changed_when: false
      failed_when: false
      when: uems_enabled


    # =================================================================
    # 23. UEMS VERSION VERIFICATION
    # =================================================================

    - name: Initialize UEMS version
      ansible.builtin.set_fact:
        uems_version: "UNKNOWN"


    - name: Check UEMS troubleshooting tool
      ansible.builtin.stat:
        path: "{{ uems_install_dir }}/bin/dctroubleshootingtool"
      register: uems_troubleshooting_tool
      when:
        - uems_enabled
        - uems_post_install_path.stat.exists
        - uems_post_install_path.stat.isdir | default(false)


    - name: Run UEMS troubleshooting tool
      ansible.builtin.command:
        cmd: "{{ uems_install_dir }}/bin/dctroubleshootingtool"
      register: uems_troubleshooting
      changed_when: false
      failed_when: false
      when:
        - uems_enabled
        - uems_troubleshooting_tool.stat.exists | default(false)


    - name: Extract UEMS version safely
      ansible.builtin.set_fact:
        uems_version: >-
          {{
            (
              uems_troubleshooting.stdout
              | default('')
              | regex_findall('AGENT VERSION\\s+([^\\s]+)')
              | first
            )
            | default('UNKNOWN', true)
          }}
      when:
        - uems_enabled
        - uems_troubleshooting is defined


    # =================================================================
    # 24. WAZUH REPOSITORY
    # =================================================================

    - name: Install Wazuh GPG key
      ansible.builtin.get_url:
        url: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"
        dest: "/usr/share/keyrings/wazuh.gpg"
        owner: root
        group: root
        mode: "0644"
      when:
        - wazuh_enabled
        - not wazuh_installed


    - name: Configure Wazuh repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
        filename: wazuh
        state: present
      when:
        - wazuh_enabled
        - not wazuh_installed


    - name: Update APT cache for Wazuh
      ansible.builtin.apt:
        update_cache: true
      when:
        - wazuh_enabled
        - not wazuh_installed


    # =================================================================
    # 25. INSTALL WAZUH IF MISSING
    # =================================================================

    - name: Install Wazuh Agent
      ansible.builtin.apt:
        name: wazuh-agent
        state: present
      environment:
        WAZUH_MANAGER: "{{ wazuh_manager_ip }}"
        WAZUH_MANAGER_PORT: "{{ wazuh_manager_port }}"
        WAZUH_REGISTRATION_SERVER: "{{ wazuh_manager_ip }}"
        WAZUH_REGISTRATION_PORT: "{{ wazuh_registration_port }}"
        WAZUH_AGENT_GROUP: "{{ wazuh_agent_group }}"
      when:
        - wazuh_enabled
        - not wazuh_installed


    # =================================================================
    # 26. CONFIGURE WAZUH
    # =================================================================

    - name: Configure Wazuh manager
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: '<address>.*?</address>'
        replace: "<address>{{ wazuh_manager_ip }}</address>"
      when:
        - wazuh_enabled
        - wazuh_installed
      notify: Restart Wazuh


    - name: Enable Wazuh
      ansible.builtin.systemd:
        name: wazuh-agent
        enabled: true
        state: started
      register: wazuh_service_start
      failed_when: false
      when: wazuh_enabled


    # =================================================================
    # 27. WAZUH VERSION
    # =================================================================

    - name: Get final Wazuh version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
          -f='${Version}' \
          wazuh-agent 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: wazuh_final_version
      changed_when: false
      failed_when: false


    # =================================================================
    # 28. ZABBIX INSTALLATION
    # =================================================================

    - name: Install Zabbix repository package
      ansible.builtin.get_url:
        url: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/release/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+ubuntu{{ ansible_distribution_version | replace('.', '') }}_all.deb"
        dest: "/tmp/zabbix-release.deb"
        mode: "0644"
      when:
        - zabbix_enabled
        - not zabbix_installed


    - name: Install Zabbix repository
      ansible.builtin.apt:
        deb: "/tmp/zabbix-release.deb"
      when:
        - zabbix_enabled
        - not zabbix_installed


    - name: Update APT cache for Zabbix
      ansible.builtin.apt:
        update_cache: true
      when:
        - zabbix_enabled
        - not zabbix_installed


    - name: Install Zabbix Agent 2
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present
      when:
        - zabbix_enabled
        - not zabbix_installed


    # =================================================================
    # 29. ZABBIX CONFIGURATION
    # =================================================================

    - name: Configure Zabbix Server
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*Server='
        line: "Server={{ zabbix_server_ip }}"
      when:
        - zabbix_enabled
        - zabbix_agent2_installed | default(false)
        or not zabbix_installed
      notify: Restart Zabbix


    - name: Configure Zabbix Active Server
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}:{{ zabbix_server_port }}"
      when:
        - zabbix_enabled
        - zabbix_agent2_installed | default(false)
        or not zabbix_installed
      notify: Restart Zabbix


    - name: Configure Zabbix Hostname
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^#?\s*Hostname='
        line: "Hostname={{ ansible_hostname }}"
      when:
        - zabbix_enabled
        - zabbix_agent2_installed | default(false)
        or not zabbix_installed
      notify: Restart Zabbix


    # =================================================================
    # 30. START EXISTING ZABBIX AGENT
    # =================================================================

    - name: Enable existing Zabbix Agent
      ansible.builtin.systemd:
        name: zabbix-agent
        enabled: true
        state: started
      register: zabbix_agent_service
      failed_when: false
      when:
        - zabbix_enabled
        - zabbix_agent_installed


    # =================================================================
    # 31. START ZABBIX AGENT 2
    # =================================================================

    - name: Enable Zabbix Agent 2
      ansible.builtin.systemd:
        name: zabbix-agent2
        enabled: true
        state: started
      register: zabbix_agent2_service
      failed_when: false
      when:
        - zabbix_enabled
        - zabbix_agent2_installed or not zabbix_installed


    # =================================================================
    # 32. FINAL ZABBIX VERSION
    # =================================================================

    - name: Get final Zabbix Agent version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
          -f='${Version}' \
          zabbix-agent 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: zabbix_final_agent_version
      changed_when: false
      failed_when: false


    - name: Get final Zabbix Agent 2 version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
          -f='${Version}' \
          zabbix-agent2 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: zabbix_final_agent2_version
      changed_when: false
      failed_when: false


    # =================================================================
    # 33. PATCH MANAGEMENT
    # =================================================================

    - name: Configure automatic updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
      when:
        - patch_management_enabled
        - unattended_security_updates


    - name: Configure unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          Unattended-Upgrade::Origins-Pattern {
              "origin=Ubuntu,archive=${distro_codename}-security";
          };

          Unattended-Upgrade::Remove-Unused-Dependencies "true";

          Unattended-Upgrade::Automatic-Reboot "false";
      when:
        - patch_management_enabled
        - unattended_security_updates


    # =================================================================
    # 34. PATCH STATUS
    # =================================================================

    - name: Refresh package lists
      ansible.builtin.apt:
        update_cache: true
      when: patch_management_enabled


    - name: Count pending updates
      ansible.builtin.shell:
        cmd: |
          apt list --upgradable 2>/dev/null |
          tail -n +2 |
          wc -l
      register: pending_updates
      changed_when: false
      failed_when: false
      when: patch_management_enabled


    - name: Count pending security updates
      ansible.builtin.shell:
        cmd: |
          apt list --upgradable 2>/dev/null |
          grep -Ei 'security|esm' |
          wc -l
      register: pending_security_updates
      changed_when: false
      failed_when: false
      when: patch_management_enabled


    # =================================================================
    # 35. OPTIONAL FULL PACKAGE UPGRADE
    # =================================================================

    - name: Perform full package upgrade
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      when:
        - patch_management_enabled
        - perform_os_upgrade


    # =================================================================
    # 36. REBOOT REQUIRED
    # =================================================================

    - name: Check reboot requirement
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required


    - name: Reboot server if configured
      ansible.builtin.reboot:
        msg: "Ubuntu Enterprise Security Stack requested reboot."
        reboot_timeout: 900
        connect_timeout: 30
        test_command: "uptime"
      when:
        - reboot_required.stat.exists
        - auto_reboot


    # =================================================================
    # 37. SERVICE STATUS
    # =================================================================

    - name: Check Auditd service
      ansible.builtin.command:
        cmd: systemctl is-active auditd
      register: auditd_service_status
      changed_when: false
      failed_when: false


    - name: Check Chrony service
      ansible.builtin.command:
        cmd: systemctl is-active chrony
      register: chrony_service_status
      changed_when: false
      failed_when: false


    - name: Check Rsyslog service
      ansible.builtin.command:
        cmd: systemctl is-active rsyslog
      register: rsyslog_service_status
      changed_when: false
      failed_when: false


    - name: Check Wazuh service
      ansible.builtin.command:
        cmd: systemctl is-active wazuh-agent
      register: wazuh_service_status
      changed_when: false
      failed_when: false
      when: wazuh_enabled


    - name: Check Zabbix Agent service
      ansible.builtin.command:
        cmd: systemctl is-active zabbix-agent
      register: zabbix_agent_service_status
      changed_when: false
      failed_when: false
      when:
        - zabbix_enabled
        - zabbix_agent_installed


    - name: Check Zabbix Agent 2 service
      ansible.builtin.command:
        cmd: systemctl is-active zabbix-agent2
      register: zabbix_agent2_service_status
      changed_when: false
      failed_when: false
      when:
        - zabbix_enabled
        - zabbix_agent2_installed or not zabbix_installed


    # =================================================================
    # 38. VERSION VERIFICATION
    # =================================================================

    - name: Get Auditd version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
          -f='${Version}' auditd 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: auditd_version
      changed_when: false
      failed_when: false


    - name: Get Chrony version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
          -f='${Version}' chrony 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: chrony_version
      changed_when: false
      failed_when: false


    - name: Get Rsyslog version
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
          -f='${Version}' rsyslog 2>/dev/null ||
          echo "NOT_INSTALLED"
      register: rsyslog_version
      changed_when: false
      failed_when: false


    # =================================================================
    # 39. FAILED SYSTEMD SERVICES
    # =================================================================

    - name: Detect failed services
      ansible.builtin.shell:
        cmd: |
          systemctl --failed \
          --no-legend \
          --no-pager 2>/dev/null |
          awk '{print $2}' |
          sed '/^$/d' || true
      register: failed_services
      changed_when: false
      failed_when: false


    # =================================================================
    # 40. SYSTEM HEALTH
    # =================================================================

    - name: Get memory usage
      ansible.builtin.shell:
        cmd: |
          free -m |
          awk '/Mem:/ {
            printf "%.1f", ($3/$2)*100
          }'
      register: memory_usage
      changed_when: false


    - name: Get disk usage
      ansible.builtin.shell:
        cmd: |
          df -P / |
          awk 'NR==2 {
            gsub("%","",$5);
            print $5
          }'
      register: disk_usage
      changed_when: false


    - name: Get load average
      ansible.builtin.shell:
        cmd: |
          awk '{print $1" "$2" "$3}' /proc/loadavg
      register: load_average
      changed_when: false


    # =================================================================
    # 41. COMPLETE SOFTWARE INVENTORY
    # =================================================================

    - name: Generate complete installed software inventory
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
          -f='${Package}|${Version}|${Status}\n' \
          2>/dev/null |
          sort
      register: complete_software_inventory
      changed_when: false


    - name: Generate security software inventory
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
          -f='${Package}|${Version}|${Status}\n' \
          2>/dev/null |
          grep -Ei \
          'wazuh|zabbix|seqrite|quickheal|manageengine|desktopcentral|uems|auditd|chrony|rsyslog|unattended' \
          || true
      register: security_software_inventory
      changed_when: false


    - name: Count installed packages
      ansible.builtin.set_fact:
        installed_package_count: >-
          {{
            complete_software_inventory.stdout_lines
            | length
          }}


    # =================================================================
    # 42. HEALTH CALCULATION - UEMS
    # =================================================================

    - name: Calculate UEMS health
      ansible.builtin.set_fact:
        uems_health: >-
          {{
            'NOT_ENABLED'
            if not uems_enabled
            else
            (
              'HEALTHY'
              if
              (
                (
                  uems_service_status.rc == 0
                  if uems_service_name is defined
                  else
                  (
                    uems_process_after_install.stdout
                    | default('')
                    | trim
                    != ''
                  )
                )
                and
                (
                  uems_version != 'UNKNOWN'
                  or
                  uems_path_exists | default(false)
                )
              )
              else
              (
                'INSTALLED_BUT_SERVICE_NOT_DETECTED'
                if uems_installed
                else
                'NOT_INSTALLED'
              )
            )
          }}


    # =================================================================
    # 43. HEALTH CALCULATION - WAZUH
    # =================================================================

    - name: Calculate Wazuh health
      ansible.builtin.set_fact:
        wazuh_health: >-
          {{
            'NOT_ENABLED'
            if not wazuh_enabled
            else
            (
              'HEALTHY'
              if
              (
                wazuh_service_status.rc == 0
                and
                wazuh_final_version.stdout
                | default('NOT_INSTALLED')
                != 'NOT_INSTALLED'
              )
              else
              (
                'INSTALLED_BUT_SERVICE_NOT_RUNNING'
                if wazuh_installed
                else
                'NOT_INSTALLED'
              )
            )
          }}


    # =================================================================
    # 44. HEALTH CALCULATION - ZABBIX
    # =================================================================

    - name: Calculate Zabbix health
      ansible.builtin.set_fact:
        zabbix_health: >-
          {{
            'NOT_ENABLED'
            if not zabbix_enabled
            else
            (
              'HEALTHY'
              if
              (
                (
                  zabbix_agent_installed
                  and
                  zabbix_agent_service_status.rc == 0
                )
                or
                (
                  zabbix_agent2_installed
                  and
                  zabbix_agent2_service_status.rc == 0
                )
              )
              else
              (
                'INSTALLED_BUT_SERVICE_NOT_RUNNING'
                if zabbix_installed
                else
                'NOT_INSTALLED'
              )
            )
          }}


    # =================================================================
    # 45. SYSTEM SERVICE HEALTH
    # =================================================================

    - name: Calculate system service health
      ansible.builtin.set_fact:
        system_services_health: >-
          {{
            'HEALTHY'
            if
            (
              auditd_service_status.rc == 0
              and
              chrony_service_status.rc == 0
              and
              rsyslog_service_status.rc == 0
            )
            else
            'FAILED'
          }}


    # =================================================================
    # 46. OVERALL HEALTH
    # =================================================================

    - name: Calculate overall health
      ansible.builtin.set_fact:
        overall_health: >-
          {{
            'HEALTHY'
            if
            (
              uems_health in ['HEALTHY', 'NOT_ENABLED']
              and
              wazuh_health in ['HEALTHY', 'NOT_ENABLED']
              and
              zabbix_health in ['HEALTHY', 'NOT_ENABLED']
              and
              system_services_health == 'HEALTHY'
              and
              (
                failed_services.stdout
                | default('')
                | trim
                == ''
              )
            )
            else
            'ATTENTION_REQUIRED'
          }}


    # =================================================================
    # 47. REPORT DIRECTORY
    # =================================================================

    - name: Create security report directory
      ansible.builtin.file:
        path: "/var/log/ubuntu-enterprise"
        state: directory
        owner: root
        group: root
        mode: "0755"


    # =================================================================
    # 48. FINAL REPORT
    # =================================================================

    - name: Generate final security report
      ansible.builtin.copy:
        dest: "/var/log/ubuntu-enterprise/security-stack-report.txt"
        owner: root
        group: root
        mode: "0644"
        content: |
          ================================================================
                    UBUNTU ENTERPRISE SECURITY REPORT
          ================================================================

          SERVER
          ----------------------------------------------------------------
          Hostname              : {{ ansible_hostname }}
          FQDN                  : {{ ansible_fqdn }}
          IP Address            : {{ ansible_default_ipv4.address | default('N/A') }}
          OS                    : {{ ansible_distribution }} {{ ansible_distribution_version }}
          Kernel                : {{ ansible_kernel }}
          Architecture          : {{ ansible_architecture }}
          CPU Cores             : {{ ansible_processor_vcpus | default('N/A') }}
          RAM                   : {{ ansible_memtotal_mb }} MB
          Root Free Space      : {{ root_disk_free.stdout }} GB
          Disk Usage            : {{ disk_usage.stdout }}%
          Memory Usage          : {{ memory_usage.stdout }}%
          Load Average          : {{ load_average.stdout }}

          ================================================================
          UEMS / MANAGEENGINE ENDPOINT CENTRAL
          ================================================================

          Enabled               : {{ uems_enabled }}
          Installed             : {{ uems_installed }}
          Installation Path     : {{ uems_install_dir }}
          Version               : {{ uems_version }}
          Service               : {{ uems_service_name | default('NOT_DETECTED') }}
          Service Status        : {{ uems_service_status.stdout | default('NOT_DETECTED') }}
          Process               : {{ uems_process_after_install.stdout | default('NOT_DETECTED') | trim }}
          Health                : {{ uems_health }}

          ================================================================
          WAZUH AGENT
          ================================================================

          Enabled               : {{ wazuh_enabled }}
          Installed             : {{ wazuh_installed }}
          Manager               : {{ wazuh_manager_ip }}
          Version               : {{ wazuh_final_version.stdout | default('UNKNOWN') }}
          Service Status        : {{ wazuh_service_status.stdout | default('NOT_DETECTED') }}
          Health                : {{ wazuh_health }}

          ================================================================
          ZABBIX
          ================================================================

          Enabled               : {{ zabbix_enabled }}

          Zabbix Agent Installed:
                                  {{ zabbix_agent_installed }}

          Zabbix Agent Version   :
                                  {{ zabbix_final_agent_version.stdout }}

          Zabbix Agent Service   :
                                  {{ zabbix_agent_service_status.stdout | default('NOT_DETECTED') }}

          Zabbix Agent 2 Installed:
                                  {{ zabbix_agent2_installed }}

          Zabbix Agent 2 Version :
                                  {{ zabbix_final_agent2_version.stdout }}

          Zabbix Agent 2 Service  :
                                  {{ zabbix_agent2_service_status.stdout | default('NOT_DETECTED') }}

          Zabbix Health           :
                                  {{ zabbix_health }}

          ================================================================
          SYSTEM SECURITY SERVICES
          ================================================================

          Auditd
          ----------------------------------------------------------------
          Version               : {{ auditd_version.stdout }}
          Service               : {{ auditd_service_status.stdout }}

          Chrony
          ----------------------------------------------------------------
          Version               : {{ chrony_version.stdout }}
          Service               : {{ chrony_service_status.stdout }}

          Rsyslog
          ----------------------------------------------------------------
          Version               : {{ rsyslog_version.stdout }}
          Service               : {{ rsyslog_service_status.stdout }}

          System Services Health : {{ system_services_health }}

          ================================================================
          PATCH MANAGEMENT
          ================================================================

          Patch Management      : {{ patch_management_enabled }}
          Automatic Updates     : {{ unattended_security_updates }}
          Pending Updates       : {{ pending_updates.stdout | default('N/A') }}
          Security Updates      : {{ pending_security_updates.stdout | default('N/A') }}
          Reboot Required       : {{ reboot_required.stat.exists }}

          ================================================================
          FAILED SYSTEMD SERVICES
          ================================================================

          {{ failed_services.stdout | default('NONE') | trim }}

          ================================================================
          SECURITY SOFTWARE INVENTORY
          ================================================================

          {{ security_software_inventory.stdout }}

          ================================================================
          COMPLETE SOFTWARE INVENTORY
          ================================================================

          Total Installed Packages:
          {{ installed_package_count }}

          {{ complete_software_inventory.stdout }}

          ================================================================
          FINAL HEALTH
          ================================================================

          UEMS                  : {{ uems_health }}
          Wazuh                 : {{ wazuh_health }}
          Zabbix                : {{ zabbix_health }}
          System Services       : {{ system_services_health }}
          Overall               : {{ overall_health }}

          ================================================================
          REPORT GENERATED BY ANSIBLE
          ================================================================


    # =================================================================
    # 49. FINAL CONSOLE REPORT
    # =================================================================

    - name: Display final health report
      ansible.builtin.debug:
        msg:
          - ""
          - "================================================================"
          - "       UBUNTU ENTERPRISE SECURITY HEALTH REPORT"
          - "================================================================"
          - ""
          - "SERVER"
          - "----------------------------------------------------------------"
          - "Hostname             : {{ ansible_hostname }}"
          - "IP Address           : {{ ansible_default_ipv4.address | default('N/A') }}"
          - "OS                   : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel               : {{ ansible_kernel }}"
          - "RAM                  : {{ ansible_memtotal_mb }} MB"
          - "Disk Usage           : {{ disk_usage.stdout }}%"
          - "Memory Usage         : {{ memory_usage.stdout }}%"
          - "Load Average         : {{ load_average.stdout }}"
          - ""
          - "UEMS"
          - "----------------------------------------------------------------"
          - "Installed            : {{ uems_installed }}"
          - "Version              : {{ uems_version }}"
          - "Service              : {{ uems_service_name | default('NOT_DETECTED') }}"
          - "Service Status       : {{ uems_service_status.stdout | default('NOT_DETECTED') }}"
          - "Health               : {{ uems_health }}"
          - ""
          - "WAZUH"
          - "----------------------------------------------------------------"
          - "Installed            : {{ wazuh_installed }}"
          - "Version              : {{ wazuh_final_version.stdout | default('UNKNOWN') }}"
          - "Service Status       : {{ wazuh_service_status.stdout | default('NOT_DETECTED') }}"
          - "Health               : {{ wazuh_health }}"
          - ""
          - "ZABBIX"
          - "----------------------------------------------------------------"
          - "Agent Installed      : {{ zabbix_agent_installed }}"
          - "Agent Version        : {{ zabbix_final_agent_version.stdout }}"
          - "Agent Service        : {{ zabbix_agent_service_status.stdout | default('NOT_DETECTED') }}"
          - "Agent 2 Installed    : {{ zabbix_agent2_installed }}"
          - "Agent 2 Version      : {{ zabbix_final_agent2_version.stdout }}"
          - "Agent 2 Service      : {{ zabbix_agent2_service_status.stdout | default('NOT_DETECTED') }}"
          - "Health               : {{ zabbix_health }}"
          - ""
          - "SYSTEM SERVICES"
          - "----------------------------------------------------------------"
          - "Auditd               : {{ auditd_service_status.stdout }}"
          - "Chrony               : {{ chrony_service_status.stdout }}"
          - "Rsyslog              : {{ rsyslog_service_status.stdout }}"
          - "Health               : {{ system_services_health }}"
          - ""
          - "PATCH MANAGEMENT"
          - "----------------------------------------------------------------"
          - "Pending Updates      : {{ pending_updates.stdout | default('N/A') }}"
          - "Security Updates     : {{ pending_security_updates.stdout | default('N/A') }}"
          - "Reboot Required      : {{ reboot_required.stat.exists }}"
          - ""
          - "FAILED SERVICES"
          - "----------------------------------------------------------------"
          - "{{ failed_services.stdout | default('NONE') | trim }}"
          - ""
          - "================================================================"
          - "OVERALL STATUS        : {{ overall_health }}"
          - "================================================================"
          - ""
          - "Detailed report:"
          - "/var/log/ubuntu-enterprise/security-stack-report.txt"
          - ""


  # =====================================================================
  # HANDLERS
  # =====================================================================

  handlers:

    - name: Restart Wazuh
      ansible.builtin.systemd:
        name: wazuh-agent
        state: restarted
        enabled: true


    - name: Restart Zabbix
      ansible.builtin.systemd:
        name: zabbix-agent2
        state: restarted
        enabled: true
        
