---
# ============================================================
# Enterprise Linux Software Lifecycle + Self-Healing v6
# Ubuntu 24.04 / Debian
#
# Kernel-aware release:
#   * Detect running kernel
#   * Detect installed kernels
#   * Detect APT candidate kernel/meta-package
#   * Compare installed vs available kernel
#   * Install the latest kernel meta-package
#   * Verify the new kernel exists
#   * Optional reboot
#   * Verify the new kernel is running
#   * Repair common APT/dpkg failures
#   * Safely isolate invalid third-party repositories
#   * Update all APT/Snap software
#   * Produce JSON report
# ============================================================

- name: Enterprise Linux Software Lifecycle Self Healing v6
  hosts: all
  become: true
  gather_facts: true

  vars:
    update_packages: true
    update_kernel: true
    update_snap: true
    reboot_if_required: false
    cleanup_packages: true

    self_heal: true
    max_repair_attempts: 3

    disable_invalid_repositories: true

    protected_repository_patterns:
      - "archive.ubuntu.com"
      - "security.ubuntu.com"
      - "ports.ubuntu.com"
      - "old-releases.ubuntu.com"
      - "archive.debian.org"
      - "security.debian.org"

    excluded_packages: []

    report_directory: "/var/log/ansible-software-update"
    report_file: "/var/log/ansible-software-update/software-update-report.json"
    repair_log: "/var/log/ansible-software-update/self-healing.log"

  pre_tasks:

    - name: Validate supported OS
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Ubuntu', 'Debian']
        fail_msg: "Unsupported OS {{ ansible_distribution }}"

    - name: Create report directory
      ansible.builtin.file:
        path: "{{ report_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Detect running kernel
      ansible.builtin.command:
        cmd: uname -r
      register: running_kernel_cmd
      changed_when: false

    - name: Set running kernel
      ansible.builtin.set_fact:
        kernel_running_before: "{{ running_kernel_cmd.stdout | trim }}"

  tasks:

    # ========================================================
    # 1. APT repository inventory / health
    # ========================================================

    - name: Read configured APT sources
      ansible.builtin.shell: |
        set +e
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] || continue
          echo "===== $f ====="
          cat "$f"
        done
        exit 0
      register: apt_sources_before
      changed_when: false

    - name: Check dpkg state
      ansible.builtin.command:
        cmd: dpkg --audit
      register: dpkg_audit_before
      changed_when: false
      failed_when: false

    - name: Repair interrupted dpkg
      ansible.builtin.command:
        cmd: dpkg --configure -a
      register: dpkg_configure
      when:
        - self_heal
        - dpkg_audit_before.stdout | trim | length > 0
      changed_when: true
      failed_when: false

    - name: Repair broken dependencies
      ansible.builtin.command:
        cmd: apt-get -f install -y
      register: dependency_repair
      when: self_heal
      changed_when: true
      failed_when: false

    - name: Refresh APT cache
      ansible.builtin.command:
        cmd: apt-get update
      register: apt_update_initial
      changed_when: false
      failed_when: false

    - name: Detect APT Release-file failure
      ansible.builtin.set_fact:
        invalid_release_detected: >-
          {{
            'does not have a Release file' in
            (
              (apt_update_initial.stdout | default('')) ~ '\n' ~
              (apt_update_initial.stderr | default(''))
            )
          }}

    - name: Extract failed repository URLs
      ansible.builtin.shell: |
        {
          printf '%s\n' "{{ apt_update_initial.stdout | default('') }}"
          printf '%s\n' "{{ apt_update_initial.stderr | default('') }}"
        } |
        grep -Eo 'https?://[^[:space:]]+' |
        sort -u || true
      register: invalid_repository_urls
      changed_when: false
      when:
        - invalid_release_detected

    - name: Display detected invalid repositories
      ansible.builtin.debug:
        msg:
          - "Invalid repository detected"
          - "{{ invalid_repository_urls.stdout_lines | default([]) }}"
      when: invalid_release_detected

    - name: Back up and disable invalid third-party repositories
      ansible.builtin.shell: |
        set -e
        backup="/etc/apt/sources.list.d/ansible-disabled"
        mkdir -p "$backup"

        changed=0

        for f in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] || continue

          matched=0

          while IFS= read -r url; do
            [ -n "$url" ] || continue

            case "$url" in
              *archive.ubuntu.com*|*security.ubuntu.com*|*ports.ubuntu.com*|*old-releases.ubuntu.com*|*archive.debian.org*|*security.debian.org*)
                continue
                ;;
            esac

            if grep -qF "$url" "$f"; then
              matched=1
              break
            fi
          done <<'URLS'
        {{ invalid_repository_urls.stdout | default('') }}
        URLS

          if [ "$matched" -eq 1 ]; then
            cp -a "$f" "$backup/$(basename "$f").$(date +%Y%m%d%H%M%S).bak"

            if grep -qE '^[[:space:]]*deb ' "$f"; then
              sed -i -E 's/^[[:space:]]*deb[[:space:]]+/# disabled-by-ansible: deb /' "$f"
              sed -i -E 's/^[[:space:]]*deb-src[[:space:]]+/# disabled-by-ansible: deb-src /' "$f"
            else
              sed -i -E 's/^[[:space:]]*(Types:|URIs:|Suites:|Components:|Architectures:)/# disabled-by-ansible: \1/' "$f"
            fi

            echo "Disabled invalid repository source: $f"
            changed=1
          fi
        done

        exit 0
      args:
        executable: /bin/bash
      register: repository_repair
      changed_when: "'Disabled invalid repository source:' in repository_repair.stdout"
      failed_when: false
      when:
        - self_heal
        - disable_invalid_repositories
        - invalid_release_detected
        - invalid_repository_urls.stdout | default('') | trim | length > 0

    - name: Retry APT cache after repository repair
      ansible.builtin.command:
        cmd: apt-get update
      register: apt_update_retry
      changed_when: false
      failed_when: false
      when: invalid_release_detected

    - name: Select final APT update result
      ansible.builtin.set_fact:
        apt_update_result: >-
          {{
            apt_update_retry
            if invalid_release_detected
            else apt_update_initial
          }}

    - name: Stop if APT remains unhealthy
      ansible.builtin.fail:
        msg: |
          APT remains unhealthy on {{ inventory_hostname }}.
          stdout:
          {{ apt_update_result.stdout | default('') }}
          stderr:
          {{ apt_update_result.stderr | default('') }}
      when: apt_update_result.rc | default(1) != 0

    # ========================================================
    # 2. Package inventory
    # ========================================================

    - name: Inventory installed packages
      ansible.builtin.shell: |
        dpkg-query -W -f='${binary:Package}\t${Version}\t${Architecture}\t${Status}\n'
      register: installed_packages_before
      changed_when: false

    - name: Count installed packages
      ansible.builtin.shell: |
        dpkg-query -W -f='${binary:Package}\n' | wc -l
      register: installed_package_count_before
      changed_when: false

    - name: Count available package updates
      ansible.builtin.shell: |
        apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: available_update_count
      changed_when: false

    - name: Inventory security updates
      ansible.builtin.shell: |
        apt list --upgradable 2>/dev/null |
        grep -Ei 'security|security.ubuntu.com|security.debian.org' || true
      register: security_updates
      changed_when: false

    - name: Count security updates
      ansible.builtin.shell: |
        apt list --upgradable 2>/dev/null |
        grep -Ei 'security|security.ubuntu.com|security.debian.org' |
        wc -l || true
      register: security_update_count
      changed_when: false

    - name: List held packages
      ansible.builtin.command:
        cmd: apt-mark showhold
      register: held_packages
      changed_when: false
      failed_when: false

    # ========================================================
    # 3. Detect kernel track
    # ========================================================

    - name: Detect HWE kernel meta package
      ansible.builtin.shell: |
        dpkg-query -W -f='${Status}' linux-image-generic-hwe-{{ ansible_distribution_version }} 2>/dev/null |
        grep -q 'install ok installed'
      register: hwe_kernel_meta
      changed_when: false
      failed_when: false
      when: ansible_distribution == 'Ubuntu'

    - name: Select HWE kernel track
      ansible.builtin.set_fact:
        kernel_track: "hwe"
      when:
        - ansible_distribution == 'Ubuntu'
        - hwe_kernel_meta.rc == 0

    - name: Select Generic Ubuntu kernel track
      ansible.builtin.set_fact:
        kernel_track: "generic"
      when:
        - ansible_distribution == 'Ubuntu'
        - hwe_kernel_meta.rc | default(1) != 0

    - name: Select Debian kernel track
      ansible.builtin.set_fact:
        kernel_track: "debian"
      when: ansible_distribution == 'Debian'

    - name: Select Ubuntu HWE kernel packages
      ansible.builtin.set_fact:
        kernel_image_meta_package: "linux-image-generic-hwe-{{ ansible_distribution_version }}"
        kernel_meta_package: "linux-generic-hwe-{{ ansible_distribution_version }}"
        kernel_headers_meta_package: "linux-headers-generic-hwe-{{ ansible_distribution_version }}"
      when:
        - ansible_distribution == 'Ubuntu'
        - kernel_track == 'hwe'

    - name: Select Ubuntu Generic kernel packages
      ansible.builtin.set_fact:
        kernel_image_meta_package: "linux-image-generic"
        kernel_meta_package: "linux-generic"
        kernel_headers_meta_package: "linux-headers-generic"
      when:
        - ansible_distribution == 'Ubuntu'
        - kernel_track == 'generic'

    - name: Select Debian kernel packages
      ansible.builtin.set_fact:
        kernel_image_meta_package: "linux-image-amd64"
        kernel_meta_package: "linux-image-amd64"
        kernel_headers_meta_package: "linux-headers-amd64"
      when: ansible_distribution == 'Debian'

    # ========================================================
    # 4. Discover installed kernel versions
    # ========================================================

    - name: Discover installed kernel images
      ansible.builtin.shell: |
        ls -1 /boot/vmlinuz-* 2>/dev/null |
        sed 's#^/boot/vmlinuz-##' |
        sort -V || true
      register: installed_kernel_versions_cmd
      changed_when: false
      failed_when: false

    - name: Set installed kernel versions
      ansible.builtin.set_fact:
        installed_kernel_versions: "{{ installed_kernel_versions_cmd.stdout_lines | default([]) }}"

    - name: Determine newest installed kernel
      ansible.builtin.set_fact:
        newest_installed_kernel: >-
          {{
            installed_kernel_versions[-1]
            if (installed_kernel_versions | length > 0)
            else ''
          }}

    # ========================================================
    # 5. Determine APT candidate kernel
    # ========================================================

    - name: Query APT candidate for kernel image meta package
      ansible.builtin.shell: |
        apt-cache policy "{{ kernel_image_meta_package }}" |
        awk '/Candidate:/ {print $2; exit}'
      register: kernel_image_candidate
      changed_when: false
      failed_when: false

    - name: Query APT candidate for kernel meta package
      ansible.builtin.shell: |
        apt-cache policy "{{ kernel_meta_package }}" |
        awk '/Candidate:/ {print $2; exit}'
      register: kernel_meta_candidate
      changed_when: false
      failed_when: false

    - name: Query installed kernel meta package version
      ansible.builtin.shell: |
        dpkg-query -W -f='${Version}' "{{ kernel_meta_package }}" 2>/dev/null || true
      register: kernel_meta_installed
      changed_when: false
      failed_when: false

    - name: Query installed kernel image meta package version
      ansible.builtin.shell: |
        dpkg-query -W -f='${Version}' "{{ kernel_image_meta_package }}" 2>/dev/null || true
      register: kernel_image_meta_installed
      changed_when: false
      failed_when: false

    - name: Set kernel candidate facts
      ansible.builtin.set_fact:
        kernel_image_candidate_version: "{{ kernel_image_candidate.stdout | trim }}"
        kernel_meta_candidate_version: "{{ kernel_meta_candidate.stdout | trim }}"
        kernel_meta_installed_version: "{{ kernel_meta_installed.stdout | trim }}"
        kernel_image_meta_installed_version: "{{ kernel_image_meta_installed.stdout | trim }}"

    - name: Display kernel availability
      ansible.builtin.debug:
        msg:
          - "Running kernel: {{ kernel_running_before }}"
          - "Newest installed kernel: {{ newest_installed_kernel | default('NONE') }}"
          - "Kernel image meta package: {{ kernel_image_meta_package }}"
          - "Kernel image candidate: {{ kernel_image_candidate_version | default('NONE') }}"
          - "Kernel meta package: {{ kernel_meta_package }}"
          - "Kernel meta candidate: {{ kernel_meta_candidate_version | default('NONE') }}"
          - "Kernel meta installed: {{ kernel_meta_installed_version | default('NONE') }}"

    # ========================================================
    # 6. Install latest kernel meta packages
    # ========================================================

    - name: Install/update latest kernel meta package
      ansible.builtin.apt:
        name:
          - "{{ kernel_meta_package }}"
          - "{{ kernel_image_meta_package }}"
          - "{{ kernel_headers_meta_package }}"
        state: latest
        install_recommends: true
        update_cache: false
      register: kernel_update_result
      when:
        - update_packages
        - update_kernel

    - name: Repair dependencies after kernel update
      ansible.builtin.command:
        cmd: apt-get -f install -y
      register: kernel_dependency_repair
      changed_when: true
      failed_when: false
      when:
        - update_packages
        - update_kernel

    - name: Rebuild all initramfs images
      ansible.builtin.command:
        cmd: update-initramfs -u -k all
      register: initramfs_update
      changed_when: true
      failed_when: false
      when:
        - update_packages
        - update_kernel

    - name: Update GRUB
      ansible.builtin.command:
        cmd: update-grub
      register: grub_update
      changed_when: true
      failed_when: false
      when:
        - update_packages
        - update_kernel

    # ========================================================
    # 7. Re-discover kernel after installation
    # ========================================================

    - name: Discover kernels after kernel update
      ansible.builtin.shell: |
        ls -1 /boot/vmlinuz-* 2>/dev/null |
        sed 's#^/boot/vmlinuz-##' |
        sort -V || true
      register: installed_kernel_versions_after_cmd
      changed_when: false
      failed_when: false

    - name: Set final installed kernel list
      ansible.builtin.set_fact:
        installed_kernel_versions_after: "{{ installed_kernel_versions_after_cmd.stdout_lines | default([]) }}"

    - name: Determine newest kernel after update
      ansible.builtin.set_fact:
        newest_installed_kernel_after: >-
          {{
            installed_kernel_versions_after[-1]
            if (installed_kernel_versions_after | length > 0)
            else ''
          }}

    - name: Verify kernel image exists after update
      ansible.builtin.assert:
        that:
          - newest_installed_kernel_after | length > 0
          - newest_installed_kernel_after in installed_kernel_versions_after
        fail_msg: "Kernel update verification failed on {{ inventory_hostname }}"
        success_msg: "Newest installed kernel verified: {{ newest_installed_kernel_after }}"
      when:
        - update_packages
        - update_kernel

    # ========================================================
    # 8. Update all normal packages
    # ========================================================

    - name: Upgrade all APT packages
      ansible.builtin.apt:
        name: "*"
        state: latest
        only_upgrade: true
        update_cache: false
        autoremove: false
      register: package_update_result
      when:
        - update_packages
        - excluded_packages | length == 0

    - name: Get installed package names
      ansible.builtin.shell: |
        dpkg-query -W -f='${binary:Package}\n'
      register: installed_package_names
      changed_when: false
      when:
        - update_packages
        - excluded_packages | length > 0

    - name: Build package update list
      ansible.builtin.set_fact:
        update_package_list: >-
          {{
            installed_package_names.stdout_lines
            | reject('in', excluded_packages)
            | list
          }}
      when:
        - update_packages
        - excluded_packages | length > 0

    - name: Upgrade packages excluding configured exclusions
      ansible.builtin.apt:
        name: "{{ update_package_list }}"
        state: latest
        only_upgrade: true
        update_cache: false
      register: package_update_result
      when:
        - update_packages
        - excluded_packages | length > 0
        - update_package_list | length > 0

    # ========================================================
    # 9. Snap updates
    # ========================================================

    - name: Detect Snap
      ansible.builtin.command:
        cmd: snap version
      register: snap_detect
      changed_when: false
      failed_when: false

    - name: Update Snap packages
      ansible.builtin.command:
        cmd: snap refresh
      register: snap_update_result
      changed_when: "'All snaps up to date' not in snap_update_result.stdout"
      failed_when: false
      when:
        - update_packages
        - update_snap
        - snap_detect.rc == 0

    # ========================================================
    # 10. Cleanup
    # ========================================================

    - name: Cleanup unused packages
      ansible.builtin.apt:
        autoremove: true
        autoclean: true
      register: cleanup_result
      when:
        - update_packages
        - cleanup_packages

    # ========================================================
    # 11. Reboot detection
    # ========================================================

    - name: Check reboot-required marker
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Read reboot-required packages
      ansible.builtin.command:
        cmd: cat /var/run/reboot-required.pkgs
      register: reboot_required_packages
      changed_when: false
      failed_when: false
      when: reboot_required_file.stat.exists

    - name: Set reboot required
      ansible.builtin.set_fact:
        reboot_required: "{{ reboot_required_file.stat.exists }}"

    - name: Determine whether kernel changed
      ansible.builtin.set_fact:
        kernel_changed: >-
          {{
            (newest_installed_kernel_after | default(newest_installed_kernel))
            != kernel_running_before
          }}

    # ========================================================
    # 12. Optional reboot
    # ========================================================

    - name: Reboot to activate newest kernel
      ansible.builtin.reboot:
        msg: "Enterprise kernel/software update - activating newest kernel"
        reboot_timeout: 900
        connect_timeout: 30
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: "uname -r"
      when:
        - reboot_if_required
        - reboot_required or kernel_changed

    - name: Detect running kernel after update
      ansible.builtin.command:
        cmd: uname -r
      register: kernel_running_after_cmd
      changed_when: false

    - name: Set running kernel after update
      ansible.builtin.set_fact:
        kernel_running_after: "{{ kernel_running_after_cmd.stdout | trim }}"

    - name: Verify newest kernel is running when reboot was requested
      ansible.builtin.assert:
        that:
          - kernel_running_after == newest_installed_kernel_after
        fail_msg: |
          Kernel activation verification FAILED.

          Newest installed: {{ newest_installed_kernel_after }}
          Running: {{ kernel_running_after }}

          The newest kernel is installed but is not running.
        success_msg: "Kernel activation verified: {{ kernel_running_after }}"
      when:
        - reboot_if_required
        - reboot_required or kernel_changed

    # ========================================================
    # 13. Final health
    # ========================================================

    - name: Final dpkg audit
      ansible.builtin.command:
        cmd: dpkg --audit
      register: dpkg_audit_after
      changed_when: false
      failed_when: false

    - name: Final APT dependency check
      ansible.builtin.command:
        cmd: apt-get check
      register: apt_check_after
      changed_when: false
      failed_when: false

    - name: Count remaining package updates
      ansible.builtin.shell: |
        apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: remaining_update_count
      changed_when: false

    - name: Count installed packages after update
      ansible.builtin.shell: |
        dpkg-query -W -f='${binary:Package}\n' | wc -l
      register: installed_package_count_after
      changed_when: false

    - name: Final available kernel candidate
      ansible.builtin.shell: |
        apt-cache policy "{{ kernel_image_meta_package }}" |
        awk '/Candidate:/ {print $2; exit}'
      register: final_kernel_candidate
      changed_when: false
      failed_when: false

    # ========================================================
    # 14. JSON report
    # ========================================================

    - name: Write enterprise software update report
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          {
            "hostname": {{ ansible_hostname | to_json }},
            "os": {{ ansible_distribution | to_json }},
            "os_version": {{ ansible_distribution_version | to_json }},
            "architecture": {{ ansible_architecture | to_json }},
            "kernel": {
              "track": {{ kernel_track | to_json }},
              "running_before": {{ kernel_running_before | to_json }},
              "newest_installed_before": {{ newest_installed_kernel | to_json }},
              "candidate_image_meta": {{ kernel_image_candidate_version | to_json }},
              "candidate_meta": {{ kernel_meta_candidate_version | to_json }},
              "installed_meta": {{ kernel_meta_installed_version | to_json }},
              "newest_installed_after": {{ newest_installed_kernel_after | to_json }},
              "running_after": {{ kernel_running_after | to_json }},
              "kernel_changed": {{ kernel_changed | lower }},
              "reboot_required": {{ reboot_required | lower }}
            },
            "packages": {
              "installed_before": {{ installed_package_count_before.stdout | trim | int }},
              "available_updates_before": {{ available_update_count.stdout | trim | int }},
              "security_updates_before": {{ security_update_count.stdout | trim | int }},
              "installed_after": {{ installed_package_count_after.stdout | trim | int }},
              "remaining_updates": {{ remaining_update_count.stdout | trim | int }}
            },
            "apt": {
              "repository_update_rc": {{ apt_update_result.rc | default(1) }},
              "dpkg_audit_rc": {{ dpkg_audit_after.rc | default(1) }},
              "apt_check_rc": {{ apt_check_after.rc | default(1) }}
            },
            "self_healing": {
              "enabled": {{ self_heal | lower }},
              "invalid_repository_detected": {{ invalid_release_detected | default(false) | lower }},
              "repository_repair_attempted": {{ repository_repair is defined | lower }},
              "dependency_repair_attempted": {{ dependency_repair is defined | lower }}
            }
          }

    # ========================================================
    # 15. Final summary
    # ========================================================

    - name: Display enterprise update summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "ENTERPRISE SOFTWARE + KERNEL SELF-HEALING v6"
          - "============================================================"
          - "Host: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "APT repository health: {{ 'PASS' if apt_update_result.rc == 0 else 'FAILED' }}"
          - "Kernel track: {{ kernel_track }}"
          - "Kernel image meta: {{ kernel_image_meta_package }}"
          - "Kernel meta: {{ kernel_meta_package }}"
          - "Running kernel before: {{ kernel_running_before }}"
          - "Newest installed kernel before: {{ newest_installed_kernel }}"
          - "APT candidate image meta: {{ kernel_image_candidate_version | default('NONE') }}"
          - "APT candidate kernel meta: {{ kernel_meta_candidate_version | default('NONE') }}"
          - "Newest installed kernel after: {{ newest_installed_kernel_after }}"
          - "Running kernel after: {{ kernel_running_after }}"
          - "Kernel changed: {{ kernel_changed }}"
          - "Reboot required: {{ reboot_required }}"
          - "Updates remaining: {{ remaining_update_count.stdout | trim }}"
          - "DPKG audit: {{ 'PASS' if dpkg_audit_after.rc == 0 else 'CHECK REQUIRED' }}"
          - "APT check: {{ 'PASS' if apt_check_after.rc == 0 else 'CHECK REQUIRED' }}"
          - "Report: {{ report_file }}"
          - "============================================================"
