---
- name: GitLab Runner Production Safe Automatic Upgrade
  hosts: all
  become: true
  gather_facts: true

  vars:

    runner_package: "gitlab-runner"
    runner_service: "gitlab-runner"

    # Official GitLab Runner repository
    gitlab_repo_script_url: "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh"
    gitlab_repo_script: "/tmp/gitlab-runner-repo.sh"

    # Official GitLab Runner download endpoint
    gitlab_latest_index_url: "https://s3.dualstack.us-east-1.amazonaws.com/gitlab-runner-downloads/latest/index.html"

    backup_root: "/var/backups/gitlab-runner"

    health_retries: 12
    health_delay: 5

  tasks:

    # ==========================================================
    # 1. SYSTEM INFORMATION
    # ==========================================================

    - name: Display system information
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "GITLAB RUNNER AUTOMATIC UPGRADE"
          - "=============================================="
          - "Host : {{ inventory_hostname }}"
          - "OS   : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Arch : {{ ansible_architecture }}"
          - "=============================================="


    - name: Verify Debian based system
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: "This playbook supports Ubuntu/Debian systems only."


    # ==========================================================
    # 2. DETECT ARCHITECTURE
    # ==========================================================

    - name: Get Debian architecture
      ansible.builtin.command:
        cmd: dpkg --print-architecture
      register: deb_arch
      changed_when: false


    - name: Set GitLab download architecture
      ansible.builtin.set_fact:
        runner_download_arch: >-
          {{
            'amd64' if deb_arch.stdout | trim == 'amd64'
            else 'arm64' if deb_arch.stdout | trim == 'arm64'
            else 'arm' if deb_arch.stdout | trim == 'armhf'
            else '386' if deb_arch.stdout | trim == 'i386'
            else ''
          }}


    - name: Validate architecture
      ansible.builtin.assert:
        that:
          - runner_download_arch != ""
        fail_msg:
          - "Unsupported GitLab Runner architecture."
          - "Detected: {{ deb_arch.stdout }}"


    # ==========================================================
    # 3. CURRENT RUNNER VERSION
    # ==========================================================

    - name: Get current Runner version
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: runner_version_output
      changed_when: false
      failed_when: false


    - name: Validate Runner installation
      ansible.builtin.assert:
        that:
          - runner_version_output.rc == 0
        fail_msg: "GitLab Runner is not installed."


    - name: Extract current Runner version
      ansible.builtin.set_fact:
        installed_runner_version: >-
          {{
            runner_version_output.stdout
            | regex_search(
                'Version:\s+([0-9]+\.[0-9]+\.[0-9]+)',
                '\1'
              )
            | first
            | default('')
          }}


    - name: Get current package version
      ansible.builtin.shell:
        cmd: >
          dpkg-query
          -W
          -f='${Version}'
          {{ runner_package }}
      register: installed_package
      changed_when: false


    - name: Set current package version
      ansible.builtin.set_fact:
        installed_package_version: "{{ installed_package.stdout | trim }}"


    - name: Display current Runner
      ansible.builtin.debug:
        msg:
          - "Installed Runner : {{ installed_runner_version }}"
          - "Installed Package: {{ installed_package_version }}"


    # ==========================================================
    # 4. ENSURE OFFICIAL APT REPOSITORY
    # ==========================================================

    - name: Detect GitLab Runner repository
      ansible.builtin.shell:
        cmd: |
          grep -RhsE \
          'packages\.gitlab\.com.*runner/gitlab-runner' \
          /etc/apt/sources.list \
          /etc/apt/sources.list.d/ \
          2>/dev/null || true
      register: gitlab_repo
      changed_when: false


    - name: Install repository configuration
      when: gitlab_repo.stdout | trim == ""
      block:

        - name: Download GitLab Runner repository installer
          ansible.builtin.get_url:
            url: "{{ gitlab_repo_script_url }}"
            dest: "{{ gitlab_repo_script }}"
            mode: "0755"

        - name: Install official repository
          ansible.builtin.command:
            cmd: "bash {{ gitlab_repo_script }}"

        - name: Remove repository installer
          ansible.builtin.file:
            path: "{{ gitlab_repo_script }}"
            state: absent


    # ==========================================================
    # 5. APT UPDATE
    # ==========================================================

    - name: Update APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0


    # ==========================================================
    # 6. CHECK APT LATEST
    # ==========================================================

    - name: Get APT candidate
      ansible.builtin.shell:
        cmd: |
          apt-cache policy {{ runner_package }} |
          awk '/Candidate:/ {print $2}'
      register: apt_candidate
      changed_when: false


    - name: Set APT candidate
      ansible.builtin.set_fact:
        apt_latest_version: "{{ apt_candidate.stdout | trim }}"


    - name: Display APT candidate
      ansible.builtin.debug:
        msg:
          - "APT candidate: {{ apt_latest_version }}"


    # ==========================================================
    # 7. CHECK WHETHER APT HAS NEWER VERSION
    # ==========================================================

    - name: Determine APT upgrade availability
      ansible.builtin.set_fact:
        apt_upgrade_available: >-
          {{
            apt_latest_version != ""
            and apt_latest_version != "none"
            and apt_latest_version is version(
              installed_package_version,
              '>'
            )
          }}


    # ==========================================================
    # 8. QUERY OFFICIAL LATEST RELEASE INDEX
    # ==========================================================

    - name: Download official GitLab Runner latest index
      ansible.builtin.uri:
        url: "{{ gitlab_latest_index_url }}"
        method: GET
        return_content: true
        status_code: 200
        timeout: 30
      register: gitlab_latest_index
      changed_when: false
      failed_when: false


    - name: Detect latest official Runner DEB
      ansible.builtin.set_fact:
        latest_deb_filename: >-
          {{
            (
              gitlab_latest_index.content
              | regex_findall(
                  'gitlab-runner_[0-9]+\.[0-9]+\.[0-9]+-[0-9]+_' ~
                  runner_download_arch ~
                  '\.deb'
                )
            | sort
            | last
            | default('')
          }}


    - name: Extract latest official version
      ansible.builtin.set_fact:
        official_latest_package_version: >-
          {{
            latest_deb_filename
            | regex_search(
                'gitlab-runner_([0-9]+\.[0-9]+\.[0-9]+-[0-9]+)_',
                '\1'
              )
            | first
            | default('')
          }}


    - name: Display official release detection
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "OFFICIAL GITLAB RELEASE CHECK"
          - "=============================================="
          - "APT candidate      : {{ apt_latest_version }}"
          - "Official DEB       : {{ latest_deb_filename }}"
          - "Official version   : {{ official_latest_package_version }}"
          - "=============================================="


    # ==========================================================
    # 9. SELECT UPGRADE SOURCE
    # ==========================================================

    - name: Select APT as upgrade source
      ansible.builtin.set_fact:
        selected_upgrade_version: "{{ apt_latest_version }}"
        selected_upgrade_method: "APT"
      when:
        - apt_upgrade_available


    - name: Select official DEB as fallback
      ansible.builtin.set_fact:
        selected_upgrade_version: "{{ official_latest_package_version }}"
        selected_upgrade_method: "OFFICIAL-DEB"
      when:
        - not apt_upgrade_available
        - official_latest_package_version != ""
        - official_latest_package_version is version(
            installed_package_version,
            '>'
          )


    # ==========================================================
    # 10. DETERMINE FINAL UPGRADE STATUS
    # ==========================================================

    - name: Determine whether upgrade exists
      ansible.builtin.set_fact:
        upgrade_required: >-
          {{
            selected_upgrade_version is defined
            and selected_upgrade_version != ""
            and selected_upgrade_version is version(
              installed_package_version,
              '>'
            )
          }}


    - name: Display final version decision
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VERSION DECISION"
          - "=============================================="
          - "Installed package : {{ installed_package_version }}"
          - "APT candidate     : {{ apt_latest_version }}"
          - "Official latest   : {{ official_latest_package_version }}"
          - "Selected version  : {{ selected_upgrade_version | default('NONE') }}"
          - "Upgrade method    : {{ selected_upgrade_method | default('NONE') }}"
          - "Upgrade required  : {{ upgrade_required }}"
          - "=============================================="


    # ==========================================================
    # 11. NO UPDATE
    # ==========================================================

    - name: Report no upgrade
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "NO NEWER OFFICIAL GITLAB RUNNER RELEASE"
          - "=============================================="
          - "Installed package : {{ installed_package_version }}"
          - "APT candidate     : {{ apt_latest_version }}"
          - "Official latest   : {{ official_latest_package_version }}"
          - ""
          - "No newer official GitLab Runner package"
          - "was detected."
          - ""
          - "NO RUNNER CHANGES WILL BE MADE."
          - "=============================================="
      when:
        - not upgrade_required


    - name: End host when current version is latest
      ansible.builtin.meta: end_host
      when:
        - not upgrade_required


    # ==========================================================
    # 12. CREATE BACKUP
    # ==========================================================

    - name: Generate backup timestamp
      ansible.builtin.set_fact:
        backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"


    - name: Set backup directory
      ansible.builtin.set_fact:
        backup_dir: "{{ backup_root }}/{{ backup_timestamp }}"


    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"


    # ==========================================================
    # 13. BACKUP CONFIGURATION
    # ==========================================================

    - name: Backup /etc/gitlab-runner
      ansible.builtin.command:
        cmd: >
          tar
          --preserve-permissions
          --same-owner
          -czf
          {{ backup_dir }}/gitlab-runner-config.tar.gz
          /etc/gitlab-runner


    - name: Check default configuration
      ansible.builtin.stat:
        path: /etc/default/gitlab-runner
      register: default_config


    - name: Backup default configuration
      ansible.builtin.copy:
        src: /etc/default/gitlab-runner
        dest: "{{ backup_dir }}/gitlab-runner-default"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - default_config.stat.exists


    - name: Backup systemd service
      ansible.builtin.shell:
        cmd: |
          systemctl cat {{ runner_service }} \
          > {{ backup_dir }}/systemd-before.txt 2>&1
      changed_when: false


    - name: Save version information
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/version-before.txt"
        mode: "0600"
        content: |
          Host: {{ inventory_hostname }}
          Date: {{ ansible_date_time.iso8601 }}

          Runner:
          {{ installed_runner_version }}

          Package:
          {{ installed_package_version }}

          Selected upgrade:
          {{ selected_upgrade_version }}

          Upgrade method:
          {{ selected_upgrade_method }}


    # ==========================================================
    # 14. SECURE ROLLBACK PACKAGE
    # ==========================================================

    - name: Download exact installed package
      ansible.builtin.command:
        cmd: >
          apt-get download
          {{ runner_package }}={{ installed_package_version }}
      args:
        chdir: "{{ backup_dir }}"
      register: rollback_download
      changed_when: true
      failed_when: false


    - name: Find rollback package
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns:
          - "gitlab-runner_*.deb"
        file_type: file
      register: rollback_packages


    - name: Abort if rollback package unavailable
      ansible.builtin.fail:
        msg:
          - "=============================================="
          - "UPGRADE ABORTED"
          - "=============================================="
          - "New version: {{ selected_upgrade_version }}"
          - ""
          - "The exact currently installed package"
          - "could not be downloaded."
          - ""
          - "Automatic rollback cannot be guaranteed."
          - ""
          - "NO UPGRADE WAS PERFORMED."
          - "=============================================="
      when:
        - rollback_packages.files | length == 0


    # ==========================================================
    # 15. VERIFY BEFORE UPGRADE
    # ==========================================================

    - name: Verify Runner before upgrade
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: verify_before
      changed_when: false
      failed_when: false


    - name: Save verification
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/verify-before.txt"
        mode: "0600"
        content: |
          RC:
          {{ verify_before.rc }}

          STDOUT:
          {{ verify_before.stdout }}

          STDERR:
          {{ verify_before.stderr }}


    # ==========================================================
    # 16. APT UPGRADE
    # ==========================================================

    - name: Upgrade using APT
      ansible.builtin.apt:
        name: "{{ runner_package }}"
        state: latest
        update_cache: true
      register: apt_upgrade_result
      when:
        - selected_upgrade_method == "APT"


    # ==========================================================
    # 17. OFFICIAL DEB FALLBACK
    # ==========================================================

    - name: Set official DEB URL
      ansible.builtin.set_fact:
        official_deb_url: >-
          https://s3.dualstack.us-east-1.amazonaws.com/
          gitlab-runner-downloads/latest/deb/
          {{ latest_deb_filename }}
      when:
        - selected_upgrade_method == "OFFICIAL-DEB"


    - name: Download latest official DEB
      ansible.builtin.get_url:
        url: "{{ official_deb_url }}"
        dest: "{{ backup_dir }}/{{ latest_deb_filename }}"
        mode: "0644"
        timeout: 120
      when:
        - selected_upgrade_method == "OFFICIAL-DEB"


    - name: Install latest official DEB
      ansible.builtin.apt:
        deb: "{{ backup_dir }}/{{ latest_deb_filename }}"
        state: present
      when:
        - selected_upgrade_method == "OFFICIAL-DEB"


    # ==========================================================
    # 18. RELOAD / RESTART
    # ==========================================================

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true


    - name: Restart GitLab Runner
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: restarted
        enabled: true


    # ==========================================================
    # 19. HEALTH CHECK
    # ==========================================================

    - name: Wait for Runner service
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: service_health
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
      until: service_health.rc == 0
      changed_when: false
      failed_when: false


    - name: Check Runner binary
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: upgraded_runner
      changed_when: false
      failed_when: false


    - name: Verify Runner registration
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: verify_after
      changed_when: false
      failed_when: false


    - name: Get final package version
      ansible.builtin.shell:
        cmd: >
          dpkg-query
          -W
          -f='${Version}'
          {{ runner_package }}
      register: final_package
      changed_when: false


    # ==========================================================
    # 20. DETERMINE HEALTH
    # ==========================================================

    - name: Determine upgrade health
      ansible.builtin.set_fact:
        runner_healthy: >-
          {{
            service_health.rc == 0
            and upgraded_runner.rc == 0
            and verify_after.rc == 0
            and (
              final_package.stdout | trim
            ) is version(
              installed_package_version,
              '>'
            )
          }}


    # ==========================================================
    # 21. AUTOMATIC ROLLBACK
    # ==========================================================

    - name: Stop Runner for rollback
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: stopped
      when:
        - not runner_healthy


    - name: Restore old Runner package
      ansible.builtin.apt:
        deb: "{{ rollback_packages.files[0].path }}"
        state: present
        force: true
      when:
        - not runner_healthy


    - name: Restore Runner configuration
      ansible.builtin.command:
        cmd: >
          tar
          --preserve-permissions
          --same-owner
          -xzf
          {{ backup_dir }}/gitlab-runner-config.tar.gz
          -C /
      when:
        - not runner_healthy


    - name: Restore default configuration
      ansible.builtin.copy:
        src: "{{ backup_dir }}/gitlab-runner-default"
        dest: /etc/default/gitlab-runner
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when:
        - not runner_healthy
        - default_config.stat.exists


    - name: Reload systemd after rollback
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - not runner_healthy


    - name: Start Runner after rollback
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: started
        enabled: true
      when:
        - not runner_healthy


    # ==========================================================
    # 22. VERIFY ROLLBACK
    # ==========================================================

    - name: Verify rollback service
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: rollback_service
      changed_when: false
      when:
        - not runner_healthy


    - name: Verify rollback Runner
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: rollback_verify
      changed_when: false
      failed_when: false
      when:
        - not runner_healthy


    - name: Save rollback report
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/ROLLBACK-REPORT.txt"
        mode: "0600"
        content: |
          ==============================================
          GITLAB RUNNER AUTOMATIC ROLLBACK
          ==============================================

          Host:
          {{ inventory_hostname }}

          Previous version:
          {{ installed_package_version }}

          Attempted version:
          {{ selected_upgrade_version }}

          Service:
          {{ rollback_service.stdout | default('UNKNOWN') }}

          Verify RC:
          {{ rollback_verify.rc | default('UNKNOWN') }}

          Backup:
          {{ backup_dir }}

          ==============================================

      when:
        - not runner_healthy


    - name: Fail after rollback
      ansible.builtin.fail:
        msg:
          - "=============================================="
          - "UPGRADE FAILED - AUTOMATIC ROLLBACK"
          - "=============================================="
          - "Host: {{ inventory_hostname }}"
          - "Previous: {{ installed_package_version }}"
          - "Attempted: {{ selected_upgrade_version }}"
          - "Backup: {{ backup_dir }}"
          - ""
          - "The Runner was rolled back."
          - "=============================================="
      when:
        - not runner_healthy


    # ==========================================================
    # 23. FINAL SUCCESS
    # ==========================================================

    - name: Final service check
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: final_service
      changed_when: false


    - name: Final Runner verification
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: final_verify
      changed_when: false


    - name: Display successful upgrade
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "GITLAB RUNNER UPGRADE SUCCESSFUL"
          - "=============================================="
          - "Host             : {{ inventory_hostname }}"
          - "Previous package : {{ installed_package_version }}"
          - "New package      : {{ final_package.stdout }}"
          - "Upgrade method   : {{ selected_upgrade_method }}"
          - "Service          : {{ final_service.stdout }}"
          - "Verify RC        : {{ final_verify.rc }}"
          - "Backup           : {{ backup_dir }}"
          - "=============================================="
