---
- name: Production Safe GitLab Runner Automatic Upgrade
  hosts: all
  become: true
  gather_facts: true

  vars:

    # ==========================================================
    # GitLab Runner
    # ==========================================================

    runner_package: "gitlab-runner"
    runner_service: "gitlab-runner"

    gitlab_repo_script_url: "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh"
    gitlab_repo_script: "/tmp/gitlab-runner-repo.sh"

    # ==========================================================
    # Backup
    # ==========================================================

    backup_root: "/var/backups/gitlab-runner"

    # ==========================================================
    # Health check
    # ==========================================================

    health_retries: 12
    health_delay: 5


  tasks:

    # ==========================================================
    # 1. BASIC VALIDATION
    # ==========================================================

    - name: Display target
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "GITLAB RUNNER AUTOMATIC UPGRADE"
          - "=============================================="
          - "Host : {{ inventory_hostname }}"
          - "OS   : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Arch : {{ ansible_architecture }}"
          - "=============================================="


    - name: Verify Debian based OS
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >
          This playbook supports Ubuntu/Debian systems only.


    # ==========================================================
    # 2. CHECK INSTALLED RUNNER
    # ==========================================================

    - name: Check GitLab Runner binary
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: runner_version_output
      changed_when: false
      failed_when: false


    - name: Verify GitLab Runner exists
      ansible.builtin.assert:
        that:
          - runner_version_output.rc == 0
        fail_msg:
          - "GitLab Runner is not installed."
          - "Host: {{ inventory_hostname }}"


    - name: Extract installed Runner version
      ansible.builtin.set_fact:
        installed_runner_version: >-
          {{
            runner_version_output.stdout
            | regex_search('Version:\s+([0-9]+\.[0-9]+\.[0-9]+)', '\1')
            | first
            | default('')
          }}


    - name: Get installed package version
      ansible.builtin.shell:
        cmd: >
          dpkg-query
          -W
          -f='${Version}'
          {{ runner_package }}
      register: installed_package
      changed_when: false


    - name: Set installed package version
      ansible.builtin.set_fact:
        installed_package_version: "{{ installed_package.stdout | trim }}"


    - name: Display installed version
      ansible.builtin.debug:
        msg:
          - "Installed Runner : {{ installed_runner_version }}"
          - "Installed Package: {{ installed_package_version }}"


    # ==========================================================
    # 3. ENSURE OFFICIAL GITLAB RUNNER REPOSITORY
    # ==========================================================

    - name: Search for GitLab Runner repository
      ansible.builtin.shell:
        cmd: |
          grep -RhsE \
            'packages\.gitlab\.com.*runner/gitlab-runner' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ \
            2>/dev/null || true
      register: gitlab_repo
      changed_when: false


    - name: Display repository detection
      ansible.builtin.debug:
        msg:
          - "GitLab Runner repository:"
          - "{{ gitlab_repo.stdout | default('NOT FOUND') }}"


    # ==========================================================
    # 4. INSTALL OFFICIAL REPOSITORY IF MISSING
    # ==========================================================

    - name: Download official GitLab Runner repository installer
      ansible.builtin.get_url:
        url: "{{ gitlab_repo_script_url }}"
        dest: "{{ gitlab_repo_script }}"
        mode: "0755"
        force: true
      when:
        - gitlab_repo.stdout | trim == ""


    - name: Install GitLab Runner repository
      ansible.builtin.command:
        cmd: "bash {{ gitlab_repo_script }}"
      register: repo_install
      when:
        - gitlab_repo.stdout | trim == ""


    - name: Remove repository installer
      ansible.builtin.file:
        path: "{{ gitlab_repo_script }}"
        state: absent


    # ==========================================================
    # 5. UPDATE APT
    # ==========================================================

    - name: Update APT metadata
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0


    # ==========================================================
    # 6. GET ACTUAL APT CANDIDATE
    # ==========================================================

    - name: Query APT candidate version
      ansible.builtin.shell:
        cmd: |
          apt-cache policy {{ runner_package }} |
          awk '/Candidate:/ {
              print $2
          }'
      register: apt_candidate
      changed_when: false


    - name: Set vendor candidate version
      ansible.builtin.set_fact:
        vendor_package_version: "{{ apt_candidate.stdout | trim }}"


    # ==========================================================
    # 7. VALIDATE CANDIDATE
    # ==========================================================

    - name: Validate vendor package version
      ansible.builtin.assert:
        that:
          - vendor_package_version != ""
          - vendor_package_version != "none"
        fail_msg:
          - "=============================================="
          - "NO VALID VENDOR PACKAGE FOUND"
          - "=============================================="
          - "Package : {{ runner_package }}"
          - "APT candidate: {{ vendor_package_version }}"
          - ""
          - "The upgrade has been aborted."
          - "=============================================="


    # ==========================================================
    # 8. DETERMINE IF UPGRADE IS REQUIRED
    # ==========================================================

    - name: Compare installed package with vendor package
      ansible.builtin.set_fact:
        upgrade_required: >-
          {{
            vendor_package_version is version(
              installed_package_version,
              '>'
            )
          }}


    - name: Display version comparison
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "VERSION CHECK"
          - "=============================================="
          - "Installed Runner : {{ installed_runner_version }}"
          - "Installed Package: {{ installed_package_version }}"
          - "Vendor Package   : {{ vendor_package_version }}"
          - "Upgrade Required  : {{ upgrade_required }}"
          - "=============================================="


    # ==========================================================
    # 9. NO UPGRADE REQUIRED
    # ==========================================================

    - name: Report no upgrade
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "NO UPGRADE REQUIRED"
          - "=============================================="
          - "Installed package : {{ installed_package_version }}"
          - "Latest APT vendor : {{ vendor_package_version }}"
          - ""
          - "The configured GitLab Runner vendor repository"
          - "does not currently provide a newer package."
          - ""
          - "NO RUNNER CHANGES WILL BE MADE."
          - "=============================================="
      when:
        - not upgrade_required


    - name: End host when current version is latest
      ansible.builtin.meta: end_host
      when:
        - not upgrade_required


    # ==========================================================
    # 10. CREATE BACKUP
    # ==========================================================

    - name: Generate backup timestamp
      ansible.builtin.set_fact:
        backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"


    - name: Set backup directory
      ansible.builtin.set_fact:
        backup_dir: "{{ backup_root }}/{{ backup_timestamp }}"


    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"


    # ==========================================================
    # 11. BACKUP RUNNER CONFIGURATION
    # ==========================================================

    - name: Check Runner configuration
      ansible.builtin.stat:
        path: /etc/gitlab-runner
      register: runner_config


    - name: Backup Runner configuration
      ansible.builtin.command:
        cmd: >
          tar
          --preserve-permissions
          --same-owner
          -czf
          {{ backup_dir }}/gitlab-runner-config.tar.gz
          /etc/gitlab-runner
      when:
        - runner_config.stat.exists


    # ==========================================================
    # 12. BACKUP DEFAULT CONFIGURATION
    # ==========================================================

    - name: Check /etc/default/gitlab-runner
      ansible.builtin.stat:
        path: /etc/default/gitlab-runner
      register: runner_default


    - name: Backup /etc/default/gitlab-runner
      ansible.builtin.copy:
        src: /etc/default/gitlab-runner
        dest: "{{ backup_dir }}/gitlab-runner-default"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - runner_default.stat.exists


    # ==========================================================
    # 13. BACKUP SYSTEMD CONFIG
    # ==========================================================

    - name: Backup systemd service
      ansible.builtin.shell:
        cmd: |
          systemctl cat {{ runner_service }} \
          > {{ backup_dir }}/systemd-service.txt 2>&1
      changed_when: false


    - name: Backup systemd status
      ansible.builtin.shell:
        cmd: |
          systemctl status {{ runner_service }} --no-pager \
          > {{ backup_dir }}/systemd-before.txt 2>&1
      changed_when: false


    # ==========================================================
    # 14. BACKUP PACKAGE INFORMATION
    # ==========================================================

    - name: Save installed package information
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='Package=${Package}\nVersion=${Version}\nArchitecture=${Architecture}\nStatus=${Status}\n' \
            {{ runner_package }} \
            > {{ backup_dir }}/package-before.txt
      changed_when: false


    - name: Save version information
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/version-before.txt"
        mode: "0600"
        content: |
          Host: {{ inventory_hostname }}
          Date: {{ ansible_date_time.iso8601 }}

          Runner version:
          {{ installed_runner_version }}

          Package version:
          {{ installed_package_version }}

          Vendor candidate:
          {{ vendor_package_version }}


    # ==========================================================
    # 15. DOWNLOAD EXACT OLD PACKAGE FOR ROLLBACK
    # ==========================================================

    - name: Download exact installed Runner package
      ansible.builtin.command:
        cmd: >
          apt-get download
          {{ runner_package }}={{ installed_package_version }}
      args:
        chdir: "{{ backup_dir }}"
      register: rollback_download
      changed_when: true
      failed_when: false


    - name: Find rollback package
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns:
          - "gitlab-runner_*.deb"
        file_type: file
      register: rollback_packages


    - name: Abort if rollback package is unavailable
      ansible.builtin.fail:
        msg:
          - "=============================================="
          - "UPGRADE ABORTED"
          - "=============================================="
          - "Newer package available : {{ vendor_package_version }}"
          - "Current package         : {{ installed_package_version }}"
          - ""
          - "The exact current package could not be"
          - "downloaded for automatic rollback."
          - ""
          - "For production safety, the Runner was"
          - "NOT upgraded."
          - "=============================================="
      when:
        - rollback_packages.files | length == 0


    # ==========================================================
    # 16. SAVE RUNNER REGISTRATION STATUS
    # ==========================================================

    - name: Verify Runner before upgrade
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: verify_before
      changed_when: false
      failed_when: false


    - name: Save pre-upgrade verification
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/verify-before.txt"
        mode: "0600"
        content: |
          Return code:
          {{ verify_before.rc }}

          STDOUT:
          {{ verify_before.stdout }}

          STDERR:
          {{ verify_before.stderr }}


    # ==========================================================
    # 17. UPGRADE TO LATEST VENDOR PACKAGE
    # ==========================================================

    - name: Upgrade GitLab Runner to latest vendor package
      ansible.builtin.apt:
        name: "{{ runner_package }}={{ vendor_package_version }}"
        state: present
        update_cache: true
      register: runner_upgrade


    # ==========================================================
    # 18. RELOAD SYSTEMD
    # ==========================================================

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true


    # ==========================================================
    # 19. RESTART RUNNER
    # ==========================================================

    - name: Restart GitLab Runner
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: restarted
        enabled: true


    # ==========================================================
    # 20. WAIT FOR SERVICE
    # ==========================================================

    - name: Wait for GitLab Runner service
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: service_health
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
      until: service_health.rc == 0
      changed_when: false
      failed_when: false


    # ==========================================================
    # 21. CHECK VERSION
    # ==========================================================

    - name: Check upgraded version
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: upgraded_version
      changed_when: false
      failed_when: false


    # ==========================================================
    # 22. VERIFY RUNNER
    # ==========================================================

    - name: Verify Runner after upgrade
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: verify_after
      changed_when: false
      failed_when: false


    # ==========================================================
    # 23. CHECK PACKAGE VERSION
    # ==========================================================

    - name: Get final package version
      ansible.builtin.shell:
        cmd: >
          dpkg-query
          -W
          -f='${Version}'
          {{ runner_package }}
      register: final_package
      changed_when: false


    # ==========================================================
    # 24. DETERMINE HEALTH
    # ==========================================================

    - name: Determine Runner health
      ansible.builtin.set_fact:
        runner_healthy: >-
          {{
            service_health.rc == 0
            and upgraded_version.rc == 0
            and verify_after.rc == 0
            and (
              final_package.stdout | trim
            ) is version(
              installed_package_version,
              '>'
            )
          }}


    # ==========================================================
    # 25. SAVE POST-UPGRADE STATE
    # ==========================================================

    - name: Save post-upgrade version
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/version-after.txt"
        mode: "0600"
        content: |
          Runner:
          {{ upgraded_version.stdout }}

          Package:
          {{ final_package.stdout }}


    - name: Save post-upgrade service status
      ansible.builtin.shell:
        cmd: |
          systemctl status {{ runner_service }} --no-pager \
          > {{ backup_dir }}/systemd-after.txt 2>&1
      changed_when: false


    - name: Save post-upgrade verification
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/verify-after.txt"
        mode: "0600"
        content: |
          Return code:
          {{ verify_after.rc }}

          STDOUT:
          {{ verify_after.stdout }}

          STDERR:
          {{ verify_after.stderr }}


    # ==========================================================
    # 26. AUTOMATIC ROLLBACK
    # ==========================================================

    - name: Stop Runner for rollback
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: stopped
      when:
        - not runner_healthy


    - name: Restore previous Runner package
      ansible.builtin.apt:
        deb: "{{ rollback_packages.files[0].path }}"
        state: present
        force: true
      when:
        - not runner_healthy


    - name: Restore Runner configuration
      ansible.builtin.command:
        cmd: >
          tar
          --preserve-permissions
          --same-owner
          -xzf
          {{ backup_dir }}/gitlab-runner-config.tar.gz
          -C /
      when:
        - not runner_healthy
        - runner_config.stat.exists


    - name: Restore default Runner configuration
      ansible.builtin.copy:
        src: "{{ backup_dir }}/gitlab-runner-default"
        dest: /etc/default/gitlab-runner
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when:
        - not runner_healthy
        - runner_default.stat.exists


    - name: Reload systemd after rollback
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - not runner_healthy


    - name: Start Runner after rollback
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: started
        enabled: true
      when:
        - not runner_healthy


    # ==========================================================
    # 27. VERIFY ROLLBACK
    # ==========================================================

    - name: Check Runner after rollback
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: rollback_version
      changed_when: false
      failed_when: false
      when:
        - not runner_healthy


    - name: Check service after rollback
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: rollback_service
      changed_when: false
      failed_when: false
      when:
        - not runner_healthy


    - name: Verify Runner after rollback
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: rollback_verify
      changed_when: false
      failed_when: false
      when:
        - not runner_healthy


    # ==========================================================
    # 28. ROLLBACK REPORT
    # ==========================================================

    - name: Save rollback report
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/ROLLBACK-REPORT.txt"
        mode: "0600"
        content: |
          ==============================================
          GITLAB RUNNER AUTOMATIC ROLLBACK
          ==============================================

          Host:
          {{ inventory_hostname }}

          Previous package:
          {{ installed_package_version }}

          Attempted package:
          {{ vendor_package_version }}

          Current Runner:
          {{ rollback_version.stdout | default('UNKNOWN') }}

          Service:
          {{ rollback_service.stdout | default('UNKNOWN') }}

          Verify RC:
          {{ rollback_verify.rc | default('UNKNOWN') }}

          ==============================================

      when:
        - not runner_healthy


    # ==========================================================
    # 29. FAIL PLAY IF ROLLBACK OCCURRED
    # ==========================================================

    - name: Fail upgrade after automatic rollback
      ansible.builtin.fail:
        msg:
          - "=============================================="
          - "UPGRADE FAILED - ROLLBACK COMPLETED"
          - "=============================================="
          - "Host             : {{ inventory_hostname }}"
          - "Previous version : {{ installed_package_version }}"
          - "Attempted version: {{ vendor_package_version }}"
          - "Backup           : {{ backup_dir }}"
          - ""
          - "GitLab Runner was automatically rolled back."
          - "=============================================="
      when:
        - not runner_healthy


    # ==========================================================
    # 30. FINAL SUCCESS
    # ==========================================================

    - name: Final Runner service check
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: final_service
      changed_when: false


    - name: Final Runner verification
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: final_verify
      changed_when: false


    - name: Display successful upgrade
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "GITLAB RUNNER UPGRADE SUCCESSFUL"
          - "=============================================="
          - "Host              : {{ inventory_hostname }}"
          - "Previous package  : {{ installed_package_version }}"
          - "New package       : {{ final_package.stdout }}"
          - "Service           : {{ final_service.stdout }}"
          - "Verify RC         : {{ final_verify.rc }}"
          - "Backup directory  : {{ backup_dir }}"
          - ""
          - "Latest vendor package installed successfully."
          - "Configuration backup retained."
          - "Rollback package retained."
          - "=============================================="
          
