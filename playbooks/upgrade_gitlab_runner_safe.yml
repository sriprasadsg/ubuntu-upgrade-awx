---
- name: Production Safe GitLab Runner Automatic Upgrade
  hosts: all
  become: true
  gather_facts: true

  vars:

    # ==========================================================
    # GitLab Runner
    # ==========================================================

    runner_package: "gitlab-runner"
    helper_package: "gitlab-runner-helper-images"
    runner_service: "gitlab-runner"

    # Official GitLab Runner repository
    gitlab_repo_script_url: >-
      https://packages.gitlab.com/install/repositories/
      runner/gitlab-runner/script.deb.sh

    gitlab_repo_script: "/tmp/gitlab-runner-repo.sh"

    # Official GitLab Runner latest release index
    gitlab_latest_index_url: >-
      https://s3.dualstack.us-east-1.amazonaws.com/
      gitlab-runner-downloads/latest/index.html

    # Official latest DEB location
    gitlab_latest_deb_base: >-
      https://s3.dualstack.us-east-1.amazonaws.com/
      gitlab-runner-downloads/latest/deb

    # Backup
    backup_root: "/var/backups/gitlab-runner"

    # Health check
    health_retries: 12
    health_delay: 5


  tasks:

    # ==========================================================
    # 1. SYSTEM INFORMATION
    # ==========================================================

    - name: Display system information
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "GITLAB RUNNER AUTOMATIC UPGRADE"
          - "=============================================="
          - "Host : {{ inventory_hostname }}"
          - "OS   : {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Arch : {{ ansible_architecture }}"
          - "=============================================="


    - name: Verify Debian based operating system
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg:
          - "This playbook supports Debian/Ubuntu systems only."


    # ==========================================================
    # 2. DETERMINE ARCHITECTURE
    # ==========================================================

    - name: Get Debian architecture
      ansible.builtin.command:
        cmd: dpkg --print-architecture
      register: deb_arch
      changed_when: false


    - name: Set Runner package architecture
      ansible.builtin.set_fact:
        runner_arch: "{{ deb_arch.stdout | trim }}"


    - name: Validate architecture
      ansible.builtin.assert:
        that:
          - runner_arch in
            [
              "amd64",
              "arm64",
              "armhf",
              "i386",
              "ppc64el",
              "s390x"
            ]
        fail_msg:
          - "Unsupported Debian architecture."
          - "Detected: {{ runner_arch }}"


    # ==========================================================
    # 3. DETECT INSTALLED RUNNER
    # ==========================================================

    - name: Get installed Runner version
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: runner_version_output
      changed_when: false
      failed_when: false


    - name: Verify Runner installation
      ansible.builtin.assert:
        that:
          - runner_version_output.rc == 0
        fail_msg:
          - "GitLab Runner is not installed or executable."


    - name: Extract installed Runner semantic version
      ansible.builtin.set_fact:
        installed_runner_version: >-
          {{
            (
              runner_version_output.stdout
              | regex_search(
                  'Version:\s*([0-9]+\.[0-9]+\.[0-9]+)',
                  '\1'
                )
              | default([])
            )
            | first
            | default('')
          }}


    - name: Get installed package version
      ansible.builtin.shell:
        cmd: >
          dpkg-query
          -W
          -f='${Version}'
          {{ runner_package }}
      register: installed_package_query
      changed_when: false


    - name: Set installed package version
      ansible.builtin.set_fact:
        installed_package_version: "{{ installed_package_query.stdout | trim }}"


    - name: Display installed version
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "INSTALLED VERSION"
          - "=============================================="
          - "Runner binary  : {{ installed_runner_version }}"
          - "APT package    : {{ installed_package_version }}"
          - "Architecture   : {{ runner_arch }}"
          - "=============================================="


    # ==========================================================
    # 4. CHECK OFFICIAL GITLAB APT REPOSITORY
    # ==========================================================

    - name: Detect GitLab Runner APT repository
      ansible.builtin.shell:
        cmd: |
          grep -RhsE \
            'packages\.gitlab\.com.*runner/gitlab-runner' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ \
            2>/dev/null || true
      register: gitlab_repo_detect
      changed_when: false


    - name: Install official GitLab Runner repository
      when:
        - gitlab_repo_detect.stdout | trim == ""
      block:

        - name: Download GitLab repository installer
          ansible.builtin.get_url:
            url: "{{ gitlab_repo_script_url }}"
            dest: "{{ gitlab_repo_script }}"
            mode: "0755"
            timeout: 60

        - name: Install GitLab Runner repository
          ansible.builtin.command:
            cmd: "bash {{ gitlab_repo_script }}"

        - name: Remove repository installer
          ansible.builtin.file:
            path: "{{ gitlab_repo_script }}"
            state: absent


    # ==========================================================
    # 5. UPDATE APT
    # ==========================================================

    - name: Update APT metadata
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0


    # ==========================================================
    # 6. GET APT CANDIDATE
    # ==========================================================

    - name: Get APT candidate version
      ansible.builtin.shell:
        cmd: |
          apt-cache policy {{ runner_package }} |
          awk '/Candidate:/ {
            print $2
          }'
      register: apt_candidate_result
      changed_when: false


    - name: Set APT candidate version
      ansible.builtin.set_fact:
        apt_candidate_version: "{{ apt_candidate_result.stdout | trim }}"


    - name: Check whether APT has newer version
      ansible.builtin.set_fact:
        apt_upgrade_available: >-
          {{
            apt_candidate_version not in ['', 'none']
            and
            apt_candidate_version is version(
              installed_package_version,
              '>'
            )
          }}


    - name: Display APT status
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "APT VERSION CHECK"
          - "=============================================="
          - "Installed : {{ installed_package_version }}"
          - "Candidate : {{ apt_candidate_version }}"
          - "Newer    : {{ apt_upgrade_available }}"
          - "=============================================="


    # ==========================================================
    # 7. QUERY OFFICIAL GITLAB LATEST RELEASE
    # ==========================================================

    - name: Query official GitLab Runner latest index
      ansible.builtin.uri:
        url: "{{ gitlab_latest_index_url }}"
        method: GET
        return_content: true
        status_code: 200
        timeout: 60
        validate_certs: true
      register: gitlab_latest_index
      changed_when: false
      failed_when: false


    - name: Verify GitLab latest index response
      ansible.builtin.assert:
        that:
          - gitlab_latest_index.status == 200
          - gitlab_latest_index.content | length > 0
        fail_msg:
          - "Unable to access official GitLab Runner release index."
          - "URL: {{ gitlab_latest_index_url }}"
          - "No upgrade will be attempted."


    # ==========================================================
    # 8. EXTRACT VERSION FROM HTML TITLE
    # ==========================================================

    - name: Extract official latest version
      ansible.builtin.set_fact:
        official_latest_version: >-
          {{
            (
              gitlab_latest_index.content
              | regex_search(
                  '<title>\s*GitLab Runner\s*::\s*([0-9]+\.[0-9]+\.[0-9]+)',
                  '\1',
                  multiline=true
                )
              | default([])
            )
            | first
            | default('')
          }}


    - name: Display official GitLab version
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "OFFICIAL GITLAB RELEASE"
          - "=============================================="
          - "GitLab latest : {{ official_latest_version }}"
          - "Installed     : {{ installed_runner_version }}"
          - "=============================================="


    # ==========================================================
    # 9. VALIDATE OFFICIAL VERSION
    # ==========================================================

    - name: Validate official release version
      ansible.builtin.assert:
        that:
          - official_latest_version != ""
        fail_msg:
          - "Could not determine latest GitLab Runner version."
          - "The official index format may have changed."
          - "No upgrade will be attempted."


    # ==========================================================
    # 10. DETERMINE WHETHER OFFICIAL RELEASE IS NEWER
    # ==========================================================

    - name: Compare official version
      ansible.builtin.set_fact:
        official_upgrade_available: >-
          {{
            official_latest_version is version(
              installed_runner_version,
              '>'
            )
          }}


    # ==========================================================
    # 11. SELECT UPGRADE METHOD
    # ==========================================================

    - name: Select APT upgrade
      ansible.builtin.set_fact:
        upgrade_method: "APT"
        target_version: "{{ apt_candidate_version }}"
      when:
        - apt_upgrade_available


    - name: Select official DEB fallback
      ansible.builtin.set_fact:
        upgrade_method: "OFFICIAL-DEB"
        target_version: "{{ official_latest_version }}"
      when:
        - not apt_upgrade_available
        - official_upgrade_available


    - name: Determine final upgrade requirement
      ansible.builtin.set_fact:
        upgrade_required: >-
          {{
            (
              apt_upgrade_available
              or
              official_upgrade_available
            )
          }}


    - name: Display final upgrade decision
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "FINAL UPGRADE DECISION"
          - "=============================================="
          - "Installed version : {{ installed_runner_version }}"
          - "Installed package : {{ installed_package_version }}"
          - "APT candidate     : {{ apt_candidate_version }}"
          - "Official latest   : {{ official_latest_version }}"
          - "Upgrade required  : {{ upgrade_required }}"
          - "Method            : {{ upgrade_method | default('NONE') }}"
          - "Target            : {{ target_version | default('NONE') }}"
          - "=============================================="


    # ==========================================================
    # 12. NO UPGRADE
    # ==========================================================

    - name: Report no upgrade
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "NO UPGRADE REQUIRED"
          - "=============================================="
          - "Installed version : {{ installed_runner_version }}"
          - "Installed package : {{ installed_package_version }}"
          - "Official latest   : {{ official_latest_version }}"
          - ""
          - "The official GitLab Runner release is not"
          - "newer than the installed version."
          - ""
          - "NO RUNNER CHANGES WILL BE MADE."
          - "=============================================="
      when:
        - not upgrade_required


    - name: End host when no upgrade required
      ansible.builtin.meta: end_host
      when:
        - not upgrade_required


    # ==========================================================
    # 13. CREATE BACKUP
    # ==========================================================

    - name: Create backup timestamp
      ansible.builtin.set_fact:
        backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"


    - name: Set backup directory
      ansible.builtin.set_fact:
        backup_dir: "{{ backup_root }}/{{ backup_timestamp }}"


    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"


    # ==========================================================
    # 14. BACKUP CONFIGURATION
    # ==========================================================

    - name: Backup Runner configuration
      ansible.builtin.command:
        cmd: >
          tar
          --preserve-permissions
          --same-owner
          -czf
          {{ backup_dir }}/gitlab-runner-config.tar.gz
          /etc/gitlab-runner


    - name: Check default Runner configuration
      ansible.builtin.stat:
        path: /etc/default/gitlab-runner
      register: default_runner_config


    - name: Backup default Runner configuration
      ansible.builtin.copy:
        src: /etc/default/gitlab-runner
        dest: "{{ backup_dir }}/gitlab-runner-default"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - default_runner_config.stat.exists


    - name: Backup systemd service
      ansible.builtin.shell:
        cmd: |
          systemctl cat {{ runner_service }} \
          > {{ backup_dir }}/systemd-service-before.txt 2>&1
      changed_when: false


    - name: Backup systemd status
      ansible.builtin.shell:
        cmd: |
          systemctl status {{ runner_service }} --no-pager -l \
          > {{ backup_dir }}/systemd-status-before.txt 2>&1
      changed_when: false


    # ==========================================================
    # 15. BACKUP PACKAGE INFORMATION
    # ==========================================================

    - name: Save package information
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='Package=${Package}\nVersion=${Version}\nArchitecture=${Architecture}\nStatus=${Status}\n' \
            {{ runner_package }} \
            > {{ backup_dir }}/package-before.txt
      changed_when: false


    - name: Save helper package information
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W \
            -f='Package=${Package}\nVersion=${Version}\nArchitecture=${Architecture}\nStatus=${Status}\n' \
            {{ helper_package }} \
            > {{ backup_dir }}/helper-package-before.txt 2>&1
      changed_when: false
      failed_when: false


    - name: Save Runner version
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/version-before.txt"
        mode: "0600"
        content: |
          Host: {{ inventory_hostname }}
          Date: {{ ansible_date_time.iso8601 }}

          Runner:
          {{ runner_version_output.stdout }}

          Installed package:
          {{ installed_package_version }}

          APT candidate:
          {{ apt_candidate_version }}

          Official latest:
          {{ official_latest_version }}

          Upgrade method:
          {{ upgrade_method }}

          Target:
          {{ target_version }}


    # ==========================================================
    # 16. CREATE ROLLBACK PACKAGE
    # ==========================================================

    - name: Try to download exact installed Runner package
      ansible.builtin.command:
        cmd: >
          apt-get download
          {{ runner_package }}={{ installed_package_version }}
      args:
        chdir: "{{ backup_dir }}"
      register: rollback_runner_download
      changed_when: true
      failed_when: false


    - name: Try to download installed helper package
      ansible.builtin.shell:
        cmd: |
          helper_version="$(
            dpkg-query -W -f='${Version}' {{ helper_package }} 2>/dev/null
          )"

          if [ -n "$helper_version" ]; then
            apt-get download \
              {{ helper_package }}="$helper_version"
          fi
      args:
        chdir: "{{ backup_dir }}"
      register: rollback_helper_download
      changed_when: true
      failed_when: false


    - name: Find rollback packages
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns:
          - "gitlab-runner_*.deb"
        file_type: file
      register: rollback_runner_packages


    # ==========================================================
    # 17. PRODUCTION SAFETY GATE
    # ==========================================================

    - name: Abort when exact rollback package unavailable
      ansible.builtin.fail:
        msg:
          - "=============================================="
          - "UPGRADE ABORTED - ROLLBACK NOT GUARANTEED"
          - "=============================================="
          - "Host             : {{ inventory_hostname }}"
          - "Current version  : {{ installed_package_version }}"
          - "Target version   : {{ target_version }}"
          - ""
          - "The exact currently installed Runner package"
          - "could not be downloaded from the configured"
          - "APT repositories."
          - ""
          - "For production safety the Runner was NOT"
          - "upgraded."
          - ""
          - "Backup directory:"
          - "{{ backup_dir }}"
          - "=============================================="
      when:
        - rollback_runner_packages.files | length == 0


    # ==========================================================
    # 18. VERIFY BEFORE UPGRADE
    # ==========================================================

    - name: Verify Runner before upgrade
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: verify_before
      changed_when: false
      failed_when: false


    - name: Save pre-upgrade verification
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/verify-before.txt"
        mode: "0600"
        content: |
          Return code:
          {{ verify_before.rc }}

          STDOUT:
          {{ verify_before.stdout }}

          STDERR:
          {{ verify_before.stderr }}


    # ==========================================================
    # 19. APT UPGRADE
    # ==========================================================

    - name: Upgrade Runner using official APT repository
      ansible.builtin.apt:
        name:
          - "{{ runner_package }}"
          - "{{ helper_package }}"
        state: latest
        update_cache: true
      register: apt_upgrade_result
      when:
        - upgrade_method == "APT"


    # ==========================================================
    # 20. OFFICIAL LATEST DEB FALLBACK
    # ==========================================================

    - name: Create official DEB download directory
      ansible.builtin.file:
        path: "{{ backup_dir }}/latest-deb"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when:
        - upgrade_method == "OFFICIAL-DEB"


    - name: Download official latest Runner DEB
      ansible.builtin.get_url:
        url: >-
          {{ gitlab_latest_deb_base }}/
          gitlab-runner_{{ runner_arch }}.deb
        dest: >-
          {{ backup_dir }}/latest-deb/
          gitlab-runner_{{ runner_arch }}.deb
        mode: "0644"
        timeout: 180
        validate_certs: true
      when:
        - upgrade_method == "OFFICIAL-DEB"


    - name: Download official latest helper images DEB
      ansible.builtin.get_url:
        url: >-
          {{ gitlab_latest_deb_base }}/
          gitlab-runner-helper-images.deb
        dest: >-
          {{ backup_dir }}/latest-deb/
          gitlab-runner-helper-images.deb
        mode: "0644"
        timeout: 180
        validate_certs: true
      when:
        - upgrade_method == "OFFICIAL-DEB"


    # ==========================================================
    # 21. DETERMINE ACTUAL DOWNLOADED VERSION
    # ==========================================================

    - name: Read downloaded Runner package version
      ansible.builtin.command:
        cmd: >
          dpkg-deb
          -f
          {{ backup_dir }}/latest-deb/gitlab-runner_{{ runner_arch }}.deb
          Version
      register: downloaded_runner_version
      changed_when: false
      when:
        - upgrade_method == "OFFICIAL-DEB"


    - name: Display downloaded version
      ansible.builtin.debug:
        msg:
          - "Downloaded official Runner package:"
          - "{{ downloaded_runner_version.stdout | default('N/A') }}"
      when:
        - upgrade_method == "OFFICIAL-DEB"


    - name: Validate downloaded version
      ansible.builtin.assert:
        that:
          - downloaded_runner_version.stdout | trim is version(
              installed_package_version,
              '>'
            )
      when:
        - upgrade_method == "OFFICIAL-DEB"
      fail_msg:
        - "Downloaded official package is not newer."
        - "Installed: {{ installed_package_version }}"
        - "Downloaded: {{ downloaded_runner_version.stdout | trim }}"


    # ==========================================================
    # 22. INSTALL OFFICIAL DEB
    # ==========================================================

    - name: Install latest Runner and helper packages
      ansible.builtin.apt:
        deb:
          - "{{ backup_dir }}/latest-deb/gitlab-runner-helper-images.deb"
          - "{{ backup_dir }}/latest-deb/gitlab-runner_{{ runner_arch }}.deb"
        state: present
      register: deb_upgrade_result
      when:
        - upgrade_method == "OFFICIAL-DEB"


    # ==========================================================
    # 23. RELOAD SYSTEMD
    # ==========================================================

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true


    # ==========================================================
    # 24. RESTART RUNNER
    # ==========================================================

    - name: Restart GitLab Runner
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: restarted
        enabled: true


    # ==========================================================
    # 25. WAIT FOR SERVICE
    # ==========================================================

    - name: Wait for Runner service
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: service_health
      retries: "{{ health_retries }}"
      delay: "{{ health_delay }}"
      until: service_health.rc == 0
      changed_when: false
      failed_when: false


    # ==========================================================
    # 26. CHECK RUNNER VERSION
    # ==========================================================

    - name: Get upgraded Runner version
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: upgraded_runner
      changed_when: false
      failed_when: false


    # ==========================================================
    # 27. RUNNER VERIFY
    # ==========================================================

    - name: Verify Runner after upgrade
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: verify_after
      changed_when: false
      failed_when: false


    # ==========================================================
    # 28. GET FINAL PACKAGE
    # ==========================================================

    - name: Get final Runner package version
      ansible.builtin.shell:
        cmd: >
          dpkg-query
          -W
          -f='${Version}'
          {{ runner_package }}
      register: final_package
      changed_when: false


    - name: Get final helper package version
      ansible.builtin.shell:
        cmd: >
          dpkg-query
          -W
          -f='${Version}'
          {{ helper_package }}
      register: final_helper_package
      changed_when: false
      failed_when: false


    # ==========================================================
    # 29. HEALTH DECISION
    # ==========================================================

    - name: Determine Runner health
      ansible.builtin.set_fact:
        runner_healthy: >-
          {{
            service_health.rc == 0
            and
            upgraded_runner.rc == 0
            and
            verify_after.rc == 0
            and
            (
              final_package.stdout | trim
            ) is version(
              installed_package_version,
              '>'
            )
          }}


    - name: Save post-upgrade state
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/version-after.txt"
        mode: "0600"
        content: |
          Runner:
          {{ upgraded_runner.stdout }}

          Runner package:
          {{ final_package.stdout }}

          Helper package:
          {{ final_helper_package.stdout | default('N/A') }}

          Service:
          {{ service_health.stdout }}

          Verify RC:
          {{ verify_after.rc }}


    # ==========================================================
    # 30. AUTOMATIC ROLLBACK
    # ==========================================================

    - name: Stop Runner before rollback
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: stopped
      when:
        - not runner_healthy


    - name: Restore old Runner package
      ansible.builtin.apt:
        deb: "{{ rollback_runner_packages.files[0].path }}"
        state: present
        force: true
      when:
        - not runner_healthy


    - name: Restore Runner configuration
      ansible.builtin.command:
        cmd: >
          tar
          --preserve-permissions
          --same-owner
          -xzf
          {{ backup_dir }}/gitlab-runner-config.tar.gz
          -C /
      when:
        - not runner_healthy


    - name: Restore default Runner configuration
      ansible.builtin.copy:
        src: "{{ backup_dir }}/gitlab-runner-default"
        dest: /etc/default/gitlab-runner
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when:
        - not runner_healthy
        - default_runner_config.stat.exists


    - name: Reload systemd after rollback
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - not runner_healthy


    - name: Start Runner after rollback
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: started
        enabled: true
      when:
        - not runner_healthy


    # ==========================================================
    # 31. VERIFY ROLLBACK
    # ==========================================================

    - name: Verify rollback service
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: rollback_service
      changed_when: false
      failed_when: false
      when:
        - not runner_healthy


    - name: Verify rollback Runner
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: rollback_verify
      changed_when: false
      failed_when: false
      when:
        - not runner_healthy


    - name: Get rollback version
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: rollback_version
      changed_when: false
      failed_when: false
      when:
        - not runner_healthy


    - name: Save rollback report
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/ROLLBACK-REPORT.txt"
        mode: "0600"
        content: |
          ==============================================
          GITLAB RUNNER AUTOMATIC ROLLBACK
          ==============================================

          Host:
          {{ inventory_hostname }}

          Previous package:
          {{ installed_package_version }}

          Attempted target:
          {{ target_version }}

          Current Runner after rollback:
          {{ rollback_version.stdout | default('UNKNOWN') }}

          Service:
          {{ rollback_service.stdout | default('UNKNOWN') }}

          Verify return code:
          {{ rollback_verify.rc | default('UNKNOWN') }}

          Backup:
          {{ backup_dir }}

          ==============================================

      when:
        - not runner_healthy


    # ==========================================================
    # 32. FAIL SAFELY
    # ==========================================================

    - name: Fail upgrade after rollback
      ansible.builtin.fail:
        msg:
          - "=============================================="
          - "UPGRADE FAILED - ROLLBACK COMPLETED"
          - "=============================================="
          - "Host             : {{ inventory_hostname }}"
          - "Previous package : {{ installed_package_version }}"
          - "Attempted target : {{ target_version }}"
          - "Backup           : {{ backup_dir }}"
          - ""
          - "GitLab Runner was automatically rolled back."
          - "=============================================="
      when:
        - not runner_healthy


    # ==========================================================
    # 33. FINAL SUCCESS
    # ==========================================================

    - name: Final service check
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: final_service
      changed_when: false


    - name: Final Runner verification
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: final_verify
      changed_when: false


    - name: Display successful upgrade
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "GITLAB RUNNER UPGRADE SUCCESSFUL"
          - "=============================================="
          - "Host             : {{ inventory_hostname }}"
          - "Previous package : {{ installed_package_version }}"
          - "New package      : {{ final_package.stdout }}"
          - "Helper package   : {{ final_helper_package.stdout | default('N/A') }}"
          - "Upgrade method   : {{ upgrade_method }}"
          - "Service          : {{ final_service.stdout }}"
          - "Verify RC        : {{ final_verify.rc }}"
          - "Backup directory : {{ backup_dir }}"
          - "=============================================="
