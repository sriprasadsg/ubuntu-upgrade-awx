---
- name: Production Safe GitLab Runner Vendor Upgrade
  hosts: all
  become: true
  gather_facts: true

  vars:

    # ==========================================================
    # GitLab Runner configuration
    # ==========================================================

    runner_package: "gitlab-runner"
    runner_service: "gitlab-runner"

    gitlab_repo_script_url: "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh"
    gitlab_repo_script: "/tmp/gitlab-runner-repo.sh"

    # ==========================================================
    # Backup configuration
    # ==========================================================

    backup_root: "/var/backups/gitlab-runner"

    # ==========================================================
    # Health check configuration
    # ==========================================================

    health_check_retries: 6
    health_check_delay: 5

  pre_tasks:

    # ==========================================================
    # 1. Validate OS
    # ==========================================================

    - name: Validate Debian family operating system
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >
          Unsupported operating system.
          This playbook supports Ubuntu/Debian systems.

    - name: Display target information
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "GITLAB RUNNER TARGET"
          - "=============================================="
          - "Hostname       : {{ inventory_hostname }}"
          - "OS             : {{ ansible_distribution }}"
          - "OS Version     : {{ ansible_distribution_version }}"
          - "Architecture   : {{ ansible_architecture }}"
          - "Kernel         : {{ ansible_kernel }}"
          - "=============================================="


    # ==========================================================
    # 2. Detect installed Runner
    # ==========================================================

    - name: Detect installed GitLab Runner
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: runner_version_raw
      changed_when: false
      failed_when: false

    - name: Verify GitLab Runner is installed
      ansible.builtin.assert:
        that:
          - runner_version_raw.rc == 0
        fail_msg: >
          GitLab Runner is not installed or
          gitlab-runner command is unavailable.

    - name: Extract installed Runner version
      ansible.builtin.set_fact:
        installed_runner_version: >-
          {{
            runner_version_raw.stdout
            | regex_search(
                'Version:\s+([0-9]+\.[0-9]+\.[0-9]+)',
                '\1'
              )
            | default([], true)
            | first
            | default('unknown')
          }}

    - name: Get installed package information
      ansible.builtin.shell:
        cmd: >
          dpkg-query -W
          -f='${Package}|${Version}|${Architecture}'
          {{ runner_package }}
      register: installed_package_info
      changed_when: false
      failed_when: false

    - name: Extract installed package version
      ansible.builtin.set_fact:
        installed_package_version: >-
          {{
            installed_package_info.stdout.split('|')[1]
            if '|' in installed_package_info.stdout
            else 'unknown'
          }}

    - name: Display installed version
      ansible.builtin.debug:
        msg:
          - "Installed Runner version : {{ installed_runner_version }}"
          - "Installed package       : {{ installed_package_version }}"


    # ==========================================================
    # 3. Check GitLab Runner repository
    # ==========================================================

    - name: Detect official GitLab Runner repository
      ansible.builtin.shell:
        cmd: |
          grep -RhsE \
            '^[[:space:]]*deb .*packages\.gitlab\.com.*runner/gitlab-runner' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ \
            2>/dev/null || true
      register: gitlab_repo_detect
      changed_when: false

    - name: Display repository status
      ansible.builtin.debug:
        msg:
          - "GitLab Runner repository detected:"
          - "{{ gitlab_repo_detect.stdout | default('NONE') }}"


    # ==========================================================
    # 4. Configure official vendor repository if missing
    # ==========================================================

    - name: Download official GitLab Runner repository installer
      ansible.builtin.get_url:
        url: "{{ gitlab_repo_script_url }}"
        dest: "{{ gitlab_repo_script }}"
        mode: "0755"
      when:
        - gitlab_repo_detect.stdout | trim == ""

    - name: Install official GitLab Runner repository
      ansible.builtin.command:
        cmd: "bash {{ gitlab_repo_script }}"
      when:
        - gitlab_repo_detect.stdout | trim == ""

    - name: Remove repository installer
      ansible.builtin.file:
        path: "{{ gitlab_repo_script }}"
        state: absent


    # ==========================================================
    # 5. Refresh APT
    # ==========================================================

    - name: Update APT package metadata
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0


    # ==========================================================
    # 6. Detect vendor packages
    # ==========================================================

    - name: Query GitLab Runner vendor packages
      ansible.builtin.shell:
        cmd: |
          apt-cache madison {{ runner_package }} |
          awk '{print $3}' |
          grep -E '^[0-9]+\.[0-9]+\.[0-9]+' |
          sort -V
      register: vendor_package_versions
      changed_when: false

    - name: Determine latest vendor package
      ansible.builtin.set_fact:
        latest_vendor_package_version: >-
          {{
            vendor_package_versions.stdout_lines
            | select('match', '^[0-9]+\.[0-9]+\.[0-9]+')
            | list
            | last
            | default('')
          }}

    - name: Validate vendor package availability
      ansible.builtin.assert:
        that:
          - latest_vendor_package_version | length > 0
        fail_msg:
          - "=============================================="
          - "VENDOR PACKAGE NOT AVAILABLE"
          - "=============================================="
          - "GitLab Runner package was not found in APT."
          - "The upgrade has been ABORTED."
          - "No changes will be made."
          - "=============================================="


    # ==========================================================
    # 7. Convert vendor version to semantic version
    # ==========================================================

    - name: Extract vendor semantic version
      ansible.builtin.set_fact:
        latest_vendor_version: >-
          {{
            latest_vendor_package_version
            | regex_replace('-.*$', '')
          }}


    # ==========================================================
    # 8. Compare installed vs vendor
    # ==========================================================

    - name: Determine whether upgrade is required
      ansible.builtin.set_fact:
        upgrade_required: >-
          {{
            latest_vendor_version is version(
              installed_runner_version,
              '>'
            )
          }}

    - name: Display version comparison
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "GITLAB RUNNER VERSION CHECK"
          - "=============================================="
          - "Installed version : {{ installed_runner_version }}"
          - "Installed package : {{ installed_package_version }}"
          - "Vendor version    : {{ latest_vendor_version }}"
          - "Upgrade required  : {{ upgrade_required }}"
          - "=============================================="


    # ==========================================================
    # 9. Stop if no upgrade exists
    # ==========================================================

    - name: Report vendor update unavailable
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "NO NEWER VENDOR UPDATE AVAILABLE"
          - "=============================================="
          - "Installed Runner : {{ installed_runner_version }}"
          - "Vendor Runner    : {{ latest_vendor_version }}"
          - ""
          - "No newer version is currently available"
          - "from the configured GitLab Runner vendor"
          - "APT repository."
          - ""
          - "NO SYSTEM CHANGES WILL BE PERFORMED."
          - "=============================================="
      when:
        - not upgrade_required

    - name: Stop host when no upgrade is required
      ansible.builtin.meta: end_host
      when:
        - not upgrade_required


    # ==========================================================
    # 10. Create backup directory
    # ==========================================================

    - name: Generate backup timestamp
      ansible.builtin.set_fact:
        backup_timestamp: >-
          {{ ansible_date_time.year }}
          {{ ansible_date_time.month }}
          {{ ansible_date_time.day }}_
          {{ ansible_date_time.hour }}
          {{ ansible_date_time.minute }}
          {{ ansible_date_time.second }}

    - name: Define backup directory
      ansible.builtin.set_fact:
        backup_dir: "{{ backup_root }}/{{ backup_timestamp }}"

    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"


    # ==========================================================
    # 11. Record current state
    # ==========================================================

    - name: Save current Runner version
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/version.txt"
        mode: "0600"
        content: |
          Hostname:
          {{ inventory_hostname }}

          Backup time:
          {{ ansible_date_time.iso8601 }}

          Runner version:
          {{ installed_runner_version }}

          Package version:
          {{ installed_package_version }}

          OS:
          {{ ansible_distribution }} {{ ansible_distribution_version }}

          Architecture:
          {{ ansible_architecture }}

          Kernel:
          {{ ansible_kernel }}


    # ==========================================================
    # 12. Backup Runner configuration
    # ==========================================================

    - name: Check Runner configuration directory
      ansible.builtin.stat:
        path: /etc/gitlab-runner
      register: runner_config_stat

    - name: Backup Runner configuration
      ansible.builtin.command:
        cmd: >
          tar
          --preserve-permissions
          --same-owner
          -czf
          {{ backup_dir }}/gitlab-runner-config.tar.gz
          /etc/gitlab-runner
      when:
        - runner_config_stat.stat.exists


    # ==========================================================
    # 13. Backup /etc/default/gitlab-runner
    # ==========================================================

    - name: Check Runner default configuration
      ansible.builtin.stat:
        path: /etc/default/gitlab-runner
      register: runner_default_stat

    - name: Backup Runner default configuration
      ansible.builtin.copy:
        src: /etc/default/gitlab-runner
        dest: "{{ backup_dir }}/gitlab-runner-default"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when:
        - runner_default_stat.stat.exists


    # ==========================================================
    # 14. Backup systemd configuration
    # ==========================================================

    - name: Save systemd Runner configuration
      ansible.builtin.shell:
        cmd: |
          systemctl cat {{ runner_service }} \
          > {{ backup_dir }}/systemd-unit.txt 2>&1 || true
      changed_when: false

    - name: Save Runner service status
      ansible.builtin.shell:
        cmd: |
          systemctl status {{ runner_service }} --no-pager \
          > {{ backup_dir }}/systemd-status-before.txt 2>&1 || true
      changed_when: false


    # ==========================================================
    # 15. Backup package metadata
    # ==========================================================

    - name: Save package information
      ansible.builtin.shell:
        cmd: |
          dpkg-query -W -f='Package: ${Package}\nVersion: ${Version}\nArchitecture: ${Architecture}\nStatus: ${Status}\n' \
          {{ runner_package }} \
          > {{ backup_dir }}/package-info.txt
      changed_when: false

    - name: Save APT policy
      ansible.builtin.shell:
        cmd: |
          apt-cache policy {{ runner_package }} \
          > {{ backup_dir }}/apt-policy.txt 2>&1
      changed_when: false


    # ==========================================================
    # 16. Secure exact rollback package
    # ==========================================================

    - name: Check APT cache for current package
      ansible.builtin.shell:
        cmd: |
          find /var/cache/apt/archives \
            -maxdepth 1 \
            -type f \
            -name '{{ runner_package }}_*.deb' \
            -print
      register: cached_runner_packages
      changed_when: false

    - name: Attempt to download exact installed package
      ansible.builtin.command:
        cmd: >
          apt-get download
          {{ runner_package }}={{ installed_package_version }}
      args:
        chdir: "{{ backup_dir }}"
      register: rollback_package_download
      changed_when: true
      failed_when: false


    # ==========================================================
    # 17. Locate rollback package
    # ==========================================================

    - name: Find downloaded rollback package
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns:
          - "gitlab-runner_*.deb"
        file_type: file
      register: rollback_package_files

    - name: Abort if rollback package cannot be secured
      ansible.builtin.fail:
        msg:
          - "=============================================="
          - "UPGRADE ABORTED"
          - "=============================================="
          - "A newer vendor version is available:"
          - "{{ latest_vendor_version }}"
          - ""
          - "BUT the exact currently installed package"
          - "could not be downloaded for rollback:"
          - "{{ installed_package_version }}"
          - ""
          - "The Runner has NOT been upgraded."
          - ""
          - "This is intentional production safety."
          - "=============================================="
      when:
        - rollback_package_files.files | length == 0


    # ==========================================================
    # 18. Validate backup before upgrade
    # ==========================================================

    - name: Verify configuration backup
      ansible.builtin.stat:
        path: "{{ backup_dir }}/gitlab-runner-config.tar.gz"
      register: config_backup_stat

    - name: Verify rollback package
      ansible.builtin.stat:
        path: "{{ rollback_package_files.files[0].path }}"
      register: rollback_package_stat

    - name: Validate rollback prerequisites
      ansible.builtin.assert:
        that:
          - config_backup_stat.stat.exists
          - rollback_package_stat.stat.exists
          - rollback_package_stat.stat.size > 0
        fail_msg: >
          Required rollback backup could not be validated.
          Upgrade aborted.


    # ==========================================================
    # 19. Verify Runner before upgrade
    # ==========================================================

    - name: Verify Runner registration before upgrade
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: runner_verify_before
      changed_when: false
      failed_when: false

    - name: Save pre-upgrade Runner verification
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/runner-verify-before.txt"
        mode: "0600"
        content: |
          Return code:
          {{ runner_verify_before.rc }}

          STDOUT:
          {{ runner_verify_before.stdout }}

          STDERR:
          {{ runner_verify_before.stderr }}


    # ==========================================================
    # 20. Upgrade
    # ==========================================================

    - name: Upgrade to exact vendor package
      ansible.builtin.apt:
        name: "{{ runner_package }}={{ latest_vendor_package_version }}"
        state: present
        update_cache: true
      register: upgrade_result


    # ==========================================================
    # 21. Restart service
    # ==========================================================

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - upgrade_result.changed

    - name: Restart GitLab Runner
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: restarted
        enabled: true
      when:
        - upgrade_result.changed


    # ==========================================================
    # 22. Service health check
    # ==========================================================

    - name: Check Runner service
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: runner_service_health
      retries: "{{ health_check_retries }}"
      delay: "{{ health_check_delay }}"
      until: runner_service_health.rc == 0
      changed_when: false
      failed_when: false


    # ==========================================================
    # 23. Check binary
    # ==========================================================

    - name: Check upgraded Runner binary
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: upgraded_runner_version
      changed_when: false
      failed_when: false


    # ==========================================================
    # 24. Check Runner registration
    # ==========================================================

    - name: Verify upgraded Runner
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: upgraded_runner_verify
      changed_when: false
      failed_when: false


    # ==========================================================
    # 25. Determine health
    # ==========================================================

    - name: Determine post-upgrade health
      ansible.builtin.set_fact:
        runner_health_ok: >-
          {{
            runner_service_health.rc == 0
            and upgraded_runner_version.rc == 0
            and upgraded_runner_verify.rc == 0
          }}


    # ==========================================================
    # 26. Save post-upgrade diagnostics
    # ==========================================================

    - name: Save post-upgrade version
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/version-after.txt"
        mode: "0600"
        content: |
          {{ upgraded_runner_version.stdout }}

    - name: Save post-upgrade verification
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/verify-after.txt"
        mode: "0600"
        content: |
          Return code:
          {{ upgraded_runner_verify.rc }}

          STDOUT:
          {{ upgraded_runner_verify.stdout }}

          STDERR:
          {{ upgraded_runner_verify.stderr }}

    - name: Save post-upgrade service status
      ansible.builtin.shell:
        cmd: |
          systemctl status {{ runner_service }} --no-pager \
          > {{ backup_dir }}/systemd-status-after.txt 2>&1 || true
      changed_when: false


    # ==========================================================
    # 27. AUTOMATIC ROLLBACK
    # ==========================================================

    - name: Stop Runner for rollback
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: stopped
      when:
        - not runner_health_ok

    - name: Restore previous GitLab Runner package
      ansible.builtin.apt:
        deb: "{{ rollback_package_files.files[0].path }}"
        state: present
        force: true
      when:
        - not runner_health_ok

    - name: Restore Runner configuration
      ansible.builtin.command:
        cmd: >
          tar
          --preserve-permissions
          --same-owner
          -xzf
          {{ backup_dir }}/gitlab-runner-config.tar.gz
          -C /
      when:
        - not runner_health_ok

    - name: Restore default Runner configuration
      ansible.builtin.copy:
        src: "{{ backup_dir }}/gitlab-runner-default"
        dest: /etc/default/gitlab-runner
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when:
        - not runner_health_ok
        - runner_default_stat.stat.exists

    - name: Reload systemd after rollback
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - not runner_health_ok

    - name: Start Runner after rollback
      ansible.builtin.systemd:
        name: "{{ runner_service }}"
        state: started
        enabled: true
      when:
        - not runner_health_ok


    # ==========================================================
    # 28. Verify rollback
    # ==========================================================

    - name: Check Runner after rollback
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: rollback_version
      changed_when: false
      failed_when: false
      when:
        - not runner_health_ok

    - name: Check Runner service after rollback
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: rollback_service
      changed_when: false
      failed_when: false
      when:
        - not runner_health_ok

    - name: Verify Runner after rollback
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: rollback_verify
      changed_when: false
      failed_when: false
      when:
        - not runner_health_ok


    # ==========================================================
    # 29. Save rollback report
    # ==========================================================

    - name: Save rollback report
      ansible.builtin.copy:
        dest: "{{ backup_dir }}/ROLLBACK-REPORT.txt"
        mode: "0600"
        content: |
          ==============================================
          AUTOMATIC GITLAB RUNNER ROLLBACK
          ==============================================

          Host:
          {{ inventory_hostname }}

          Previous version:
          {{ installed_runner_version }}

          Attempted version:
          {{ latest_vendor_version }}

          Rollback version:
          {{ rollback_version.stdout | default('UNKNOWN') }}

          Service status:
          {{ rollback_service.stdout | default('UNKNOWN') }}

          Verify return code:
          {{ rollback_verify.rc | default('UNKNOWN') }}

          Verify output:
          {{ rollback_verify.stdout | default('') }}

          Verify error:
          {{ rollback_verify.stderr | default('') }}

          Backup:
          {{ backup_dir }}

          ==============================================

      when:
        - not runner_health_ok


    # ==========================================================
    # 30. Fail if rollback occurred
    # ==========================================================

    - name: Report failed upgrade and rollback
      ansible.builtin.fail:
        msg:
          - "=============================================="
          - "GITLAB RUNNER UPGRADE FAILED"
          - "=============================================="
          - "Previous version : {{ installed_runner_version }}"
          - "Attempted version : {{ latest_vendor_version }}"
          - "AUTOMATIC ROLLBACK COMPLETED"
          - "Backup directory  : {{ backup_dir }}"
          - "=============================================="
      when:
        - not runner_health_ok


    # ==========================================================
    # 31. Final success validation
    # ==========================================================

    - name: Get final Runner version
      ansible.builtin.command:
        cmd: gitlab-runner --version
      register: final_runner_version
      changed_when: false

    - name: Get final Runner service state
      ansible.builtin.command:
        cmd: systemctl is-active {{ runner_service }}
      register: final_runner_service
      changed_when: false

    - name: Final Runner verification
      ansible.builtin.command:
        cmd: gitlab-runner verify
      register: final_runner_verify
      changed_when: false


    # ==========================================================
    # 32. Final success report
    # ==========================================================

    - name: Display successful upgrade
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "GITLAB RUNNER UPGRADE SUCCESSFUL"
          - "=============================================="
          - "Host              : {{ inventory_hostname }}"
          - "Previous version  : {{ installed_runner_version }}"
          - "New version       : {{ latest_vendor_version }}"
          - "Service state     : {{ final_runner_service.stdout }}"
          - "Verify RC         : {{ final_runner_verify.rc }}"
          - "Backup directory  : {{ backup_dir }}"
          - "Rollback package  : {{ rollback_package_files.files[0].path }}"
          - "=============================================="
          - "Configuration backup retained."
          - "Package rollback backup retained."
          - "Systemd information retained."
          - "=============================================="
          
